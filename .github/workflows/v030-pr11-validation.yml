name: Validate PHMFactory PR-11 repository cleanup

on:
  push:
    branches:
      - agent/v030-case-collision-history-pr11
    paths:
      - citation.cff
      - contributing.md
      - configs/readme.md
      - src/readme.md
      - tools/repo/check_case_collisions.py
      - docs/archive/audits/phmfactory-v0.3-case-collision-removal.md
      - .github/workflows/repository-layout.yml
      - .github/workflows/v030-pr11-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-contract:
    name: PR-11 path and documentation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR-11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-case-collision-history-pr11
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install documentation and configuration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0" "pydantic>=2.0"

      - name: Validate portable tracked paths
        run: |
          python -m py_compile tools/repo/check_case_collisions.py
          python tools/repo/check_case_collisions.py

      - name: Validate documentation and maintained configurations
        run: |
          python -m scripts.validate_docs
          python -m scripts.validate_configs

      - name: Verify generated configuration Atlas
        run: |
          python -m scripts.gen_config_atlas
          git diff --exit-code docs/CONFIG_ATLAS.md

      - name: Check whitespace errors
        run: git diff --check

      - name: Record successful validation and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          evidence=docs/archive/audits/phmfactory-v0.3-pr11-validation.md
          cat > "${evidence}" <<EOF
          # PHMFactory v0.3 PR-11 validation evidence

          Validation source commit: \`${GITHUB_SHA}\`

          The one-shot branch workflow completed the following checks successfully:

          ```text
          compile tools/repo/check_case_collisions.py     PASS
          case-insensitive tracked-path contract          PASS
          documentation validation                        PASS
          maintained configuration validation             PASS
          generated configuration Atlas parity            PASS
          whitespace validation                           PASS
          ```

          The workflow removed itself after recording this evidence. Runtime smoke,
          Pipeline 06, and UXFD contracts already passed on the unchanged PR-10 parent
          commit \`f22409521da2a6001dd620efd3e21180130d1b52\`.
          EOF

          git rm -- .github/workflows/v030-pr11-validation.yml
          git add "${evidence}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(repo): record PR-11 validation evidence'
          git push origin HEAD:agent/v030-case-collision-history-pr11
