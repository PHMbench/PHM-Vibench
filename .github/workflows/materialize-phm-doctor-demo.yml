name: Materialize PHMFactory doctor and demo commands

on:
  push:
    branches:
      - feat/phm-doctor-demo
    paths:
      - .github/workflows/materialize-phm-doctor-demo.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phm-doctor-demo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Write bounded user CLI
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/phm.py <<'PY'
          """Small user-facing helpers around the maintained PHMFactory entrypoint."""

          from __future__ import annotations

          import argparse
          import importlib
          import os
          import subprocess
          import sys
          import tempfile
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Callable, Sequence

          MIN_PYTHON = (3, 10)
          REQUIRED_MODULES = ("yaml", "torch", "numpy", "pandas")
          SMOKE_CONFIG = Path("configs/demo/00_smoke/dummy_dg.yaml")
          SMOKE_OUTPUT = Path("results/demo/dummy_dg_smoke")


          @dataclass(frozen=True)
          class CheckResult:
              name: str
              passed: bool
              detail: str
              remediation: str = ""


          def repository_root() -> Path:
              """Return the repository root containing this module's ``scripts`` package."""
              return Path(__file__).resolve().parents[1]


          def _python_check() -> CheckResult:
              version = sys.version_info[:3]
              passed = version >= MIN_PYTHON
              detail = ".".join(str(value) for value in version)
              remediation = "Install Python 3.10 or newer." if not passed else ""
              return CheckResult("python", passed, detail, remediation)


          def _file_check(root: Path, relative: Path, name: str) -> CheckResult:
              path = root / relative
              passed = path.is_file()
              return CheckResult(
                  name,
                  passed,
                  str(path),
                  f"Run from a complete PHMFactory checkout containing {relative}." if not passed else "",
              )


          def _dependency_checks(
              importer: Callable[[str], object] = importlib.import_module,
          ) -> list[CheckResult]:
              results: list[CheckResult] = []
              for module_name in REQUIRED_MODULES:
                  try:
                      module = importer(module_name)
                  except Exception as exc:  # import failures may wrap native-library errors
                      results.append(
                          CheckResult(
                              f"dependency:{module_name}",
                              False,
                              f"{type(exc).__name__}: {exc}",
                              "Install the repository core requirements in the active environment.",
                          )
                      )
                      continue
                  version = str(getattr(module, "__version__", "available"))
                  results.append(CheckResult(f"dependency:{module_name}", True, version))
              return results


          def _writable_output_check(root: Path) -> CheckResult:
              output_root = root / "results"
              try:
                  output_root.mkdir(parents=True, exist_ok=True)
                  with tempfile.TemporaryDirectory(prefix=".phmfactory-doctor-", dir=output_root):
                      pass
              except OSError as exc:
                  return CheckResult(
                      "output:writable",
                      False,
                      f"{output_root}: {exc}",
                      "Grant write permission or use a writable checkout/output location.",
                  )
              return CheckResult("output:writable", True, str(output_root))


          def collect_doctor_checks(
              root: Path | None = None,
              *,
              importer: Callable[[str], object] = importlib.import_module,
          ) -> list[CheckResult]:
              """Collect deterministic environment checks without starting training."""
              resolved_root = (root or repository_root()).resolve()
              checks = [
                  _python_check(),
                  CheckResult(
                      "repository:root",
                      (resolved_root / ".git").exists() or (resolved_root / "pyproject.toml").is_file(),
                      str(resolved_root),
                      "Run the command from a PHMFactory source checkout." ,
                  ),
                  _file_check(resolved_root, Path("main.py"), "entrypoint:main.py"),
                  _file_check(resolved_root, SMOKE_CONFIG, "config:offline-smoke"),
                  _writable_output_check(resolved_root),
              ]
              checks.extend(_dependency_checks(importer))
              return checks


          def run_doctor(
              root: Path | None = None,
              *,
              importer: Callable[[str], object] = importlib.import_module,
          ) -> int:
              checks = collect_doctor_checks(root, importer=importer)
              for check in checks:
                  status = "PASS" if check.passed else "FAIL"
                  print(f"[{status}] {check.name}: {check.detail}")
                  if check.remediation and not check.passed:
                      print(f"       remediation: {check.remediation}")
              failed = [check for check in checks if not check.passed]
              print(f"doctor: {'PASS' if not failed else 'FAIL'} ({len(checks) - len(failed)}/{len(checks)})")
              return 0 if not failed else 1


          def demo_command(
              root: Path,
              *,
              epochs: int = 1,
              num_workers: int = 0,
          ) -> list[str]:
              if epochs <= 0:
                  raise ValueError("epochs must be a positive integer")
              if num_workers < 0:
                  raise ValueError("num_workers cannot be negative")
              return [
                  sys.executable,
                  str(root / "main.py"),
                  "--config",
                  str(SMOKE_CONFIG),
                  "--override",
                  f"trainer.num_epochs={epochs}",
                  "--override",
                  f"data.num_workers={num_workers}",
              ]


          def run_demo(
              root: Path | None = None,
              *,
              epochs: int = 1,
              num_workers: int = 0,
              dry_run: bool = False,
              runner: Callable[..., subprocess.CompletedProcess[str]] = subprocess.run,
          ) -> int:
              resolved_root = (root or repository_root()).resolve()
              command = demo_command(resolved_root, epochs=epochs, num_workers=num_workers)
              print("command:", " ".join(command))
              if dry_run:
                  print("demo: DRY RUN")
                  return 0
              completed = runner(
                  command,
                  cwd=resolved_root,
                  check=False,
                  text=True,
                  shell=False,
              )
              if completed.returncode == 0:
                  print(f"demo: PASS; inspect {resolved_root / SMOKE_OUTPUT}")
              else:
                  print(f"demo: FAIL (exit={completed.returncode})", file=sys.stderr)
              return int(completed.returncode)


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(
                  prog="python -m scripts.phm",
                  description="PHMFactory environment and offline-demo helpers.",
              )
              commands = parser.add_subparsers(dest="command", required=True)
              commands.add_parser("doctor", help="Check the local source environment without training.")
              demo = commands.add_parser("demo", help="Run the repository-shipped offline smoke demo.")
              demo.add_argument("--epochs", type=int, default=1)
              demo.add_argument("--num-workers", type=int, default=0)
              demo.add_argument("--dry-run", action="store_true")
              return parser


          def main(argv: Sequence[str] | None = None) -> int:
              args = build_parser().parse_args(list(argv) if argv is not None else None)
              if args.command == "doctor":
                  return run_doctor()
              return run_demo(
                  epochs=args.epochs,
                  num_workers=args.num_workers,
                  dry_run=args.dry_run,
              )


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > test/test_phm_user_cli.py <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path
          from types import SimpleNamespace

          import pytest

          from scripts import phm


          def make_repo(tmp_path: Path) -> Path:
              root = tmp_path / "repo"
              (root / "configs/demo/00_smoke").mkdir(parents=True)
              (root / "results").mkdir()
              (root / "main.py").write_text("", encoding="utf-8")
              (root / "pyproject.toml").write_text("", encoding="utf-8")
              (root / phm.SMOKE_CONFIG).write_text("pipeline: Pipeline_01_Fault_Diagnosis\n", encoding="utf-8")
              return root


          def fake_importer(name: str) -> object:
              assert name in phm.REQUIRED_MODULES
              return SimpleNamespace(__version__="test")


          def test_doctor_passes_without_starting_training(tmp_path: Path, capsys) -> None:
              root = make_repo(tmp_path)
              assert phm.run_doctor(root, importer=fake_importer) == 0
              output = capsys.readouterr().out
              assert "doctor: PASS" in output
              assert "entrypoint:main.py" in output
              assert "config:offline-smoke" in output


          def test_doctor_reports_missing_smoke_config(tmp_path: Path, capsys) -> None:
              root = make_repo(tmp_path)
              (root / phm.SMOKE_CONFIG).unlink()
              assert phm.run_doctor(root, importer=fake_importer) == 1
              output = capsys.readouterr().out
              assert "[FAIL] config:offline-smoke" in output
              assert "remediation:" in output


          def test_demo_uses_argument_list_and_existing_main_path(tmp_path: Path) -> None:
              root = make_repo(tmp_path)
              observed = {}

              def runner(command, **kwargs):
                  observed["command"] = command
                  observed.update(kwargs)
                  return subprocess.CompletedProcess(command, 0)

              assert phm.run_demo(root, runner=runner) == 0
              assert observed["command"] == [
                  phm.sys.executable,
                  str(root / "main.py"),
                  "--config",
                  str(phm.SMOKE_CONFIG),
                  "--override",
                  "trainer.num_epochs=1",
                  "--override",
                  "data.num_workers=0",
              ]
              assert observed["cwd"] == root.resolve()
              assert observed["shell"] is False


          def test_demo_dry_run_does_not_spawn(tmp_path: Path) -> None:
              root = make_repo(tmp_path)

              def forbidden(*args, **kwargs):
                  raise AssertionError("dry-run must not spawn a process")

              assert phm.run_demo(root, dry_run=True, runner=forbidden) == 0


          @pytest.mark.parametrize(
              ("epochs", "workers"),
              ((0, 0), (1, -1)),
          )
          def test_demo_rejects_invalid_bounds(tmp_path: Path, epochs: int, workers: int) -> None:
              root = make_repo(tmp_path)
              with pytest.raises(ValueError):
                  phm.demo_command(root, epochs=epochs, num_workers=workers)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path("docs/quickstart.md")
          text = path.read_text(encoding="utf-8")
          old = "## 2. Inspect the configuration\n"
          new = '''## 2. Check the environment and run the offline helper

          Before inspecting or training, verify the source checkout and active environment:

          ```bash
          python -m scripts.phm doctor
          ```

          The command checks Python, the repository entrypoint, the maintained smoke config,
          output-directory writability, and the core Python imports. It does not start training
          and exits non-zero with a remediation message when a required check fails.

          The shortest maintained offline run is:

          ```bash
          python -m scripts.phm demo
          ```

          This is a thin wrapper around the existing one-epoch Dummy command. Inspect the exact
          command without starting a subprocess with `python -m scripts.phm demo --dry-run`.

          ## 3. Inspect the configuration
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("quickstart insertion marker missing")
          text = text.replace(old, new, 1)
          text = text.replace("## 3. Run one offline epoch", "## 4. Run one offline epoch", 1)
          text = text.replace("## 4. Run repository checks", "## 5. Run repository checks", 1)
          text = text.replace("## 5. Run a maintained demo with local data", "## 6. Run a maintained demo with local data", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate bounded feature
        run: |
          python -m py_compile scripts/phm.py test/test_phm_user_cli.py
          python -m pytest -q test/test_phm_user_cli.py
          python -m scripts.phm --help
          python -m scripts.phm demo --dry-run
          python -m scripts.validate_docs
          git diff --check

      - name: Commit workflow-free feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/materialize-phm-doctor-demo.yml
          git add scripts/phm.py test/test_phm_user_cli.py docs/quickstart.md
          git commit -m "feat(cli): add doctor and offline demo helpers"
          git push origin HEAD:feat/phm-doctor-demo
