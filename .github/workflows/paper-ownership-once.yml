name: paper-ownership-once
on:
  push:
    branches: [cleanup/paper-ownership-20261105]
    paths: [.github/workflows/paper-ownership-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Complete the existing source migration without workflow writes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/cleanup/paper-ownership-20261105
          test "$(git rev-parse HEAD^)" = 5d71bae6f2fbc0a53e8d0d2777668117b483c232
          git show 5d71bae6f2fbc0a53e8d0d2777668117b483c232:.github/workflows/paper-ownership-once.yml > "$RUNNER_TEMP/original-migration.yml"
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml
          workflow = yaml.safe_load((Path(os.environ['RUNNER_TEMP']) / 'original-migration.yml').read_text())
          run = workflow['jobs']['migrate']['steps'][1]['run']
          source = run.split("python - <<'PY'\n", 1)[1].split('\nPY\n', 1)[0]
          (Path(os.environ['RUNNER_TEMP']) / 'approved-migration.py').write_text(source)
          PY
          python "$RUNNER_TEMP/approved-migration.py"
          python - <<'PY'
          from pathlib import Path
          p = Path('test/test_llm_explanation_models.py')
          p.write_text(p.read_text().replace('build_llm_packet, export_xoan_state, state_from_tspn_uxfd_fuzzy_trace,', 'build_llm_packet, state_from_tspn_uxfd_fuzzy_trace,'))
          PY
          python -m pip install --disable-pip-version-check PyYAML pydantic
          python -m scripts.gen_config_atlas
          python -m scripts.gen_support_matrix
          git diff -- .github/workflows > "$RUNNER_TEMP/engine-workflows.patch"
          # GITHUB_TOKEN has no workflow-write scope; those edits use the authorized connector.
          git restore -- .github/workflows
          git add -- phmfactory src configs test scripts CORE.md AGENTS.md CONTRIBUTING.md .github/PULL_REQUEST_TEMPLATE.md tools/repo/check_paper_migration_status.py docs/CONFIG_ATLAS.md SUPPORTED_COMPONENTS.md SUPPORTED_COMBINATIONS.md doc/changelog/2026-11-05-paper-ownership.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: move P06/P07 ownership out of the shared runtime'
          git push origin HEAD:refs/heads/cleanup/paper-ownership-20261105
          git archive --format=tar.gz -o "$RUNNER_TEMP/engine-paper-ownership-source.tar.gz" HEAD
          tar -czf "$RUNNER_TEMP/engine-git-metadata.tar.gz" .git/HEAD .git/objects .git/refs .git/shallow .git/index
      - uses: actions/upload-artifact@v4
        with:
          name: engine-paper-ownership-source
          path: |
            ${{ runner.temp }}/engine-paper-ownership-source.tar.gz
            ${{ runner.temp }}/engine-git-metadata.tar.gz
            ${{ runner.temp }}/engine-workflows.patch
          retention-days: 3
