name: paper-ownership-once
on:
  push:
    branches: [cleanup/paper-ownership-20261105]
    paths: [.github/workflows/paper-ownership-once.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prepare final reviewed file objects without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cc7d90458b42d382e4f404b9dd9ae47445be58a1
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, urllib.request
          p=Path('phmfactory/explanation/adapters.py')
          p.write_text(p.read_text().replace('    "export_xoan_state",\n','').replace('    "state_from_xoan_report",\n',''))
          p=Path('test/test_trainer_lifecycle_schema.py')
          s=p.read_text().replace('["trainer.user_note=explicit", "trainer.preset_version=fixture-v1"]','["trainer.preset_version=fixture-v1"]').replace('    assert trainer["user_note"] == "explicit"\n','')
          p.write_text(s)
          p=Path('docs/model_catalog/MODEL_CATALOGUE.csv')
          s=p.read_text().replace('source:M009,Model_Candidates!10,XOANOperatorPath,,,https://github.com/PHMbench/PHM-Vibench,,,,DISCOVERED,,NONE,,,,','source:M009,Model_Candidates!10,XOANOperatorPath,,,https://github.com/AI4Engineering-L/P07-XOAN-Operator-Attention,,,,DISCOVERED,,NONE,,,,Historical paper-owned implementation; not shipped by PHMFactory')
          p.write_text(s)
          p=Path('.github/workflows/core-quality-gates.yml')
          s=p.read_text();old='      - name: Verify P07 bounded sparsemax contract\n        run: python -m pytest test/test_p07_bounded_operator_path.py -q\n\n'
          assert old in s
          p.write_text(s.replace(old,''))
          p=Path('.github/workflows/paper-migration-status.yml')
          content='''name: Paper migration status

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            tracker:
              name: Paper ownership and migration contract
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    submodules: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.10"
                - name: Install existing checker dependency
                  run: python -m pip install PyYAML
                - name: Enforce ownership and completed historical migrations
                  env:
                    BASE_REF: __BASE_EXPRESSION__
                  shell: bash
                  run: |
                    set -euo pipefail
                    args=()
                    if [[ -n "$BASE_REF" && "$BASE_REF" != 0000000000000000000000000000000000000000 ]]; then
                      args=(--base-ref "$BASE_REF")
                    fi
                    python tools/repo/check_paper_migration_status.py --mode release "${args[@]}" | tee paper-migration-release.txt
                - uses: actions/upload-artifact@v4
                  with:
                    name: phmfactory-v030-paper-migration-status
                    path: paper-migration-release.txt
                    if-no-files-found: error
          '''
          content=content.replace('__BASE_EXPRESSION__', '$'+'{{ github.event.pull_request.base.sha || github.event.before }}')
          p.write_text(content)
          p=Path('tools/repo/check_paper_migration_status.py')
          s=p.read_text().replace('if not path.startswith(("doc/changelog/", "docs/archive/")):', 'if not (path.endswith(".md") and path.startswith(("doc/changelog/", "docs/archive/audits/"))):')
          s=s.replace('        path = ""\n        for line in diff.splitlines():', '        paper_binding = re.compile(r"phmfactory\\.p06|p07_protocol|P07OperatorPath|XOANOperatorPath|(?:module\\s*[:=]\\s*[\\\"\\\']?)(?:paper\\.|P4\\.|[Pp][0-9]{2}\\.)")\n        path = ""\n        for line in diff.splitlines():')
          s=s.replace('            elif paper_import.search(line):','            elif line.startswith("+") and (paper_import.search(line) or paper_binding.search(line)):')
          p.write_text(s)
          p=Path('docs/LLM_EXPLANATION_INTEGRATION.md')
          s=p.read_text().replace('    export_xoan_state,\n','');a=s.index('## XOAN operator-path model');b=s.index('## TSPN-UXFD fuzzy model',a)
          s=s[:a]+'## Paper-specific adapters\n\nPaper-owned models export the shared `PHMExplanationState` from their own\nrepository. PHMFactory does not import a paper model or ship its adapter.\nThe former XOAN-specific exports have moved with the historical P07 source;\nthere is no compatibility forwarding import. This does not remove the generic\nstate, provider callback, reference validation or fuzzy-model interface below.\n\n'+s[b:]
          p.write_text(''.join(l for l in s.splitlines(keepends=True) if not l.startswith('| `XOANOperatorPath`')))
          p=Path('paper/project/README.md')
          s=p.read_text().replace('`SOURCE_MAP.yaml` is the audited\nmapping authority.', '`SOURCE_MAP.yaml` preserves the historical migration mapping, not current\nimplementation ownership or permission to add paper material.')
          s=s.replace('The executable P07 runtime is maintained in\n`configs/experiments/p07_xoan_operator_attention/`.', 'P07 code, study configurations and tests are maintained in\n`AI4Engineering-L/P07-XOAN-Operator-Attention`: active bounded DAG code in\n`P4/`, retired XOAN protocol in `legacy/p07_protocol/` and `legacy/p07_runtime/`.\nNo P07 implementation remains in the shared runtime.')
          p.write_text(s)
          p=Path('paper/project/SOURCE_MAP.yaml')
          p.write_text('# Historical source mapping. active_runtime fields below describe the recorded\n# migration, not current ownership. See README.md and CORE.md section 3.\n'+p.read_text())
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          entries=[]
          for name in paths:
              body=json.dumps({'content':Path(name).read_text(), 'encoding':'utf-8'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request) as response:
                  blob=json.load(response)
              entries.append(dict(path=name,mode='100644',type='blob',sha=blob['sha']))
          entries.append(dict(path='.github/workflows/paper-ownership-once.yml',mode='100644',type='blob',sha=None))
          out=Path(os.environ['RUNNER_TEMP'])/'final-engine-tree.json'
          out.write_text(json.dumps(entries,indent=2))
          print('Prepared',len(paths),'validated file objects; no branch ref was changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-engine-tree
          path: ${{ runner.temp }}/final-engine-tree.json
          retention-days: 1
