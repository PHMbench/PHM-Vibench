name: Streamlit quality gates

on:
  pull_request:
    paths:
      - "apps/streamlit/**"
      - "test/test_streamlit_*.py"
      - "test/requirements.txt"
      - "scripts/config_inspect.py"
      - "phmfactory/config.py"
      - "phmfactory/pipelines.py"
      - "src/config_schema/**"
      - "configs/base/**"
      - "configs/demo/00_smoke/**"
      - "configs/config_registry.csv"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/streamlit-quality-gates.yml"
  push:
    branches:
      - main
    paths:
      - "apps/streamlit/**"
      - "test/test_streamlit_*.py"
      - "test/requirements.txt"
      - "scripts/config_inspect.py"
      - "phmfactory/config.py"
      - "phmfactory/pipelines.py"
      - "src/config_schema/**"
      - "configs/base/**"
      - "configs/demo/00_smoke/**"
      - "configs/config_registry.csv"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/streamlit-quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Streamlit focused tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install optional UI and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
          python -m pip install -r apps/streamlit/requirements.txt
          python -m pip install -r test/requirements.txt

      - name: Compile optional UI modules
        run: >-
          python -c "import glob, py_compile;
          [py_compile.compile(path, doraise=True)
          for path in glob.glob('apps/streamlit/*.py')]"

      - name: Import maintained UI with real Streamlit
        run: python -c "import apps.streamlit.app"

      - name: Run focused Streamlit tests
        run: >-
          python -m pytest -q
          --junitxml=streamlit-pytest-${{ matrix.os }}.xml
          test/test_streamlit_config_service.py
          test/test_streamlit_runtime_policy.py
          test/test_streamlit_onboarding.py
          test/test_streamlit_run_service.py
          test/test_streamlit_result_service.py
          test/test_streamlit_ui_imports.py

      - name: Upload focused Streamlit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-focused-${{ matrix.os }}
          path: streamlit-pytest-${{ matrix.os }}.xml
          if-no-files-found: error
          retention-days: 7

  public-integration:
    name: Streamlit public inspector and Dummy integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU Torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - name: Install PHMFactory and the minimum supported Streamlit
        run: python -m pip install -e . "streamlit==1.37.0" "pytest>=7"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Exercise current inspector and real Dummy subprocess
        run: python -m pytest test/test_streamlit_public_contract.py -q --junitxml=streamlit-public.xml
      - name: Exercise the actual page with AppTest
        run: python -m pytest test/test_streamlit_app.py -q --junitxml=streamlit-page.xml
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-public-integration
          path: |
            streamlit-public.xml
            streamlit-page.xml
          if-no-files-found: warn
          retention-days: 7
