name: Apply reviewed P01 DG runtime patch
on:
  push:
    branches: [feat/p01-multiview-dg-20261003]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/p01-multiview-dg-20261003
          fetch-depth: 0
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base=57a0afda5889641b151983baa3306dcb71f75516
          git merge-base --is-ancestor "$base" HEAD
          changed=$(git diff --name-only "$base"...HEAD)
          test "$changed" = ".github/workflows/p01-apply-reviewed.yml"
          cat >/tmp/p.xz.b64 <<'PATCH'
[... ELLIPSIZATION ...]
PATCH
          base64 -d /tmp/p.xz.b64 | xz -d >/tmp/p.patch
          echo "ec50bef74b019fb25e710a595a409b1584ac35e67c0a5b12b30a766f28b4f742  /tmp/p.patch" | sha256sum -c -
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
          git rm .github/workflows/p01-apply-reviewed.yml
          git diff --check
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add experiments/p01 test/test_p01_multiview_dg.py
          git commit -m "experiment(p01): source-only multi-view DG, HPO and frozen comparison"
          git push origin HEAD:feat/p01-multiview-dg-20261003
