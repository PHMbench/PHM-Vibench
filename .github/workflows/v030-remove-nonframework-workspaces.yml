name: Remove archived PHMFactory non-framework workspaces

on:
  push:
    branches:
      - agent/v030-workspace-migration-pr10
    paths:
      - .github/workflows/v030-remove-nonframework-workspaces.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical PR-10 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-workspace-migration-pr10
          fetch-depth: 0
          submodules: false

      - name: Verify immutable preservation scope
        shell: bash
        run: |
          set -euo pipefail

          baseline=a331769d4005018bc833534ecf4efeb5e8a5a78d

          test "$(git ls-files .archive | wc -l | tr -d ' ')" = "1"
          test "$(git ls-files dev | wc -l | tr -d ' ')" = "114"
          git diff --quiet "${baseline}" HEAD -- .archive dev

          test "$(git hash-object results/README.md)" = "8aee63ebb3e992f241314349d8195ad59332c09f"
          test "$(git hash-object metrics_reports/README.md)" = "4b9e74841619784841247960d897f4d1231b94b0"

          rotor_entry="$(git ls-tree HEAD -- data/Rotor_simulation)"
          lq_entry="$(git ls-tree HEAD -- paper/LQ_vibench_fix)"
          test "${rotor_entry}" = "160000 commit d46d089c5a086965dda5555734692114bc347437\tdata/Rotor_simulation"
          test "${lq_entry}" = "160000 commit 1a15710fd532fad73c552704f48349576d843ee0\tpaper/LQ_vibench_fix"

          test "$(git config -f .gitmodules --get submodule.data/Rotor_simulation.path)" = "data/Rotor_simulation"
          test "$(git config -f .gitmodules --get submodule.paper/LQ_vibench_fix.path)" = "paper/LQ_vibench_fix"

          test -f docs/archive/audits/phmfactory-v0.3-nonframework-workspace-removal.md

      - name: Remove only approved workspaces and personal gitlinks
        shell: bash
        run: |
          set -euo pipefail

          git rm -r -- .archive dev
          git rm -- results/README.md metrics_reports/README.md
          git rm -- data/Rotor_simulation paper/LQ_vibench_fix

          git config -f .gitmodules --remove-section submodule.data/Rotor_simulation
          git config -f .gitmodules --remove-section submodule.paper/LQ_vibench_fix

          python - <<'PY'
          from pathlib import Path

          path = Path('src/README.md')
          text = path.read_text(encoding='utf-8')
          old = (
              'UXFD merge:\n'
              '- Final plan: `paper/LQ_vibench_fix/merge_uxfd/12_18temp/codex/final_plan.md`\n\n'
          )
          if old not in text:
              raise SystemExit('expected personal-paper reference is missing from src/README.md')
          text = text.replace(old, '')
          path.write_text(text, encoding='utf-8')
          PY

          git rm -- .github/workflows/v030-inventory-nonframework-workspaces.yml
          git rm -- .github/workflows/v030-remove-nonframework-workspaces.yml

      - name: Verify bounded final tree
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(git ls-files .archive dev results metrics_reports)"
          test -z "$(git ls-tree HEAD -- data/Rotor_simulation paper/LQ_vibench_fix)"
          test -d reports
          test -d plot

          test "$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | wc -l | tr -d ' ')" = "8"
          ! git config -f .gitmodules --get-regexp 'Rotor_simulation|LQ_vibench_fix'

          git diff --cached --check

          allowed='^(\.archive/|dev/|results/README\.md$|metrics_reports/README\.md$|data/Rotor_simulation$|paper/LQ_vibench_fix$|\.gitmodules$|src/README\.md$|\.github/workflows/v030-inventory-nonframework-workspaces\.yml$|\.github/workflows/v030-remove-nonframework-workspaces\.yml$)'
          unexpected="$(git diff --cached --name-only | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            printf 'Deletion escaped approved paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit bounded migration
        shell: bash
        run: |
          set -euo pipefail
          git add .gitmodules src/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v0.3): remove archived non-framework workspaces"
          git push origin HEAD:agent/v030-workspace-migration-pr10
