name: Remediate PR 127 final review findings

on:
  push:
    branches:
      - agent/v030-canonical-integration-r2
    paths:
      - .github/workflows/remediate-pr127-final-review.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-canonical-integration-r2
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tools/repo/check_case_collisions.py",
              '            groups[f"directory:{_portable_key(prefix)}"].add(prefix)\n',
              '            groups[_portable_key(prefix)].add(prefix)\n',
          )

          case_test = '''\n\ndef test_detects_file_directory_case_collisions() -> None:\n    groups = _groups(("foo", "FOO/bar.txt"))\n    assert ("FOO", "foo") in groups\n'''
          path = Path("test/test_case_collision_guard.py")
          text = path.read_text(encoding="utf-8")
          if "test_detects_file_directory_case_collisions" not in text:
              path.write_text(text.rstrip() + case_test + "\n", encoding="utf-8")

          replace_once(
              "phmfactory/data_sources/bundle.py",
              '''def _positive_int(value: Any) -> int | None:\n    if value is None or value == "":\n        return None\n    try:\n        parsed = int(float(value))\n    except (TypeError, ValueError) as exc:\n        raise BundleValidationError(f"Expected a positive integer, found {value!r}") from exc\n    if parsed <= 0:\n        raise BundleValidationError(f"Expected a positive integer, found {value!r}")\n    return parsed\n''',
              '''def _positive_int(value: Any) -> int | None:\n    if value is None or value == "":\n        return None\n    try:\n        numeric = float(value)\n    except (TypeError, ValueError) as exc:\n        raise BundleValidationError(f"Expected a positive integer, found {value!r}") from exc\n    if not numeric.is_integer() or numeric <= 0:\n        raise BundleValidationError(f"Expected a positive integer, found {value!r}")\n    return int(numeric)\n''',
          )

          data_test = '''\n\n@pytest.mark.parametrize(\n    ("sample_length", "channel_count"),\n    [(4.5, 2), (4, 2.5)],\n)\ndef test_validate_bundle_rejects_fractional_shape_metadata(\n    tmp_path: Path,\n    sample_length: float,\n    channel_count: float,\n) -> None:\n    root = _write_bundle(tmp_path / "bundle")\n    _write_workbook(\n        root / "metadata.xlsx",\n        [\n            "Id",\n            "Name",\n            "Sample_lenth",\n            "Channel",\n            "Dataset_id",\n            "Label",\n            "Domain_id",\n        ],\n        [\n            [1, "RM_001_CWRU", sample_length, channel_count, 1, 0, 0],\n            [2, "RM_001_CWRU", 4, 2, 1, 1, 1],\n        ],\n    )\n    with pytest.raises(BundleValidationError, match="positive integer"):\n        validate_bundle(root)\n'''
          path = Path("test/test_phmfactory_data_sources.py")
          text = path.read_text(encoding="utf-8")
          if "test_validate_bundle_rejects_fractional_shape_metadata" not in text:
              path.write_text(text.rstrip() + data_test + "\n", encoding="utf-8")
          PY

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7" "PyYAML>=6.0" h5py openpyxl

      - name: Validate focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            test/test_case_collision_guard.py \
            test/test_phmfactory_data_sources.py
          python tools/repo/check_case_collisions.py
          git diff --check

      - name: Commit verified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/repo/check_case_collisions.py \
            test/test_case_collision_guard.py \
            phmfactory/data_sources/bundle.py \
            test/test_phmfactory_data_sources.py
          git commit -m "fix(v0.3): close final portability review findings"
          git push origin HEAD:agent/v030-canonical-integration-r2

      - name: Record success evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_FINAL_REVIEW_FIX_APPLIED
          file_directory_case_collision_test: pass
          fractional_shape_metadata_test: pass
          temporary_workflow_cleanup: pending connector deletion"

      - name: Record failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_FINAL_REVIEW_FIX_FAILED
          run_id: ${GITHUB_RUN_ID}
          inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
