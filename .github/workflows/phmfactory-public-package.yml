name: PHMFactory public package

on:
  pull_request:
    paths:
      - "phmfactory/**"
      - "main.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "test/test_phmfactory_entrypoints.py"
      - ".github/workflows/phmfactory-public-package.yml"
  push:
    branches:
      - main
    paths:
      - "phmfactory/**"
      - "main.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "test/test_phmfactory_entrypoints.py"
      - ".github/workflows/phmfactory-public-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-contract:
    name: Public package and entrypoint contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "pytest>=7" PyYAML

      - name: Compile public package and dispatcher
        run: python -m py_compile phmfactory/*.py main.py test/test_phmfactory_entrypoints.py

      - name: Run focused entrypoint tests
        run: >-
          python -m pytest -vv
          --junitxml=pytest-public-package.xml
          test/test_phmfactory_entrypoints.py

      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phmfactory-public-package-pytest
          path: pytest-public-package.xml
          if-no-files-found: error

      - name: Build wheel and source distribution
        run: python -m build

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "phmfactory/__init__.py",
              "phmfactory/__main__.py",
              "phmfactory/cli.py",
              "src/__init__.py",
          }
          missing = sorted(required - names)
          assert not missing, missing
          assert not any(name.startswith(("paper/", "dev/", "results/")) for name in names)
          PY

      - name: Verify clean no-dependency installation
        run: |
          python -m venv /tmp/phmfactory-wheel
          /tmp/phmfactory-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/phmfactory-wheel/bin/python -c "import phmfactory, src; print(phmfactory.__version__)"
          /tmp/phmfactory-wheel/bin/python -m pip install PyYAML
          /tmp/phmfactory-wheel/bin/phmfactory --help
          /tmp/phmfactory-wheel/bin/python -m phmfactory --help
