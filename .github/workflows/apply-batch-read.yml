name: Temporary batch read correction
on:
  push:
    branches: [fix/streamlit-editor-independent-monitor-20260909]
    paths: [.github/workflows/apply-batch-read.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/streamlit-editor-independent-monitor-20260909
      - name: Apply frontend correction
        run: |
          set -euo pipefail
          git apply --check .batch-read-review.patch
          git apply .batch-read-review.patch
          git diff --check
          python -m py_compile apps/streamlit/run_service.py apps/streamlit/ui_batch.py test/test_streamlit_app.py test/test_streamlit_batch_execution.py
          git add apps/streamlit/run_service.py apps/streamlit/ui_batch.py test/test_streamlit_app.py test/test_streamlit_batch_execution.py doc/changelog/2026-09-09-streamlit-independent-monitor.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(streamlit): report malformed batch records without disabling the editor'
          git push origin HEAD:fix/streamlit-editor-independent-monitor-20260909
