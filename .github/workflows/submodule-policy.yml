name: Submodule policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Deny-by-default submodule contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository without submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install focused dependencies
        run: python -m pip install PyYAML pytest

      - name: Compile policy checker
        run: python -m py_compile tools/repo/check_submodule_policy.py

      - name: Validate structural policy
        run: python tools/repo/check_submodule_policy.py --mode policy | tee submodule-policy.txt

      - name: Run focused policy tests
        run: python -m pytest -q test/test_submodule_policy.py

      - name: Require release-mode submodule policy to pass
        run: python tools/repo/check_submodule_policy.py --mode release | tee submodule-release.txt

      - name: Require zero submodule release blockers
        shell: bash
        run: |
          set -euo pipefail
          grep -q '0 release blocker(s)' submodule-release.txt
          if grep -Eq 'PHM_DATA_FACTORY_BACKEND_PENDING|LEGACY_SUBMODULE_REMAINS|BACKEND_DEFERRAL_(MISSING|INVALID|CONFLICT)' submodule-release.txt; then
            echo "Resolved submodule blocker returned." >&2
            exit 1
          fi

      - name: Upload policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: phmfactory-v030-submodule-policy
          path: |
            submodule-policy.txt
            submodule-release.txt
          if-no-files-found: error
