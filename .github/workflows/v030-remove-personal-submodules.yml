name: Remove archived personal submodules

on:
  pull_request:
    branches:
      - agent/v030-submodule-inventory-batch5
    paths:
      - .github/workflows/v030-remove-personal-submodules.yml

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/v030-remove-personal-submodules-batch6

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-remove-personal-submodules-batch6
          fetch-depth: 0
          submodules: false

      - name: Verify exact gitlinks and public definitions
        shell: bash
        run: |
          set -euo pipefail

          verify_gitlink() {
            local path="$1"
            local expected_sha="$2"
            local entry
            entry="$(git ls-tree HEAD -- "$path")"
            printf 'Verifying %s: %s\n' "$path" "$entry"
            printf '%s\n' "$entry" \
              | grep -Fx $'160000 commit '"${expected_sha}"$'\t'"${path}"
          }

          verify_gitlink \
            "data/Rotor_simulation" \
            "d46d089c5a086965dda5555734692114bc347437"
          verify_gitlink \
            "paper/LQ_vibench_fix" \
            "1a15710fd532fad73c552704f48349576d843ee0"

          if git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
            | grep -E $'\t?(data/Rotor_simulation|paper/LQ_vibench_fix)$'; then
            echo "Removed paths still exist in .gitmodules." >&2
            exit 1
          fi

          if git grep -nE 'data/Rotor_simulation|paper/LQ_vibench_fix' -- \
            'src/**/*.py' 'configs/**' 'test/**' 'scripts/**' '.github/**' ':!*.md'; then
            echo "A runtime/config/test/CI consumer still references a personal submodule." >&2
            exit 1
          fi

      - name: Remove only the approved personal gitlinks
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- data/Rotor_simulation paper/LQ_vibench_fix
          git rm -- .github/workflows/v030-remove-personal-submodules.yml

      - name: Commit scoped gitlink removal
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            git diff --cached --name-only \
              | grep -Ev '^data/Rotor_simulation$|^paper/LQ_vibench_fix$|^\.github/workflows/v030-remove-personal-submodules\.yml$' \
              || true
          )"
          if [ -n "$unexpected" ]; then
            printf 'Cleanup escaped approved paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove archived personal submodule gitlinks"
          git push origin "HEAD:${TARGET_BRANCH}"
