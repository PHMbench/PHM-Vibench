name: Apply main-dev branch policy documentation

on:
  push:
    branches:
      - docs/branch-policy-main-dev
    paths:
      - .github/workflows/apply-main-dev-branch-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out documentation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: docs/branch-policy-main-dev
          fetch-depth: 0

      - name: Apply bounded branch-policy edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              """[SUPPORTED_COMBINATIONS.md](SUPPORTED_COMBINATIONS.md).

## Run the offline example
""",
              """[SUPPORTED_COMBINATIONS.md](SUPPORTED_COMBINATIONS.md).

## Branch policy

`main` is the user-facing stable branch and remains the default branch for cloning,
documentation, and releases. `dev` is the integration and development branch. All
routine feature, fix, documentation, test, CI, cleanup, and migration pull requests
must target `dev`, and topic branches must start from the latest `dev`.

Only an explicitly authorized release-promotion pull request (`dev` or
`release/<version>` to `main`) or an emergency hotfix may target `main`. A hotfix
must be synchronized back to `dev`. Both long-lived branches are pull-request-only;
direct pushes are outside the maintained workflow. See
[CONTRIBUTING.md](CONTRIBUTING.md) for the full contract.

## Run the offline example
""",
          )

          replace_once(
              "README_CN.md",
              """[SUPPORTED_COMBINATIONS.md](SUPPORTED_COMBINATIONS.md) 中记录的维护配置。

## 运行离线示例
""",
              """[SUPPORTED_COMBINATIONS.md](SUPPORTED_COMBINATIONS.md) 中记录的维护配置。

## 分支策略

`main` 是面向用户的稳定分支，并继续作为 clone、用户文档和发布的默认分支；
`dev` 是集成与开发分支。常规功能、修复、文档、测试、CI、清理和迁移 PR
必须以 `dev` 为目标分支，topic branch 也必须从最新 `dev` 创建。

只有明确授权的发布提升 PR（`dev` 或 `release/<version>` → `main`）或紧急
hotfix 可以指向 `main`；hotfix 必须同步回 `dev`。两个长期分支都只能通过
Pull Request 更新，不属于维护流程的直接 push 不应使用。完整规则见
[CONTRIBUTING_CN.md](CONTRIBUTING_CN.md)。

## 运行离线示例
""",
          )

          replace_once(
              "CONTRIBUTING.md",
              "2. Reproduce the behavior on a current `main` checkout when possible.",
              "2. Reproduce user-facing behavior on current `main`; verify development fixes against current `dev`.",
          )

          replace_once(
              "CONTRIBUTING.md",
              """## Development setup

Follow the [installation guide](docs/installation.md). A typical branch starts
from current `main`:

```bash
git switch main
git pull --ff-only origin main
git switch -c <type>/<short-topic>
```
""",
              """## Branch model and development setup

The repository uses two long-lived branches:

```text
main  user-facing stable branch; clone, documentation, release, and supported-state authority
dev   integration and development branch; base for routine pull requests
```

All routine feature, fix, documentation, test, CI, cleanup, and migration pull
requests must target `dev`. Create the topic branch from current `dev`:

```bash
git switch dev
git pull --ff-only origin dev
git switch -c <type>/<short-topic>
```

`main` accepts only:

1. an explicitly authorized release-promotion pull request from `dev` or a
   `release/<version>` branch; or
2. an authorized emergency hotfix created from `main`, followed immediately by a
   synchronization or backport to `dev`.

Both `main` and `dev` are pull-request-only branches. Do not push directly to either
branch. The already-open canonical v0.3 integration PR #127 predates this policy and
is the sole transition exception: it remains targeted at `main` because its merge
contract preserves source ancestry. After #127 merges, synchronize the resulting
`main` merge commit into `dev` before accepting further development work.
""",
          )

          replace_once(
              "CONTRIBUTING.md",
              """Commit history does not need to be artificially expanded; pull requests are
normally squash-merged.
""",
              """Commit history does not need to be artificially expanded. Routine topic pull
requests into `dev` may be squash-merged when no provenance or ancestry contract
requires individual commits. Release-promotion pull requests into `main`, and any
migration or provenance pull request whose validation depends on ancestry, must use
a merge commit; squash and rebase are forbidden for those cases.
""",
          )

          replace_once(
              "CONTRIBUTING.md",
              """## Open a pull request

A pull request must include:
""",
              """## Open a pull request

Routine pull requests must use `dev` as their base. A pull request targeting `main`
must identify the approved release-promotion or emergency-hotfix exception in its
description.

A pull request must include:
""",
          )

          replace_once(
              "CONTRIBUTING.md",
              """At least one maintainer review is expected for merge. The repository normally uses
squash merge after required checks pass.
""",
              """At least one maintainer review and the required checks are expected before merge.
Routine topic pull requests merge into `dev`. Promotion from `dev` or
`release/<version>` into `main` uses a merge commit so the release boundary and
`dev` ancestry remain auditable.
""",
          )

          replace_once(
              "CONTRIBUTING.md",
              "- direct pushes or unreviewed large changes to `main`;",
              "- direct pushes to `main` or `dev`, or routine pull requests that target `main` instead of `dev`;",
          )

          replace_once(
              "CONTRIBUTING_CN.md",
              "2. 尽可能在最新 `main` 上复现问题。",
              "2. 用户可见问题尽可能在最新 `main` 上复现；开发修复应在最新 `dev` 上验证。",
          )

          replace_once(
              "CONTRIBUTING_CN.md",
              """## 开发环境与分支

按照[安装指南](docs/installation.md)配置环境。典型分支流程：

```bash
git switch main
git pull --ff-only origin main
git switch -c <type>/<short-topic>
```
""",
              """## 分支模型与开发环境

仓库保留两个长期分支：

```text
main  面向用户的稳定分支；是 clone、用户文档、发布和受支持状态的权威来源
dev   集成与开发分支；是常规 Pull Request 的目标分支
```

常规功能、修复、文档、测试、CI、清理和迁移 PR 必须指向 `dev`。topic branch
应从最新 `dev` 创建：

```bash
git switch dev
git pull --ff-only origin dev
git switch -c <type>/<short-topic>
```

`main` 只接受：

1. 经过明确授权、由 `dev` 或 `release/<version>` 发起的发布提升 PR；或
2. 从 `main` 创建的已授权紧急 hotfix，且合并后必须立即同步或回补到 `dev`。

`main` 与 `dev` 都只能通过 Pull Request 更新，不得直接 push。已经打开的
canonical v0.3 集成 PR #127 早于本策略，是唯一的过渡例外：其 source ancestry
合同要求继续指向 `main`。#127 合并后，在接收新的开发工作前，必须先将产生的
`main` merge commit 同步到 `dev`。
""",
          )

          replace_once(
              "CONTRIBUTING_CN.md",
              "仓库通常使用 squash merge，不需要人为制造大量 commit。",
              "不需要人为制造大量 commit。没有 provenance 或 ancestry 合同的常规 topic PR 可以 squash merge 到 `dev`；发布提升以及依赖提交祖先关系的迁移/来源证明 PR 必须使用 merge commit，禁止 squash 或 rebase。",
          )

          replace_once(
              "CONTRIBUTING_CN.md",
              """## 提交 Pull Request

PR 必须说明：
""",
              """## 提交 Pull Request

常规 PR 必须以 `dev` 为 base。指向 `main` 的 PR 必须在描述中注明已批准的
发布提升或紧急 hotfix 例外。

PR 必须说明：
""",
          )

          replace_once(
              "CONTRIBUTING_CN.md",
              "合并前通常需要至少一名维护者 review 和必要检查通过，默认采用 squash merge。",
              "合并前需要至少一名维护者 review 并通过必要检查。常规 topic PR 合并到 `dev`；由 `dev` 或 `release/<version>` 提升到 `main` 时使用 merge commit，以保留发布边界和 `dev` 祖先关系。",
          )

          replace_once(
              "CONTRIBUTING_CN.md",
              "- 未审查的大改动直接进入 `main`；",
              "- 直接 push 到 `main` 或 `dev`，或常规 PR 绕过 `dev` 直接指向 `main`；",
          )

          replace_once(
              "docs/developer_guide.md",
              """## Development workflow

1. Update local `main` and create a focused branch.
""",
              """## Branch topology

`main` is the user-facing stable branch. `dev` is the integration and development
branch. Routine work branches from and returns to `dev`:

```text
feat/* | fix/* | docs/* | test/* | ci/* | cleanup/* | migration/*
                              ↓
                             dev
                              ↓ explicit release promotion only
                            main
```

Only an authorized release promotion or emergency hotfix targets `main`. Hotfixes
must be synchronized back to `dev`. Direct pushes to either long-lived branch are
outside the maintained workflow. Canonical v0.3 PR #127 is the one transition
exception because it predates this policy and must preserve its direct-to-`main`
ancestry contract.

## Development workflow

1. Update local `dev` and create a focused branch that will open a PR back to `dev`.
""",
          )

          replace_once(
              "docs/developer_guide.md",
              """Before requesting review, confirm:

- the diff implements one coherent capability;
""",
              """Before requesting review, confirm:

- the pull request targets `dev` unless it is an explicitly authorized release or hotfix;
- the diff implements one coherent capability;
""",
          )

          workflow = Path(".github/workflows/apply-main-dev-branch-policy.yml")
          workflow.unlink()
          PY

      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.validate_docs
          git diff --check

      - name: Commit bounded documentation changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          expected="$(cat <<'EOF'
           D .github/workflows/apply-main-dev-branch-policy.yml
           M CONTRIBUTING.md
           M CONTRIBUTING_CN.md
           M README.md
           M README_CN.md
           M docs/developer_guide.md
          EOF
          )"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed-file set" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: define main and dev branch policy"
          git push origin HEAD:docs/branch-policy-main-dev
