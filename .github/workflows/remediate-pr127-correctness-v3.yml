name: Remediate PR 127 correctness blockers v3

on:
  push:
    branches:
      - agent/v030-canonical-integration-r2
    paths:
      - .github/workflows/remediate-pr127-correctness-v3.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-canonical-integration-r2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply line-safe bounded patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target for {old!r}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "phmfactory/cli.py",
              "    # Preserve the historical downstream contract: Pipelines receive the source\n"
              "    # requested by the user rather than a generated temporary file.\n",
              "    # Keep the user's source for provenance, but pass the resolved file path to\n"
              "    # the protected runtime so public presets never fall into legacy aliases.\n",
          )
          replace_once(
              "phmfactory/cli.py",
              "    args.config_path = requested_config\n",
              "    args.requested_config = requested_config\n"
              "    args.config_path = str(resolved.path)\n",
          )

          replace_once(
              "test/test_phmfactory_entrypoints.py",
              "from phmfactory.config import ResolvedConfig\n",
              "from phmfactory.config import MAINTAINED_PRESETS, ResolvedConfig, resolve_config_path\n",
          )
          replace_once(
              "test/test_phmfactory_entrypoints.py",
              "        observed[\"config_path\"] = args.config_path\n"
              "        observed[\"resolved_config_path\"] = args.resolved_config_path\n",
              "        observed[\"requested_config\"] = args.requested_config\n"
              "        observed[\"config_path\"] = args.config_path\n"
              "        observed[\"resolved_config_path\"] = args.resolved_config_path\n",
          )
          replace_once(
              "test/test_phmfactory_entrypoints.py",
              "        \"module\": \"src.Pipeline_04_Unified_Evaluation\",\n"
              "        \"config_path\": \"missing.yaml\",\n"
              "        \"resolved_config_path\": \"/tmp/missing.yaml\",\n",
              "        \"module\": \"src.Pipeline_04_Unified_Evaluation\",\n"
              "        \"requested_config\": \"missing.yaml\",\n"
              "        \"config_path\": \"/tmp/missing.yaml\",\n"
              "        \"resolved_config_path\": \"/tmp/missing.yaml\",\n",
          )
          marker = "\n\n@pytest.mark.parametrize(\n    \"command\",\n"
          preset_test = '''

          @pytest.mark.parametrize("preset", tuple(sorted(MAINTAINED_PRESETS)))
          def test_run_passes_maintained_preset_path_to_runtime(
              preset: str,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              observed: dict[str, object] = {}

              def pipeline(args: argparse.Namespace) -> None:
                  observed["requested_config"] = args.requested_config
                  observed["config_path"] = args.config_path

              monkeypatch.setattr(
                  cli.importlib,
                  "import_module",
                  lambda name: SimpleNamespace(pipeline=pipeline),
              )
              args = argparse.Namespace(
                  config=preset,
                  config_path=None,
                  notes="",
                  override=None,
              )

              cli.run(args)

              assert observed["requested_config"] == preset
              assert Path(str(observed["config_path"])) == resolve_config_path(preset)
          '''.replace("          ", "")
          replace_once("test/test_phmfactory_entrypoints.py", marker, preset_test + marker)

          helper_marker = "\n\ndef validate_bundle(\n"
          helper = '''

          def _expected_sha256_for_file(spec: BundleSpec, filename: str) -> str:
              """Resolve one hash pin using provider-neutral logical manifest keys."""
              logical_by_filename = {
                  spec.metadata_file: "metadata",
                  spec.signal_file: "signals",
              }
              if spec.corpus_file:
                  logical_by_filename[spec.corpus_file] = "corpus"

              logical_key = logical_by_filename.get(filename)
              logical_value = str(spec.expected_sha256.get(logical_key, "")) if logical_key else ""
              filename_value = str(spec.expected_sha256.get(filename, ""))
              if (
                  logical_value
                  and filename_value
                  and logical_value.casefold() != filename_value.casefold()
              ):
                  raise BundleValidationError(
                      f"Conflicting SHA-256 pins for {filename}: "
                      f"{logical_key}={logical_value}, {filename}={filename_value}"
                  )
              return logical_value or filename_value
          '''.replace("          ", "")
          replace_once("phmfactory/data_sources/bundle.py", helper_marker, helper + helper_marker)
          replace_once(
              "phmfactory/data_sources/bundle.py",
              "        expected = bundle_spec.expected_sha256.get(report.name)\n",
              "        expected = _expected_sha256_for_file(bundle_spec, report.name)\n",
          )

          replace_once(
              "test/test_phmfactory_data_sources.py",
              "from __future__ import annotations\n\nfrom pathlib import Path\n",
              "from __future__ import annotations\n\nfrom dataclasses import replace\n"
              "from hashlib import sha256\nfrom pathlib import Path\n",
          )
          hash_marker = "\n\ndef test_compare_bundle_hashes_requires_provider_parity(tmp_path: Path) -> None:\n"
          hash_test = '''

          def test_validate_bundle_enforces_logical_hash_keys(tmp_path: Path) -> None:
              root = _write_bundle(tmp_path / "bundle")
              metadata_digest = sha256((root / "metadata.xlsx").read_bytes()).hexdigest()
              signal_digest = sha256((root / "RM_001_CWRU.h5").read_bytes()).hexdigest()
              spec = replace(
                  load_bundle_spec(),
                  expected_sha256={
                      "metadata": metadata_digest,
                      "signals": signal_digest,
                  },
              )
              assert validate_bundle(root, spec=spec).selected_rows == 2

              bad_metadata = replace(
                  spec,
                  expected_sha256={"metadata": "0" * 64, "signals": signal_digest},
              )
              with pytest.raises(BundleValidationError, match="metadata.xlsx"):
                  validate_bundle(root, spec=bad_metadata)

              bad_signals = replace(
                  spec,
                  expected_sha256={"metadata": metadata_digest, "signals": "1" * 64},
              )
              with pytest.raises(BundleValidationError, match="RM_001_CWRU.h5"):
                  validate_bundle(root, spec=bad_signals)

              conflicting = replace(
                  spec,
                  expected_sha256={
                      "metadata": metadata_digest,
                      "metadata.xlsx": "0" * 64,
                      "signals": signal_digest,
                  },
              )
              with pytest.raises(BundleValidationError, match="Conflicting SHA-256 pins"):
                  validate_bundle(root, spec=conflicting)
          '''.replace("          ", "")
          replace_once("test/test_phmfactory_data_sources.py", hash_marker, hash_test + hash_marker)
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7" "PyYAML>=6.0" "h5py" "openpyxl"

      - name: Validate remediation
        run: |
          python -m py_compile \
            phmfactory/cli.py \
            phmfactory/data_sources/bundle.py \
            test/test_phmfactory_entrypoints.py \
            test/test_phmfactory_data_sources.py
          python -m pytest -q \
            test/test_phmfactory_entrypoints.py \
            test/test_phmfactory_config_resolver.py \
            test/test_phmfactory_data_sources.py
          git diff --check

      - name: Commit final workflow-free tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- \
            .github/workflows/remediate-pr127-correctness.yml \
            .github/workflows/remediate-pr127-correctness-v2.yml \
            .github/workflows/remediate-pr127-correctness-v3.yml
          git add \
            phmfactory/cli.py \
            phmfactory/data_sources/bundle.py \
            test/test_phmfactory_entrypoints.py \
            test/test_phmfactory_data_sources.py
          git commit -m "fix(v0.3): close canonical correctness review findings"
          git push origin HEAD:agent/v030-canonical-integration-r2

      - name: Record success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_CORRECTNESS_REMEDIATION_PASS
          run_id: ${GITHUB_RUN_ID}
          validated_head: $(git rev-parse HEAD)
          resolved_preset_path_to_runtime: true
          logical_bundle_hash_keys_enforced: true
          temporary_workflow_present: false"

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_CORRECTNESS_REMEDIATION_FAIL
          run_id: ${GITHUB_RUN_ID}
          inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
