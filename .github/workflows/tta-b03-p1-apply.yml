name: TTA B03 apply P1 correction
on:
  push:
    branches: [feat/tta-b03-sar-20260929]
    paths: [.github/workflows/tta-b03-p1-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tta-b03-sar-20260929
          fetch-depth: 0
      - name: Apply reviewed P1 correction
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gzip -dc > /tmp/p1.patch
          patch -p1 < /tmp/p1.patch
          git add src/task_factory/Components/sar.py test/test_tta_sar.py doc/changelog/2026-09-29-tta-b03-sar.md
          git diff --cached --check
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(tta): reject frozen-state mutation in SAR restore"
          git push origin HEAD:feat/tta-b03-sar-20260929
