name: Finalize PR 127 correctness remediation

on:
  push:
    branches:
      - agent/v030-canonical-integration-r2
    paths:
      - .github/workflows/remediate-pr127-final.yml

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-canonical-integration-r2
          fetch-depth: 0
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Decode and apply final remediation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/repo/remediate_pr127_final.py.gz.b64 | gzip --decompress > /tmp/remediate_pr127_final.py
          python -m py_compile /tmp/remediate_pr127_final.py
          python /tmp/remediate_pr127_final.py

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "pytest>=7" "PyYAML>=6.0" h5py openpyxl

      - name: Run correctness and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            phmfactory/config.py \
            phmfactory/data_sources/bundle.py \
            apps/streamlit/run_service.py \
            examples/cwru_quickstart.py \
            tools/repo/check_submodule_policy.py \
            tools/repo/check_release_readiness.py
          python -m pytest -q \
            test/test_phmfactory_config_resolver.py \
            test/test_phmfactory_entrypoints.py \
            test/test_phmfactory_data_sources.py \
            test/test_streamlit_run_service.py \
            test/test_submodule_policy.py
          python tools/repo/check_submodule_policy.py --mode policy
          python -m scripts.validate_docs
          git diff --check

      - name: Build and test wheel outside repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist *.egg-info
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "configs/__init__.py",
              "configs/demo/00_smoke/dummy_dg.yaml",
              "configs/base/environment/base.yaml",
              "configs/base/data/base_cross_domain.yaml",
              "configs/base/model/backbone_dlinear.yaml",
              "configs/base/task/dg.yaml",
              "configs/base/trainer/default_single_gpu.yaml",
              "data/__init__.py",
              "data/metadata_dummy.csv",
              "data/raw/Dummy_Data/dummy1.csv",
              "data/raw/Dummy_Data/dummy2.csv",
          }
          missing = sorted(required - names)
          assert not missing, missing
          PY
          python -m venv /tmp/phmfactory-final-wheel
          /tmp/phmfactory-final-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/phmfactory-final-wheel/bin/python -m pip install PyYAML
          cd /tmp
          /tmp/phmfactory-final-wheel/bin/python - <<'PY'
          from pathlib import Path
          import data
          from phmfactory.config import resolve_config

          resolved = resolve_config("smoke")
          assert resolved.path.is_file(), resolved.path
          assert resolved.data["data"]["metadata_file"] == "metadata_dummy.csv"
          data_root = Path(data.__file__).resolve().parent
          assert (data_root / "metadata_dummy.csv").is_file()
          assert (data_root / "raw/Dummy_Data/dummy1.csv").is_file()
          assert (data_root / "raw/Dummy_Data/dummy2.csv").is_file()
          PY

      - name: Commit workflow-free remediation tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/remediate-pr127-runtime-followup.yml \
            .github/workflows/remediate-pr127-runtime-followup-v2.yml \
            .github/workflows/remediate-pr127-final.yml \
            tools/repo/remediate_pr127_final.py.gz.b64
          git add -A
          git commit -m "fix(v0.3): close canonical correctness blockers"
          git push origin HEAD:agent/v030-canonical-integration-r2

      - name: Dispatch all canonical validation workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            core-quality-gates.yml \
            repository-layout.yml \
            phmfactory-public-package.yml \
            phmfactory-requirements.yml \
            phmfactory-cwru-bundle.yml \
            streamlit-quality-gates.yml \
            pipeline06-cfm-quality-gates.yml \
            submodule-policy.yml \
            paper-migration-status.yml \
            phmfactory-release-readiness.yml
          do
            gh workflow run "$workflow" --ref agent/v030-canonical-integration-r2
          done

      - name: Record remediation evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_FINAL_REMEDIATION_APPLIED
          validated_parent: 39fc3835227e97a74c615af2e366dc481281df38
          committed_head: $(git rev-parse HEAD)
          correctness_negative_tests: pass
          wheel_external_resolution: pass
          temporary_remediation_workflows: removed
          canonical_workflows_dispatched: 10"

      - name: Record failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_FINAL_REMEDIATION_FAILED
          run_id: ${GITHUB_RUN_ID}
          inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
