name: Remove archived PHMFactory legacy app

on:
  push:
    branches:
      - agent/v030-ui-consolidation-pr09
    paths:
      - .github/workflows/v030-remove-legacy-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-ui-consolidation-pr09
          fetch-depth: 0
          submodules: false

      - name: Verify exact archived source scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.tsv <<'EOF'
          app/README.md	2d30302ba6a61bdcaefea26a6294801f8de994d5
          app/__init__.py	3628a6c14cc25e45d21efb0ed59193bce15a97f9
          app/gui.py	bcccc44b3afa2fd9fc04e29cdcf679333d1a1090
          app/gui_refactored.py	3cc0aad2c30d4cd3ff20d2d511a2687e4ef2f11e
          app/layout.py	3df02d45ed68b2de79e3e352cac8ce647ef9e4a4
          app/pipeline.py	5aa2b6b918ea0ddceba86f72361e2d27a2b06d3c
          app/requirements_gui.txt	32cba6fcb6ea89d12b0f9a64d20071824ffafd49
          app/state.py	7c8742e84d936c8a46e9e2a417708e4f824ed3ac
          app/utils.py	e839ed9be3ffcbf7edd3b289cdca2cede5cfd1c0
          streamlit_app.py	2a8361efa7a984fabacd0008b768af07f7f2b1ec
          EOF

          test "$(git ls-files app streamlit_app.py | wc -l | tr -d ' ')" = "10"
          while IFS=$'\t' read -r path expected; do
            test -f "$path"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected"
          done < /tmp/expected.tsv

      - name: Remove duplicate UI and migrate maintained references
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- app streamlit_app.py

          python - <<'PY'
          from pathlib import Path

          replacements = {
              'apps/streamlit/README.md': [
                  ('python -m py_compile apps/streamlit/*.py streamlit_app.py',
                   'python -m py_compile apps/streamlit/*.py'),
              ],
              'AGENTS_CN.md': [
                  ('- `streamlit run streamlit_app.py` 保留为兼容入口，实际转发到正式工作台。\n', ''),
              ],
              'CLAUDE_CN.md': [
                  ('streamlit run streamlit_app.py', 'streamlit run apps/streamlit/app.py'),
                  ('状态：实验性功能（TODO），建议以 `configs/demo/` 的命令行 demo 为准。',
                   '状态：可选配置工作台；核心训练契约仍以公共 CLI 为准。'),
              ],
              'docs/DEPENDENCY_BOUNDARIES_V0_3.md': [
                  ('The legacy `app/requirements_gui.txt` remains outside this v0.3 ownership contract\nuntil the separate `app/` versus `apps/streamlit/` consolidation PR. It already\ncontains its own historical GUI dependency list.\n\n', ''),
              ],
              'tools/repo/check_requirements.py': [
                  ('"plotly",       # legacy app owns it through app/requirements_gui.txt',
                   '"plotly",       # no maintained runtime import after legacy app removal'),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {name}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          audit = Path('docs/archive/audits/phmfactory-v0.3-legacy-ui-removal.md')
          audit.write_text(
              '''# PHMFactory v0.3 legacy UI removal\n\n'''
              '''## Removed public paths\n\n'''
              '''```text\napp/**\nstreamlit_app.py\n```\n\n'''
              '''The duplicate prototype and root compatibility launcher were removed after exact preservation in the approved personal fork.\n\n'''
              '''## Immutable preservation\n\n'''
              '''```text\nsource head: 00ec30bab7ed92a5142d7954e999bbe654e31fa5\ntracked files: 10\nartifact SHA-256: 4cf870585588c6f5af4c2a71cb95849b19a1d335ae2dd018f3aa040233246897\nprivate archive: upstream-archive/phmfactory-v0.3.0/legacy-ui/tree/\n```\n\n'''
              '''Every archived file was verified against its source Git blob SHA. The public repository does not depend on the private archive.\n\n'''
              '''## Maintained UI\n\n'''
              '''The only maintained UI implementation and launch command are:\n\n'''
              '''```bash\nstreamlit run apps/streamlit/app.py\n```\n\n'''
              '''The UI remains optional and invokes experiments only through the public PHMFactory CLI.\n''',
              encoding='utf-8',
          )
          PY

          git rm -- .github/workflows/v030-archive-legacy-app.yml
          git rm -- .github/workflows/v030-remove-legacy-app.yml

      - name: Verify bounded final change
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app
          test ! -e streamlit_app.py
          test -f apps/streamlit/app.py
          ! git grep -n 'streamlit run streamlit_app.py' -- ':!docs/archive/**'
          ! git grep -n 'app/requirements_gui.txt' -- ':!docs/archive/**'
          python -m py_compile apps/streamlit/*.py

          unexpected="$(
            git diff --cached --name-only \
              | grep -Ev '^app/|^streamlit_app\.py$|^apps/streamlit/README\.md$|^AGENTS_CN\.md$|^CLAUDE_CN\.md$|^docs/DEPENDENCY_BOUNDARIES_V0_3\.md$|^tools/repo/check_requirements\.py$|^docs/archive/audits/phmfactory-v0\.3-legacy-ui-removal\.md$|^\.github/workflows/v030-(archive|remove)-legacy-app\.yml$' \
              || true
          )"
          if [ -n "$unexpected" ]; then
            printf 'UI cleanup escaped approved paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit scoped UI consolidation
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/streamlit/README.md \
            AGENTS_CN.md \
            CLAUDE_CN.md \
            docs/DEPENDENCY_BOUNDARIES_V0_3.md \
            tools/repo/check_requirements.py \
            docs/archive/audits/phmfactory-v0.3-legacy-ui-removal.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(ui): remove archived legacy app workspace"
          git push origin HEAD:agent/v030-ui-consolidation-pr09
