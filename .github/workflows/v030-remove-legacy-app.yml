name: Remove archived PHMFactory legacy app workspace

on:
  pull_request:
    branches:
      - agent/v030-requirements-ownership-pr08
    paths:
      - .github/workflows/v030-remove-legacy-app.yml
  push:
    branches:
      - agent/v030-ui-consolidation-pr09
    paths:
      - .github/workflows/v030-remove-legacy-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: agent/v030-ui-consolidation-pr09

    steps:
      - name: Check out PR-09 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-ui-consolidation-pr09
          fetch-depth: 0
          submodules: false

      - name: Verify exact archived source blobs
        shell: bash
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local line actual
            line="$(git ls-tree HEAD -- "${path}")"
            test -n "${line}"
            actual="$(printf '%s\n' "${line}" | awk '{print $3}')"
            if [ "${actual}" != "${expected}" ]; then
              printf 'Unexpected source blob for %s: expected %s, found %s\n' \
                "${path}" "${expected}" "${actual}" >&2
              exit 1
            fi
          }

          verify_blob app/README.md 2d30302ba6a61bdcaefea26a6294801f8de994d5
          verify_blob app/__init__.py 3628a6c14cc25e45d21efb0ed59193bce15a97f9
          verify_blob app/gui.py bcccc44b3afa2fd9fc04e29cdcf679333d1a1090
          verify_blob app/gui_refactored.py 3cc0aad2c30d4cd3ff20d2d511a2687e4ef2f11e
          verify_blob app/layout.py 3df02d45ed68b2de79e3e352cac8ce647ef9e4a4
          verify_blob app/pipeline.py 5aa2b6b918ea0ddceba86f72361e2d27a2b06d3c
          verify_blob app/requirements_gui.txt 32cba6fcb6ea89d12b0f9a64d20071824ffafd49
          verify_blob app/state.py 7c8742e84d936c8a46e9e2a417708e4f824ed3ac
          verify_blob app/utils.py e839ed9be3ffcbf7edd3b289cdca2cede5cfd1c0
          verify_blob streamlit_app.py 2a8361efa7a984fabacd0008b768af07f7f2b1ec

          test "$(git ls-tree -r --name-only HEAD -- app streamlit_app.py | wc -l | tr -d ' ')" = "10"

      - name: Update maintained UI and dependency documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'apps/streamlit/README.md',
              '# PHM-Vibench Streamlit Experiment Workspace',
              '# PHMFactory Streamlit Experiment Workspace',
          )
          replace_exact(
              'apps/streamlit/README.md',
              'PHM-Vibench. It is a user-facing adapter around the maintained CLI, not a second\ntraining framework.',
              'PHMFactory. It is a user-facing adapter around the maintained CLI, not a second\ntraining framework.',
          )
          replace_exact(
              'apps/streamlit/README.md',
              'streamlit run apps/streamlit/app.py\n```\n\nRun the command from the repository root.',
              'streamlit run apps/streamlit/app.py\n```\n\n`apps/streamlit/app.py` is the only maintained UI entrypoint. The historical\n`app/` prototype and root compatibility launcher were archived outside the public\nframework before removal.\n\nRun the command from the repository root.',
          )
          replace_exact(
              'apps/streamlit/README.md',
              'python -m py_compile apps/streamlit/*.py streamlit_app.py',
              'python -m py_compile apps/streamlit/*.py',
          )

          replace_exact(
              'apps/streamlit/REVIEW.md',
              '3. The official entry point remains small and stable: `apps/streamlit/app.py`.\n'
              '4. The legacy root command remains a compatibility shim instead of maintaining a\n'
              '   second implementation.\n'
              '5. The Run button is enabled only for the exact signature that passed repository\n'
              '   inspection.',
              '3. The official and only maintained entry point is `apps/streamlit/app.py`.\n'
              '4. The historical `app/` prototype and root launcher were archived in the personal\n'
              '   fork and removed from the public framework.\n'
              '5. The Run button is enabled only for the exact signature that passed repository\n'
              '   inspection.',
          )
          replace_exact(
              'apps/streamlit/REVIEW.md',
              '- online mutation of a running experiment;\n- deletion of legacy `app/` prototype modules.',
              '- online mutation of a running experiment.',
          )

          replace_exact(
              'docs/DEPENDENCY_BOUNDARIES_V0_3.md',
              'The legacy `app/requirements_gui.txt` remains outside this v0.3 ownership contract\n'
              'until the separate `app/` versus `apps/streamlit/` consolidation PR. It already\n'
              'owns legacy-only `plotly`; therefore `plotly` is no longer a core dependency.',
              'The legacy `app/` workspace and its separate requirements file were archived in\n'
              'the personal fork and removed from the public framework. `plotly` is not a core or\n'
              'maintained UI dependency because `apps/streamlit/` does not import it.',
          )

          replace_exact(
              'tools/repo/check_requirements.py',
              '    "plotly",       # legacy app owns it through app/requirements_gui.txt',
              '    "plotly",       # no maintained core or apps/streamlit import',
          )
          PY

      - name: Remove only the archived legacy UI paths
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- app streamlit_app.py
          git rm -- \
            .github/workflows/v030-archive-legacy-app.yml \
            .github/workflows/v030-remove-legacy-app.yml
          git add \
            .github/workflows/streamlit-quality-gates.yml \
            apps/streamlit/README.md \
            apps/streamlit/REVIEW.md \
            docs/DEPENDENCY_BOUNDARIES_V0_3.md \
            test/test_streamlit_ui_imports.py \
            tools/repo/check_requirements.py

      - name: Verify final scope and maintained references
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app
          test ! -e streamlit_app.py
          test ! -e .github/workflows/v030-archive-legacy-app.yml
          test ! -e .github/workflows/v030-remove-legacy-app.yml

          ! grep -RIn --fixed-strings 'streamlit_app.py' \
            apps/streamlit \
            .github/workflows/streamlit-quality-gates.yml \
            test/test_streamlit_ui_imports.py
          ! grep -RIn --fixed-strings 'app/requirements_gui.txt' \
            docs/DEPENDENCY_BOUNDARIES_V0_3.md \
            tools/repo/check_requirements.py

          unexpected="$(
            git diff --cached --name-only \
              | grep -Ev '^app/|^streamlit_app\.py$|^\.github/workflows/v030-(archive|remove)-legacy-app\.yml$|^\.github/workflows/streamlit-quality-gates\.yml$|^apps/streamlit/(README|REVIEW)\.md$|^docs/DEPENDENCY_BOUNDARIES_V0_3\.md$|^test/test_streamlit_ui_imports\.py$|^tools/repo/check_requirements\.py$' \
              || true
          )"
          if [ -n "${unexpected}" ]; then
            printf 'Legacy UI removal escaped approved paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

          python -m py_compile test/test_streamlit_ui_imports.py tools/repo/check_requirements.py
          python tools/repo/check_requirements.py

      - name: Commit bounded deletion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(ui): remove archived legacy app workspace'
          git push origin "HEAD:${TARGET_BRANCH}"
