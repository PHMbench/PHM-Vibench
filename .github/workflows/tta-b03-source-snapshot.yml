name: TTA B03 apply validated candidate
on:
  push:
    branches: [feat/tta-b03-sar-20260929]
    paths: [.github/workflows/tta-b03-source-snapshot.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tta-b03-sar-20260929
          fetch-depth: 0
      - name: Apply exact locally validated B03 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/b03-patch.part1 .github/b03-patch.part2 .github/b03-patch.part3 .github/b03-patch.part4 | base64 -d > /tmp/b03.patch.gz
          gzip -dc /tmp/b03.patch.gz > /tmp/b03.patch
          patch -p1 < /tmp/b03.patch
          rm -f .github/b03-patch.part1 .github/b03-patch.part2 .github/b03-patch.part3 .github/b03-patch.part4
          rm -f .github/workflows/tta-b03-source-snapshot.yml
          git add -A
          git diff --cached --check
          git status --short
      - name: Commit validated candidate and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tta): add bounded SAR ordered-stream adaptation (B03)"
          git push origin HEAD:feat/tta-b03-sar-20260929
