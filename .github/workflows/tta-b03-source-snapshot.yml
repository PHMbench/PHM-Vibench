name: TTA B03 temporary source snapshot
on:
  push:
    branches: [feat/tta-b03-sar-20260929]
    paths: [.github/workflows/tta-b03-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07a0355a0f77e8609bb106e5bb45d7acf3b5cf70
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD -o /tmp/phmfactory-b03-base.tar.gz
      - uses: actions/checkout@v4
        with:
          repository: mr-eggplant/SAR
          ref: 20f6e24b17525f34503510afccedc0629b67b7c4
          path: upstream-sar
          persist-credentials: false
      - run: git -C upstream-sar archive --format=tar.gz HEAD -o /tmp/sar-upstream.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tta-b03-source-snapshot
          retention-days: 1
          path: |
            /tmp/phmfactory-b03-base.tar.gz
            /tmp/sar-upstream.tar.gz
