name: Compact PHMFactory v0.3 fingerprint baseline

on:
  pull_request:
    branches:
      - agent/v030-repository-contract
    paths:
      - .github/workflows/v030-compact-fingerprint-baseline.yml

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: agent/v030-runtime-reader-baseline-pr02
      BASELINE_COMMIT: a331769d4005018bc833534ecf4efeb5e8a5a78d

    steps:
      - name: Check out PR-02 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-runtime-reader-baseline-pr02
          fetch-depth: 0
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Replace verbose JSON with compact CSV
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/repo/v030_generate_baseline.py')
          text = path.read_text(encoding='utf-8')

          old = '''    fingerprint_document = {
                      "schema_version": 1,
                      "repository": REPOSITORY,
                      "runtime_baseline_commit": BASELINE_COMMIT,
                      "repository_contract_commit": CONTRACT_COMMIT,
                      "generated_from_head": contract_head,
                      "protected_path_policy": {
                          "prefixes": list(PROTECTED_PREFIXES),
                          "exact": sorted(PROTECTED_EXACT),
                          "pipeline_pattern": "src/Pipeline_*.py",
                      },
                      "protected_python_file_count": len(fingerprints),
                      "parse_error_count": len(parse_errors),
                      "files": fingerprints,
                  }
                  (audit_dir / "phmfactory-v0.3-protected-runtime-fingerprints.json").write_text(
                      json.dumps(fingerprint_document, indent=2, ensure_ascii=False) + "\\n",
                      encoding="utf-8",
                  )
          '''
          new = '''    fingerprint_rows: list[dict[str, object]] = []
                  for item in fingerprints:
                      callable_payload = json.dumps(
                          item["callables"],
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      ).encode("utf-8")
                      fingerprint_rows.append(
                          {
                              "path": item["path"],
                              "file_sha256": item["file_sha256"],
                              "bytes": item["bytes"],
                              "callable_count": len(item["callables"]),
                              "callable_ast_sha256": sha256_bytes(callable_payload),
                              "parse_error": item["parse_error"] or "",
                          }
                      )
                  write_csv(
                      audit_dir / "phmfactory-v0.3-protected-runtime-fingerprints.csv",
                      (
                          "path",
                          "file_sha256",
                          "bytes",
                          "callable_count",
                          "callable_ast_sha256",
                          "parse_error",
                      ),
                      fingerprint_rows,
                  )
          '''
          if old not in text:
              raise SystemExit('verbose fingerprint output block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '`phmfactory-v0.3-protected-runtime-fingerprints.json`',
              '`phmfactory-v0.3-protected-runtime-fingerprints.csv`',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/repo/v030_generate_baseline.py

      - name: Export immutable runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phmfactory-v030-baseline
          mkdir -p /tmp/phmfactory-v030-baseline
          git archive "${BASELINE_COMMIT}" | tar -x -C /tmp/phmfactory-v030-baseline

      - name: Regenerate compact inventories twice
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/archive/audits/phmfactory-v0.3-protected-runtime-fingerprints.json
          outputs=(
            .github/phmfactory-v0.3-submodules.allowlist.yml
            docs/archive/audits/phmfactory-v0.3-runtime-reader-baseline.md
            docs/archive/audits/phmfactory-v0.3-reader-inventory.csv
            docs/archive/audits/phmfactory-v0.3-protected-runtime-fingerprints.csv
            docs/archive/audits/phmfactory-v0.3-personal-path-inventory.csv
            docs/archive/audits/phmfactory-v0.3-boundary-inventory.csv
            docs/archive/audits/phmfactory-v0.3-submodule-baseline.csv
          )
          python tools/repo/v030_generate_baseline.py \
            --snapshot-root /tmp/phmfactory-v030-baseline \
            --output-root . | tee /tmp/compact-summary-first.json
          sha256sum "${outputs[@]}" > /tmp/compact-output-first.sha256
          python tools/repo/v030_generate_baseline.py \
            --snapshot-root /tmp/phmfactory-v030-baseline \
            --output-root . > /tmp/compact-summary-second.json
          sha256sum "${outputs[@]}" > /tmp/compact-output-second.sha256
          diff -u /tmp/compact-summary-first.json /tmp/compact-summary-second.json
          diff -u /tmp/compact-output-first.sha256 /tmp/compact-output-second.sha256
          test "$(wc -l < docs/archive/audits/phmfactory-v0.3-protected-runtime-fingerprints.csv | tr -d ' ')" = "257"

      - name: Update validation record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/archive/audits/phmfactory-v0.3-pr02-validation.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'The fingerprint inventory records full-file SHA-256 plus top-level callable AST\nSHA-256 values.',
              'The compact CSV records one row per protected file: full-file SHA-256, byte count,\ntop-level callable count, and a deterministic aggregate callable-AST SHA-256.',
          )
          text += '''\n## Occam compaction\n\nThe initially generated pretty-printed JSON was replaced before review by a compact\n257-line CSV (header plus 256 protected files). It preserves the required change\ndetection fields while avoiding thousands of low-value diff lines and avoids a forced\nexception to the repository's current global `*.json` ignore rule.\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit compact bounded artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v030-compact-fingerprint-baseline.yml
          git rm -f -- docs/archive/audits/phmfactory-v0.3-protected-runtime-fingerprints.json
          git add \
            tools/repo/v030_generate_baseline.py \
            .github/phmfactory-v0.3-submodules.allowlist.yml \
            docs/archive/audits/phmfactory-v0.3-runtime-reader-baseline.md \
            docs/archive/audits/phmfactory-v0.3-reader-inventory.csv \
            docs/archive/audits/phmfactory-v0.3-protected-runtime-fingerprints.csv \
            docs/archive/audits/phmfactory-v0.3-personal-path-inventory.csv \
            docs/archive/audits/phmfactory-v0.3-boundary-inventory.csv \
            docs/archive/audits/phmfactory-v0.3-submodule-baseline.csv \
            docs/archive/audits/phmfactory-v0.3-pr02-validation.md

          unexpected="$(
            git diff --cached --name-only \
              | grep -Ev '^\.github/workflows/v030-compact-fingerprint-baseline\.yml$|^tools/repo/v030_generate_baseline\.py$|^\.github/phmfactory-v0\.3-submodules\.allowlist\.yml$|^docs/archive/audits/phmfactory-v0\.3-(runtime-reader-baseline\.md|reader-inventory\.csv|protected-runtime-fingerprints\.(json|csv)|personal-path-inventory\.csv|boundary-inventory\.csv|submodule-baseline\.csv|pr02-validation\.md)$' \
              || true
          )"
          if [ -n "${unexpected}" ]; then
            printf 'Compaction escaped approved PR-02 paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(v0.3): compact protected runtime fingerprints'
          git push origin "HEAD:${TARGET_BRANCH}"
