name: Core quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-configs:
    name: Docs and config contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install config-tooling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0" "pydantic>=2.0" "pytest>=7"

      - name: Validate documentation
        run: python -m scripts.validate_docs

      - name: Validate maintained configurations
        run: python -m scripts.validate_configs

      - name: Verify one config truth across public tools
        run: |
          python -m py_compile \
            phmfactory/config.py \
            scripts/config_inspect.py \
            scripts/validate_configs.py \
            test/test_config_analysis_parity.py
          python -m pytest test/test_config_analysis_parity.py -q

      - name: Verify generated configuration atlas
        run: |
          python -m scripts.gen_config_atlas
          git diff --exit-code docs/CONFIG_ATLAS.md

      - name: Verify generated support authority
        run: |
          python -m py_compile scripts/gen_support_matrix.py test/test_support_matrix.py
          python -m pytest test/test_support_matrix.py -q
          python -m scripts.gen_support_matrix
          git diff --exit-code SUPPORTED_COMPONENTS.md SUPPORTED_COMBINATIONS.md

      - name: Check whitespace errors
        run: git diff --check

  pipeline06-shell:
    name: Pipeline 06 shell contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7" "PyYAML>=6"

      - name: Compile Pipeline 06 adapter, shell, and tests
        run: |
          python -m py_compile \
            phmfactory/runtime/pipeline06_adapter.py \
            src/Pipeline_06_Generative_Modeling.py \
            test/generative/test_pipeline06_import.py \
            test/generative/test_pipeline06_preflight.py \
            test/generative/test_pipeline06_dispatch.py \
            test/generative/test_pipeline06_compiled_config.py

      - name: Record focused environment
        run: python -m pip freeze > pipeline06-shell-environment.txt

      - name: Run Pipeline 06 shell tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long \
            test/generative/test_pipeline06_import.py \
            test/generative/test_pipeline06_preflight.py \
            test/generative/test_pipeline06_dispatch.py \
            test/generative/test_pipeline06_compiled_config.py \
            2>&1 | tee pipeline06-shell-pytest.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline06-shell-diagnostics
          path: |
            pipeline06-shell-pytest.log
            pipeline06-shell-environment.txt
          if-no-files-found: warn
          retention-days: 7

  uxfd-focused:
    name: UXFD focused contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"

      - name: Install focused test dependencies
        run: |
          python -m pip install \
            "numpy>=1.20" \
            "pandas>=1.3" \
            "scipy" \
            "einops" \
            "sympy" \
            "pytorch-lightning>=1.5" \
            "pytest>=7"

      - name: Compile UXFD modules
        run: |
          python -m py_compile \
            src/model_factory/X_model/TSPN_UXFD.py \
            src/model_factory/X_model/UXFD/fusion/simple_fusion.py \
            src/model_factory/X_model/UXFD/fuzzy/fuzzy_reasoner.py \
            src/model_factory/X_model/UXFD/operator_attention/operator_attention_1d.py \
            src/model_factory/X_model/UXFD/neurosymbolic/logic_reasoner.py \
            test/test_tspn_uxfd_assembly.py

      - name: Record focused environment
        run: python -m pip freeze > uxfd-focused-environment.txt

      - name: Run UXFD assembly tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest test/test_tspn_uxfd_assembly.py -vv --tb=long 2>&1 | tee uxfd-pytest.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uxfd-focused-diagnostics
          path: |
            uxfd-pytest.log
            uxfd-focused-environment.txt
          if-no-files-found: warn
          retention-days: 7

  offline-smoke:
    name: Offline user-first smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      WANDB_MODE: disabled

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"

      - name: Install maintained smoke dependencies
        run: |
          python -m pip install \
            "numpy>=1.20" \
            "pandas>=1.3" \
            "scipy" \
            "scikit-learn>=1.0" \
            "h5py" \
            "einops" \
            "sympy" \
            "pytorch-lightning>=1.5" \
            "torchmetrics>=1.0" \
            "PyYAML>=6.0" \
            "matplotlib" \
            "tensorboard" \
            "openpyxl" \
            "pytest>=7"

      - name: Install editable PHMFactory command
        run: python -m pip install --no-deps -e .

      - name: Record smoke environment
        run: python -m pip freeze > offline-smoke-environment.txt

      - name: Run shared runtime, data, evidence, and Pipeline 02 contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            phmfactory/runtime/evidence.py \
            src/data_factory/explicit_data_factory.py \
            src/model_factory/ISFM/system_utils.py \
            src/model_factory/ISFM/task_head/H_01_Linear_cla.py \
            src/task_factory/Default_task.py \
            src/task_factory/task/pretrain/hse_contrastive.py \
            src/runtime/classification.py \
            src/runtime/explainability.py \
            src/Pipeline_01_Fault_Diagnosis.py \
            src/Pipeline_02_Pretraining_Few_Shot.py \
            src/Pipeline_05_Explainable_Fault_Diagnosis.py \
            test/test_classification_runtime.py \
            test/test_data_cache_contract.py \
            test/test_hse_objective_contract.py \
            test/test_per_sample_metadata.py \
            test/test_pipeline02_runtime.py \
            test/test_runtime_evidence.py
          python -m pytest \
            test/test_classification_runtime.py \
            test/test_data_cache_contract.py \
            test/test_hse_objective_contract.py \
            test/test_per_sample_metadata.py \
            test/test_pipeline02_runtime.py \
            test/test_runtime_evidence.py \
            -vv --tb=long 2>&1 | tee runtime-contracts-pytest.log

      - name: Diagnose the installed environment
        shell: bash
        run: |
          set -o pipefail
          phmfactory doctor 2>&1 | tee offline-doctor.log

      - name: Preflight the exact offline demo without training
        shell: bash
        run: |
          set -o pipefail
          phmfactory preflight --config smoke 2>&1 | tee offline-preflight.log
          grep -E '^effective_config_sha256=[0-9a-f]{64}$' offline-preflight.log
          test ! -e results/demo/dummy_dg_smoke

      - name: Run the documented offline demo command
        shell: bash
        run: |
          set -o pipefail
          phmfactory demo 2>&1 | tee offline-smoke.log

      - name: Verify Dummy run evidence index
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("results/demo/dummy_dg_smoke/.phmfactory/runs")
          manifests = sorted(root.glob("*/run_manifest.json"))
          assert len(manifests) == 1, manifests
          payload = json.loads(manifests[0].read_text(encoding="utf-8"))
          assert payload["status"] == "succeeded"
          assert re.fullmatch(
              r"[0-9a-f]{64}",
              payload["run_spec"]["effective_config_sha256"],
          )
          roles = {item["role"] for item in payload["artifacts"]}
          assert "classification_test_metrics" in roles, roles
          assert "classification_aggregate_metrics" in roles, roles
          iterations = payload["evidence"].get("classification_iterations")
          assert isinstance(iterations, list) and len(iterations) == 1, iterations
          assert iterations[0]["iteration"] == 0
          assert iterations[0]["metrics_artifact"]["role"] == "classification_test_metrics"
          PY

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-user-first-smoke-diagnostics
          path: |
            runtime-contracts-pytest.log
            offline-doctor.log
            offline-preflight.log
            offline-smoke.log
            offline-smoke-environment.txt
            results/demo/dummy_dg_smoke/.phmfactory/runs/**/run_manifest.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
