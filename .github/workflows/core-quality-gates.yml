name: Core quality gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-configs:
    name: Docs and config contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install config-tooling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6.0" "pydantic>=2.0" "pytest>=7"

      - name: Validate documentation
        run: python -m scripts.validate_docs

      - name: Validate maintained configurations
        run: python -m scripts.validate_configs

      - name: Verify one config truth across public tools
        run: |
          python -m py_compile \
            phmfactory/config.py \
            scripts/config_inspect.py \
            scripts/validate_configs.py \
            test/test_config_analysis_parity.py \
            test/test_trainer_lifecycle_schema.py
          python -m pytest \
            test/test_config_analysis_parity.py \
            test/test_trainer_lifecycle_schema.py \
            -q

      - name: Verify adaptation protocol contracts
        run: |
          python -m py_compile \
            phmfactory/adaptation_protocol.py \
            test/test_tta_protocol_contract.py \
            test/test_tta_label_isolation.py
          python -m pytest \
            test/test_tta_protocol_contract.py \
            test/test_tta_label_isolation.py \
            -q

      - name: Verify generated configuration atlas
        run: |
          python -m scripts.gen_config_atlas
          git diff --exit-code docs/CONFIG_ATLAS.md

      - name: Verify generated support authority
        run: |
          python -m py_compile scripts/gen_support_matrix.py test/test_support_matrix.py
          python -m pytest test/test_support_matrix.py -q
          python -m scripts.gen_support_matrix
          git diff --exit-code SUPPORTED_COMPONENTS.md SUPPORTED_COMBINATIONS.md

      - name: Check whitespace errors
        run: git diff --check

  pipeline06-shell:
    name: Pipeline 06 shell contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7" "PyYAML>=6"

      - name: Compile Pipeline 06 adapter, shell, and tests
        run: |
          python -m py_compile \
            phmfactory/runtime/pipeline06_adapter.py \
            src/Pipeline_06_Generative_Modeling.py \
            test/generative/test_pipeline06_import.py \
            test/generative/test_pipeline06_preflight.py \
            test/generative/test_pipeline06_dispatch.py \
            test/generative/test_pipeline06_compiled_config.py

      - name: Record focused environment
        run: python -m pip freeze > pipeline06-shell-environment.txt

      - name: Run Pipeline 06 shell tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long \
            test/generative/test_pipeline06_import.py \
            test/generative/test_pipeline06_preflight.py \
            test/generative/test_pipeline06_dispatch.py \
            test/generative/test_pipeline06_compiled_config.py \
            2>&1 | tee pipeline06-shell-pytest.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline06-shell-diagnostics
          path: |
            pipeline06-shell-pytest.log
            pipeline06-shell-environment.txt
          if-no-files-found: warn
          retention-days: 7

  uxfd-focused:
    name: UXFD focused contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"

      - name: Install focused test dependencies
        run: |
          python -m pip install \
            "numpy>=1.20" \
            "pandas>=1.3" \
            "scipy" \
            "einops" \
            "sympy" \
            "pytorch-lightning>=1.5" \
            "pytest>=7"

      - name: Verify P07 bounded sparsemax contract
        run: python -m pytest test/test_p07_bounded_operator_path.py -q

      - name: Compile UXFD modules
        run: |
          python -m py_compile \
            src/model_factory/X_model/TSPN_UXFD.py \
            src/model_factory/X_model/UXFD/fusion/simple_fusion.py \
            src/model_factory/X_model/UXFD/fuzzy/fuzzy_reasoner.py \
            src/model_factory/X_model/UXFD/operator_attention/operator_attention_1d.py \
            src/model_factory/X_model/UXFD/neurosymbolic/logic_reasoner.py \
            test/test_tspn_uxfd_assembly.py

      - name: Record focused environment
        run: python -m pip freeze > uxfd-focused-environment.txt

      - name: Run UXFD assembly tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest test/test_tspn_uxfd_assembly.py -vv --tb=long 2>&1 | tee uxfd-pytest.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uxfd-focused-diagnostics
          path: |
            uxfd-pytest.log
            uxfd-focused-environment.txt
          if-no-files-found: warn
          retention-days: 7

  offline-smoke:
    name: Offline user-first smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      WANDB_MODE: disabled

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"

      - name: Install maintained smoke dependencies
        run: |
          python -m pip install \
            "numpy>=1.20" \
            "pandas>=1.3" \
            "scipy" \
            "scikit-learn>=1.0" \
            "h5py" \
            "einops" \
            "sympy" \
            "pytorch-lightning>=1.5" \
            "torchmetrics>=1.0" \
            "PyYAML>=6.0" \
            "pydantic>=2.0" \
            "matplotlib" \
            "tensorboard" \
            "openpyxl" \
            "pytest>=7"

      - name: Install editable PHMFactory command
        run: python -m pip install --no-deps -e .

      - name: Record smoke environment
        run: python -m pip freeze > offline-smoke-environment.txt

      - name: Run shared runtime, data, task, device, result, and Pipeline 02 contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile \
            phmfactory/runtime/execution.py \
            phmfactory/task_semantics.py \
            src/data_factory/explicit_data_factory.py \
            src/data_factory/dataset_task/Default_dataset.py \
            src/model_factory/ISFM/system_utils.py \
            src/model_factory/ISFM/task_head/H_01_Linear_cla.py \
            src/task_factory/Components/loss.py \
            src/task_factory/Components/metrics.py \
            src/task_factory/Default_task.py \
            src/task_factory/task/pretrain/hse_contrastive.py \
            src/trainer_factory/Default_trainer.py \
            src/utils/run_summary.py \
            src/runtime/classification.py \
            src/runtime/explainability.py \
            src/Pipeline_01_Fault_Diagnosis.py \
            src/Pipeline_02_Pretraining_Few_Shot.py \
            src/Pipeline_05_Explainable_Fault_Diagnosis.py \
            test/test_classification_runtime.py \
            test/test_environment_execution_contract.py \
            test/test_trainer_lifecycle_contract.py \
            test/test_data_cache_contract.py \
            test/test_device_authority.py \
            test/test_hse_objective_contract.py \
            test/test_per_sample_metadata.py \
            test/test_pipeline02_runtime.py \
            test/test_run_summary.py \
            test/test_runtime_execution.py \
            test/test_split_scientific_truth.py \
            test/test_task_estimator_truth.py \
            test/test_transform_truth.py
          python -m pytest \
            test/test_classification_runtime.py \
            test/test_environment_execution_contract.py \
            test/test_trainer_lifecycle_contract.py \
            test/test_data_cache_contract.py \
            test/test_device_authority.py \
            test/test_hse_objective_contract.py \
            test/test_per_sample_metadata.py \
            test/test_pipeline02_runtime.py \
            test/test_run_summary.py \
            test/test_runtime_execution.py \
            test/test_split_scientific_truth.py \
            test/test_task_estimator_truth.py \
            test/test_transform_truth.py \
            test/test_llm_explanation_contract.py \
            test/test_llm_explanation_models.py \
            -vv --tb=long 2>&1 | tee runtime-contracts-pytest.log

      - name: Diagnose the installed environment
        shell: bash
        run: |
          set -o pipefail
          phmfactory doctor 2>&1 | tee offline-doctor.log

      - name: Preflight the exact offline demo without training
        shell: bash
        run: |
          set -o pipefail
          phmfactory preflight --config smoke 2>&1 | tee offline-preflight.log
          grep -F 'status=passed' offline-preflight.log
          grep -F 'pipeline=Pipeline_01_Fault_Diagnosis' offline-preflight.log
          if grep -qi 'sha256' offline-preflight.log; then
            echo 'preflight must not expose digest fields' >&2
            exit 1
          fi
          test ! -e results/demo/dummy_dg_smoke

      - name: Run the documented offline demo command
        shell: bash
        run: |
          set -o pipefail
          phmfactory demo 2>&1 | tee offline-smoke.log

      - name: Verify direct Dummy results
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          lines = Path("offline-smoke.log").read_text(encoding="utf-8").splitlines()
          values = {}
          for line in lines:
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              if key in {"result_dir", "best_checkpoint", "test_metrics", "run_summary"}:
                  values[key] = value.strip()

          assert set(values) == {
              "result_dir",
              "best_checkpoint",
              "test_metrics",
              "run_summary",
          }, values
          result_dir = Path(values["result_dir"])
          checkpoint = Path(values["best_checkpoint"])
          metrics = Path(values["test_metrics"])
          summary_path = Path(values["run_summary"])
          assert result_dir.is_dir(), result_dir
          assert checkpoint.is_file(), checkpoint
          assert metrics.is_file(), metrics
          assert summary_path.is_file(), summary_path

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          assert summary["iterations"] == 1
          assert summary["metrics"], summary
          assert "config_sha256" not in summary
          for metric in summary["metrics"].values():
              assert metric["count"] == summary["iterations"]
              assert math.isfinite(float(metric["mean"]))

          assert not list(result_dir.rglob(".phmfactory"))
          assert not list(result_dir.rglob("run_manifest.json"))
          assert not list(result_dir.rglob("artifacts/manifest.json"))
          PY

      - name: Run explicit simulation training, replay and DG interventions
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import numpy as np
          import pandas as pd
          import torch

          root = Path("results/simulation").resolve()
          root.mkdir(parents=True, exist_ok=False)
          data_root = Path(os.environ["RUNNER_TEMP"]) / "phm-simulation"
          for variant, arguments in (
              ("original", []),
              ("labels", ["--target-label-shift", "1"]),
              ("inputs", ["--target-scale", "1.7"]),
          ):
              subprocess.run([sys.executable, "-m", "scripts.prepare_simulated_phm",
                              "--output", str(data_root / variant), *arguments], check=True)
          outputs = {}
          for model, variant in (("linear", "original"), ("linear", "labels"),
                                 ("linear", "inputs"), ("timesnet", "original")):
              case = f"{model}-{variant}"
              output = root / case
              output.mkdir()
              config = f"configs/experiments/phmfactory/simulated_dg_{model}.yaml"
              overrides = ["--override", f"data.data_dir={data_root / variant}",
                           "--override", f"environment.output_dir={output / 'fit'}",
                           "--override", f"data.cache_dir={output / 'cache'}",
                           "--override", f"data.split.manifest_path={output / 'split.json'}"]
              with (output / "fit.log").open("w") as log:
                  subprocess.run(["phmfactory", "--config", config, *overrides],
                                 stdout=log, stderr=subprocess.STDOUT, check=True)
              values = {}
              for line in (output / "fit.log").read_text().splitlines():
                  key, sep, value = line.partition("=")
                  if sep and key in {"best_checkpoint", "test_metrics", "result_dir"}:
                      values[key] = value.strip()
              with (output / "export.log").open("w") as log:
                  subprocess.run([sys.executable, "-m", "scripts.paper.export_mfpt_predictions",
                                  "--profile", "simulation", "--config", config, *overrides,
                                  "--checkpoint", values["best_checkpoint"],
                                  "--reported-metrics", values["test_metrics"],
                                  "--split-manifest", str(output / "split.json"),
                                  "--seed", "17", "--output", str(output / "export")],
                                 stdout=log, stderr=subprocess.STDOUT, check=True)
              outputs[case] = json.loads((output / "export/recomputed_metrics.json").read_text())
              split = json.loads((output / "split.json").read_text())["splits"]
              train, val, test = (set(split[k]["ids"]) for k in ("train", "val", "test"))
              assert not (train & val or train & test or val & test)
              meta = pd.read_csv(data_root / variant / "metadata_simulated.csv").set_index("Id")
              assert set(meta.loc[list(train | val), "Domain_id"]) <= {0, 1}
              assert set(meta.loc[list(test), "Domain_id"]) == {2}
              print(case, json.dumps({k: outputs[case][k] for k in (
                  "windows", "records", "accuracy", "macro_f1", "max_abs_logit_error")}))
          original = torch.load(outputs["linear-original"]["checkpoint"], map_location="cpu", weights_only=False)
          checks = {}
          for variant in ("labels", "inputs"):
              changed = torch.load(outputs[f"linear-{variant}"]["checkpoint"], map_location="cpu", weights_only=False)
              assert original["epoch"] == changed["epoch"]
              assert original["global_step"] == changed["global_step"]
              assert original["state_dict"].keys() == changed["state_dict"].keys()
              assert all(torch.equal(v, changed["state_dict"][k]) for k, v in original["state_dict"].items())
              checks[f"target_{variant}_selected_state_equal"] = True
              # Compare only learning state: paths differ intentionally by run directory.
              for left, right in zip(original["optimizer_states"], changed["optimizer_states"], strict=True):
                  assert left["param_groups"] == right["param_groups"]
                  assert left["state"].keys() == right["state"].keys()
                  for parameter, values in left["state"].items():
                      assert values.keys() == right["state"][parameter].keys()
                      for name, value in values.items():
                          other = right["state"][parameter][name]
                          assert torch.equal(value, other) if torch.is_tensor(value) else value == other
              assert original["lr_schedulers"] == changed["lr_schedulers"]
              assert original["callbacks"].keys() == changed["callbacks"].keys()
              for key, callback in original["callbacks"].items():
                  other = changed["callbacks"][key]
                  assert callback["monitor"] == other["monitor"] == "val_loss"
                  assert torch.equal(callback["best_model_score"], other["best_model_score"])
                  assert torch.equal(callback["current_score"], other["current_score"])
              checks[f"target_{variant}_optimizer_state_equal"] = True
              checks[f"target_{variant}_source_selection_score_equal"] = True
          # These checkpoint files do not retain RNG state; TimesNet has no intervention arm.
          checks["rng_state_comparison"] = "not_recorded"
          checks["timesnet_intervention_checks"] = "not_executed"
          first = pd.read_csv(root / "linear-original/export/predictions.csv")
          permuted = pd.read_csv(root / "linear-labels/export/predictions.csv")
          columns = ["file_id", "window_id", "raw_start", "raw_end", "logit_0", "logit_1", "logit_2", "prediction"]
          assert np.array_equal(first[columns].to_numpy(), permuted[columns].to_numpy())
          checks["target_label_permutation_predictions_equal"] = True
          (root / "simulation_results.json").write_text(json.dumps(
              {"data_origin": "simulation", "seed": 17, "cases": outputs, "checks": checks}, indent=2))
          print("SIMULATION_CHECKS", json.dumps(checks))
          PY

      - name: Preserve executable source for simulation reproduction
        if: always()
        run: |
          mkdir -p results/simulation
          git archive --format=tar.gz -o results/simulation/runtime-source.tar.gz HEAD \
            phmfactory src configs scripts main.py test AGENTS.md CORE.md CONTRIBUTING.md \
            .github/workflows/core-quality-gates.yml

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-user-first-smoke-diagnostics
          path: |
            runtime-contracts-pytest.log
            offline-doctor.log
            offline-preflight.log
            offline-smoke.log
            offline-smoke-environment.txt
            results/demo/dummy_dg_smoke/**/run_summary.json
            results/demo/dummy_dg_smoke/**/all_results.csv
            results/demo/dummy_dg_smoke/**/test_result_*.csv
            results/simulation/
          if-no-files-found: warn
          retention-days: 7
