name: Temporary C1 source export
on:
  push:
    branches: [fix/streamlit-detached-recheck-20260909]
    paths: [.github/workflows/source-c1.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz -o /tmp/frontend.tar.gz HEAD apps/streamlit test .github/workflows doc/changelog AGENTS.md CORE.md CONTRIBUTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-c1-source
          path: /tmp/frontend.tar.gz
          retention-days: 1
