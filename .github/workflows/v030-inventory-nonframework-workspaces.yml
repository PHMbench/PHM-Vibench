name: Inventory PHMFactory non-framework workspaces

on:
  pull_request:
    branches:
      - agent/v030-ui-consolidation-pr09
    paths:
      - .github/workflows/v030-inventory-nonframework-workspaces.yml
  push:
    branches:
      - agent/v030-workspace-migration-pr10
    paths:
      - .github/workflows/v030-inventory-nonframework-workspaces.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR-10 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Export bounded workspaces and inventories
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/phmfactory-v030-workspace-inventory
          rm -rf "${root}"
          mkdir -p "${root}/tree"

          paths=(.archive dev results metrics_reports reports plot)
          present=()
          for path in "${paths[@]}"; do
            if git cat-file -e "HEAD:${path}" 2>/dev/null; then
              present+=("${path}")
            fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            printf 'No governed workspaces found\n' >&2
            exit 1
          fi

          git archive HEAD "${present[@]}" | tar -x -C "${root}/tree"
          git ls-tree -r HEAD -- "${present[@]}" \
            | awk '{print $1 "\t" $2 "\t" $3 "\t" $4}' \
            > "${root}/SOURCE_BLOB_MANIFEST.tsv"

          python - <<'PY'
          from __future__ import annotations

          import ast
          import csv
          import hashlib
          import json
          from pathlib import Path
          import re

          root = Path('/tmp/phmfactory-v030-workspace-inventory')
          tree = root / 'tree'
          governed = ('.archive', 'dev', 'results', 'metrics_reports', 'reports', 'plot')
          rows = []
          summaries = {}

          for name in governed:
              base = tree / name
              files = sorted(path for path in base.rglob('*') if path.is_file()) if base.exists() else []
              summaries[name] = {
                  'present': base.exists(),
                  'file_count': len(files),
                  'bytes': sum(path.stat().st_size for path in files),
                  'suffix_counts': {},
              }
              for path in files:
                  rel = path.relative_to(tree).as_posix()
                  suffix = path.suffix.lower() or '(none)'
                  summaries[name]['suffix_counts'][suffix] = summaries[name]['suffix_counts'].get(suffix, 0) + 1
                  data = path.read_bytes()
                  record = {
                      'workspace': name,
                      'path': rel,
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                      'suffix': suffix,
                      'classification_hint': '',
                      'top_level_functions': '',
                      'top_level_classes': '',
                      'personal_marker': False,
                      'generated_marker': False,
                      'notes': '',
                  }
                  text = None
                  if len(data) <= 5_000_000:
                      try:
                          text = data.decode('utf-8')
                      except UnicodeDecodeError:
                          pass
                  if text is not None:
                      lowered = text.lower()
                      record['personal_marker'] = bool(
                          re.search(r'/home/[^/\s]+|/users/[^/\s]+|git@github\.com:|\bliq22\b|\blq[_-]', lowered)
                      )
                      record['generated_marker'] = any(
                          marker in lowered
                          for marker in (
                              'generated by', 'autogenerated', 'auto-generated',
                              'experiment output', 'training result', 'metrics report',
                          )
                      )
                      if path.suffix == '.py':
                          try:
                              module = ast.parse(text)
                          except SyntaxError as exc:
                              record['notes'] = f'parse_error={exc}'
                          else:
                              record['top_level_functions'] = ';'.join(
                                  node.name for node in module.body
                                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                              )
                              record['top_level_classes'] = ';'.join(
                                  node.name for node in module.body if isinstance(node, ast.ClassDef)
                              )
                  if name in {'results', 'metrics_reports'}:
                      record['classification_hint'] = 'generated-or-placeholder'
                  elif name in {'.archive', 'dev'}:
                      record['classification_hint'] = 'personal-or-historical'
                  elif name == 'reports':
                      record['classification_hint'] = 'review-public-vs-paper'
                  elif name == 'plot':
                      record['classification_hint'] = 'review-reusable-tool-vs-paper'
                  rows.append(record)

          with (root / 'CONTENT_INVENTORY.tsv').open('w', encoding='utf-8', newline='') as handle:
              fields = tuple(rows[0])
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter='\t')
              writer.writeheader()
              writer.writerows(rows)

          (root / 'WORKSPACE_SUMMARY.json').write_text(
              json.dumps(summaries, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

          cat > "${root}/ARCHIVE_README.md" <<'EOF'
          # PHMFactory v0.3 non-framework workspace inventory

          This artifact is a read-only export of `.archive/`, `dev/`, `results/`,
          `metrics_reports/`, `reports/`, and `plot/` from the PR-10 source head.

          It does not authorize deletion. `SOURCE_BLOB_MANIFEST.tsv` preserves Git
          object identities; `CONTENT_INVENTORY.tsv` and `WORKSPACE_SUMMARY.json`
          support classification into public framework, reusable tooling, personal
          archive, paper repository, generated output, or placeholder content.
          EOF

          test -s "${root}/SOURCE_BLOB_MANIFEST.tsv"
          test -s "${root}/CONTENT_INVENTORY.tsv"
          test -s "${root}/WORKSPACE_SUMMARY.json"

      - name: Upload bounded inventory
        uses: actions/upload-artifact@v4
        with:
          name: phmfactory-v030-nonframework-workspaces
          path: /tmp/phmfactory-v030-workspace-inventory
          if-no-files-found: error
          retention-days: 30
