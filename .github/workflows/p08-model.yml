name: P08 source-only physical conditioning
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/model_factory/ISFM/M_P08_PhysicalConditioning.py'
      - 'src/data_factory/p08_data.py'
      - 'src/task_factory/task/DG/p08_physical.py'
      - 'scripts/p08_physical.py'
      - 'configs/experiments/p08/**'
      - 'test/test_p08_*.py'
      - '.github/workflows/p08-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest einops numpy pandas h5py scikit-learn PyYAML pydantic pytorch-lightning tqdm
      - run: python -m pytest test/test_p08_model.py test/test_p08_data.py test/test_p08_execution.py -q
      - name: Save exact source for reproducible offline review
        if: always()
        run: git archive --format=zip HEAD -o p08-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-reviewed-source
          path: p08-source.zip
