name: P08 actual HSE model
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/model_factory/ISFM/M_P08_PhysicalConditioning.py'
      - 'test/test_p08_model.py'
      - '.github/workflows/p08-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest einops numpy
      - run: python -m pytest test/test_p08_model.py -q
      - name: Save exact source for reproducible offline review
        if: always()
        run: git archive --format=zip HEAD -o p08-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-reviewed-source
          path: p08-source.zip
