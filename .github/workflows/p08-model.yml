name: Physical-coordinate conditioning model
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/model_factory/ISFM/M_P08_PhysicalConditioning.py'
      - 'src/model_factory/ISFM/embedding/**'
      - 'test/test_p08_model.py'
      - '.github/workflows/p08-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest einops numpy pandas scipy h5py scikit-learn pytorch-lightning torchmetrics matplotlib PyYAML 'pydantic>=2' tqdm
      - name: Shared HSE, conditioning, gradient and checkpoint tests
        run: |
          set -o pipefail
          python -m pytest test/test_p08_model.py -q | tee model-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: conditioning-model-validation
          path: model-tests.txt
