name: P08 actual HSE and source-only protocol
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/model_factory/ISFM/M_P08_PhysicalConditioning.py'
      - 'src/data_factory/p08_data.py'
      - 'src/data_factory/data_utils.py'
      - 'src/data_factory/__init__.py'
      - 'src/task_factory/task/DG/p08.py'
      - 'scripts/p08_experiments.py'
      - 'configs/experiments/p08/**'
      - 'test/test_p08_*.py'
      - '.github/workflows/p08-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest einops numpy pandas scipy h5py scikit-learn pytorch-lightning torchmetrics matplotlib PyYAML 'pydantic>=2'
      - name: Actual HSE, source fitting, frozen evaluation and record statistics
        run: |
          set -o pipefail
          python -m pytest test/test_p08_model.py test/test_p08_protocol.py -q | tee p08-tests.txt
      - name: Record dependencies
        if: always()
        run: python -m pip freeze > p08-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p08-protocol-validation
          path: |
            p08-tests.txt
            p08-environment.txt
