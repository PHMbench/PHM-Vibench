name: Export source for bounded refactor

on:
  pull_request:
    paths:
      - ".github/workflows/export-dev-source-for-refactor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Create source archive
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_HEAD.txt
          tar --exclude=.git --exclude='*.pyc' --exclude='__pycache__' -czf "$RUNNER_TEMP/phmfactory-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: phmfactory-source-for-refactor
          path: ${{ runner.temp }}/phmfactory-source.tar.gz
          if-no-files-found: error
