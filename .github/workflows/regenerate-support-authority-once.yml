name: Regenerate support authority once

on:
  pull_request:
    paths:
      - ".github/workflows/regenerate-support-authority-once.yml"
      - "scripts/gen_support_matrix.py"
      - "configs/config_registry.csv"
      - "configs/demo/04_cross_system_fewshot/**"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML "pydantic>=2.0"
      - name: Generate committed authorities
        run: |
          set -euo pipefail
          python -m scripts.gen_config_atlas
          python -m scripts.gen_support_matrix
          python -m scripts.validate_configs
          python -m scripts.validate_docs
          git rm .github/workflows/regenerate-support-authority-once.yml
      - name: Commit generated tree and self-delete
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONFIG_ATLAS.md SUPPORTED_COMPONENTS.md SUPPORTED_COMBINATIONS.md
          git diff --cached --check
          git commit -m "docs(support): regenerate support authorities"
          git push origin HEAD:${{ github.head_ref }}
