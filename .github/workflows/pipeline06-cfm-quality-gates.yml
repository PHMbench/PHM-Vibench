name: Pipeline 06 CFM quality gates

on:
  pull_request:
    paths:
      - "phmfactory/**"
      - "src/Pipeline_06_Generative_Modeling.py"
      - "src/data_factory/**"
      - "src/config_schema/**"
      - "src/configs/**"
      - "src/model_factory/generative_model/**"
      - "src/model_factory/model_factory.py"
      - "src/model_factory/__init__.py"
      - "src/task_factory/Components/generative/**"
      - "src/task_factory/task/generative/**"
      - "src/task_factory/task_factory.py"
      - "src/trainer_factory/**"
      - "src/utils/generative_evidence.py"
      - "configs/base/**"
      - "configs/demo/10_generative/**"
      - "configs/experiments/generative/**"
      - "data/metadata_dummy.csv"
      - "data/raw/Dummy_Data/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "test/generative/**"
      - ".github/workflows/pipeline06-cfm-quality-gates.yml"
  push:
    branches:
      - main
    paths:
      - "phmfactory/**"
      - "src/Pipeline_06_Generative_Modeling.py"
      - "src/data_factory/**"
      - "src/config_schema/**"
      - "src/configs/**"
      - "src/model_factory/generative_model/**"
      - "src/model_factory/model_factory.py"
      - "src/model_factory/__init__.py"
      - "src/task_factory/Components/generative/**"
      - "src/task_factory/task/generative/**"
      - "src/task_factory/task_factory.py"
      - "src/trainer_factory/**"
      - "src/utils/generative_evidence.py"
      - "configs/base/**"
      - "configs/demo/10_generative/**"
      - "configs/experiments/generative/**"
      - "data/metadata_dummy.csv"
      - "data/raw/Dummy_Data/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "test/generative/**"
      - ".github/workflows/pipeline06-cfm-quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline06-cfm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cfm-core:
    name: CFM core and public CPU stages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      WANDB_MODE: disabled
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"

      - name: Install the public runtime and test dependency
        run: python -m pip install -e . "pytest>=7"

      - name: Inspect the actual candidate demo
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.config_inspect \
            --config configs/demo/10_generative/dummy_generative_cfm.yaml \
            --dump targets --format yaml \
            2>&1 | tee pipeline06-cfm-config-inspect.log

      - name: Record focused environment
        run: python -m pip freeze > pipeline06-cfm-environment.txt

      - name: Run CFM contracts and real train sample eval
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long \
            --junitxml=pipeline06-cfm-junit.xml \
            test/generative/test_pipeline06_import.py \
            test/generative/test_pipeline06_preflight.py \
            test/generative/test_pipeline06_dispatch.py \
            test/generative/test_pipeline06_compiled_config.py \
            test/generative/test_cfm_core_contract.py \
            test/generative/test_cfm_dtype_contract.py \
            test/generative/test_cfm_factory_contract.py \
            test/generative/test_cfm_demo_e_chain.py \
            2>&1 | tee pipeline06-cfm-pytest.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline06-cfm-core-diagnostics
          path: |
            pipeline06-cfm-config-inspect.log
            pipeline06-cfm-pytest.log
            pipeline06-cfm-environment.txt
            pipeline06-cfm-junit.xml
          if-no-files-found: warn
          retention-days: 7
