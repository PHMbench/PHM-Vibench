name: Temporary R0 MFPT revalidation correction v3

on:
  push:
    branches:
      - docs/mfpt-current-source-revalidation-20260908

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install focused dependencies
        run: python -m pip install PyYAML pytest

      - name: Apply bounded R0 patch
        run: python tools/tmp_apply_r0_v3.py

      - name: Validate R0
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/repo/check_release_readiness.py test/test_release_readiness.py
          python -m scripts.validate_docs
          python -m pytest test/test_release_readiness.py -q
          python tools/repo/check_release_readiness.py --mode audit | tee /tmp/readiness.txt
          grep -q 'BASELINE_REVALIDATION_REQUIRED' /tmp/readiness.txt
          if grep -q 'BASELINE_VALID_REFERENCE_INVALID' /tmp/readiness.txt; then
            echo 'Structurally valid smoke-only baseline was still reported invalid.' >&2
            exit 1
          fi
          if python tools/repo/check_release_readiness.py --mode release; then
            echo 'Release mode unexpectedly passed.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit non-workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/PHMFACTORY_V0_3_RELEASE_READINESS.md \
            doc/changelog/2026-09-13-mfpt-revalidation-blocker.md \
            tools/repo/check_release_readiness.py \
            test/test_release_readiness.py
          git commit -m 'docs(baseline): require current-source MFPT revalidation'
          git push origin HEAD:docs/mfpt-current-source-revalidation-20260908
