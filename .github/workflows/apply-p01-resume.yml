name: Apply reviewed P01 resume correction
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.number == 309 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p01-experiment-controller-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed changes then remove transfer files
        run: |
          set -euo pipefail
          original=$(git rev-parse HEAD)
          test -z "$(git status --porcelain)"
          test "$(git hash-object experiments/p01/control.py)" = 5900dae9278a5c7864c4f5182c429a63d586b1dc
          test "$(git hash-object experiments/p01/multiview_dg.py)" = 52612e7579e294bf7e5f0fc7b4ff56851d9a5727
          test "$(git hash-object test/test_p01_control.py)" = e5db98c44929938d8906f117ebcac272c12341c4
          sed -i 's/^ diff --git/diff --git/' .github/p01-resume.patch
          git apply --check .github/p01-resume.patch
          git apply .github/p01-resume.patch
          test "$(git hash-object experiments/p01/control.py)" = 9343d2dbff2306e212f378ae95bd2328147ff62f
          test "$(git hash-object experiments/p01/multiview_dg.py)" = 92246735998c141a8308774f544a881ba573da3d
          test "$(git hash-object test/test_p01_control.py)" = e2189be2bcd0e572493c6e0426be9930b72b8035
          git rm .github/p01-resume.patch .github/workflows/apply-p01-resume.yml
          git add experiments/p01/control.py experiments/p01/multiview_dg.py test/test_p01_control.py
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(p01): resume original bindings and recognize trainer KeyboardInterrupt records'
          test "$(git ls-remote origin refs/heads/feat/p01-experiment-controller-20261007 | cut -f1)" = "$original"
          git push origin HEAD:refs/heads/feat/p01-experiment-controller-20261007
          git rev-parse HEAD
