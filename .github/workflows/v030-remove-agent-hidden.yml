name: Remove archived hidden Agent workspaces

on:
  pull_request:
    branches:
      - agent/v030-agent-root-cleanup-batch1
    paths:
      - .github/workflows/v030-remove-agent-hidden.yml

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TRACKED_FILES: "65"
      TARGET_BRANCH: agent/v030-agent-hidden-cleanup-batch2

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-agent-hidden-cleanup-batch2
          fetch-depth: 0

      - name: Verify exact removal scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tracked < <(git ls-files -- .claude .codex)
          actual="${#tracked[@]}"
          printf 'Tracked hidden Agent files: %s\n' "$actual"
          if [ "$actual" != "$EXPECTED_TRACKED_FILES" ]; then
            printf 'Expected %s tracked files, found %s. Refusing cleanup.\n' \
              "$EXPECTED_TRACKED_FILES" "$actual" >&2
            printf '%s\n' "${tracked[@]}" >&2
            exit 1
          fi

          unexpected="$(printf '%s\n' "${tracked[@]}" | grep -Ev '^\.(claude|codex)/' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected removal path:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Remove only archived hidden Agent paths
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- .claude .codex
          git rm -- .github/workflows/v030-remove-agent-hidden.yml

      - name: Commit scoped cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --name-only | grep -Ev '^\.(claude|codex)/|^\.github/workflows/v030-remove-agent-hidden\.yml$' \
            && { echo 'Cleanup escaped approved paths.' >&2; exit 1; } || true
          git commit -m "chore: remove archived hidden Agent workspaces"
          git push origin "HEAD:${TARGET_BRANCH}"
