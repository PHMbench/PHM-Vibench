name: TII one-model command

on:
  pull_request:
    paths:
      - 'scripts/tii_one_model.py'
      - 'scripts/run_tii_experiments.sh'
      - 'scripts/tii_plot_source.py'
      - 'src/task_factory/task/DG/tii_joint.py'
      - 'src/task_factory/Components/tii_evaluation.py'
      - 'src/utils/identifiers.py'
      - 'test/test_tii_one_model*.py'
      - 'phmfactory/config.py'
      - 'src/config_schema/**'
      - 'configs/experiments/tii/**'
      - '.github/workflows/tii-one-model.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/tii_one_model.py'
      - 'scripts/run_tii_experiments.sh'
      - 'scripts/tii_plot_source.py'
      - 'src/task_factory/task/DG/tii_joint.py'
      - 'src/task_factory/Components/tii_evaluation.py'
      - 'src/utils/identifiers.py'
      - 'test/test_tii_one_model*.py'
      - 'phmfactory/config.py'
      - 'src/config_schema/**'
      - 'configs/experiments/tii/**'
      - '.github/workflows/tii-one-model.yml'

permissions:
  contents: read

jobs:
  bounded-command:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install the native CPU test environment
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . 'pytest>=7' 'pytorch-lightning>=2.5,<2.7'
      - name: Check shell and plotting syntax
        run: |
          bash -n scripts/run_tii_experiments.sh
          python -m py_compile scripts/tii_plot_source.py
      - name: Native launcher, source population and acceptance integration
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: python -m pytest test/test_tii_one_model.py test/test_tii_one_model_acceptance.py -q --junitxml=tii-one-model-tests.xml
      - name: Retained qualification stops both no-config commands
        shell: bash
        run: |
          set +e
          python -m scripts.tii_one_model > tii-one-model-readiness.json
          basic=$?
          python -m scripts.tii_one_model --acceptance > tii-acceptance-readiness.json
          acceptance=$?
          set -e
          test "$basic" -eq 2
          test "$acceptance" -eq 2
          python -c 'import json; r=json.load(open("tii-acceptance-readiness.json")); assert r["native_invocations"] == 0; assert len(r["candidates"]) <= 5'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tii-one-model-command-checks
          path: |
            tii-one-model-tests.xml
            tii-one-model-readiness.json
            tii-acceptance-readiness.json
          retention-days: 14
