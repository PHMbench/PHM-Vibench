name: Finalize PHMFactory backend governance

on:
  push:
    branches:
      - agent/v030-phm-data-backend-governance-pr12d
    paths:
      - ".github/workflows/v030-finalize-backend-governance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-phm-data-backend-governance-pr12d
          fetch-depth: 0

      - name: Apply bounded corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checker = Path('tools/repo/check_release_readiness.py')
          text = checker.read_text(encoding='utf-8')
          if 'import subprocess\nimport sys\n' not in text:
              needle = 'import subprocess\n'
              if text.count(needle) != 1:
                  raise SystemExit('unexpected subprocess import count')
              text = text.replace(needle, needle + 'import sys\n', 1)
          checker.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          old = '- the optional `phm-data-factory` backend disposition is finalized;\n'
          new = (
              '- the backend repository is transferred to `PHMbench`, reviewed, and integrated '\
              'at one immutable optional gitlink;\n'
              '- all remaining legacy paper gitlinks complete content-level migration and are removed;\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          changelog.write_text(text, encoding='utf-8')

          notes = Path('RELEASE_NOTES_v0.3.0.md')
          text = notes.read_text(encoding='utf-8')
          old = '- optional `phm-data-factory` backend disposition remains undecided;\n'
          new = (
              '- the organization-owned `phm-data-factory` transfer and governed integration '\
              'are incomplete;\n'
              '- remaining legacy paper gitlinks have not completed content-level migration;\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          notes.write_text(text, encoding='utf-8')
          PY

      - name: Validate corrected governance files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML pytest
          python -m py_compile \
            tools/repo/check_release_readiness.py \
            tools/repo/check_submodule_policy.py
          python tools/repo/check_submodule_policy.py --mode policy
          python -m pytest -q test/test_submodule_policy.py
          grep -q 'PHMbench/phm-data-factory' docs/PHM_DATA_FACTORY_BACKEND_V0_3.md
          ! grep -q 'optional `phm-data-factory` backend disposition remains undecided' RELEASE_NOTES_v0.3.0.md

      - name: Commit bounded corrections and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v030-finalize-backend-governance.yml
          git add \
            tools/repo/check_release_readiness.py \
            CHANGELOG.md \
            RELEASE_NOTES_v0.3.0.md

          unexpected="$(
            git diff --cached --name-only \
              | grep -Ev '^\.github/workflows/v030-finalize-backend-governance\.yml$|^tools/repo/check_release_readiness\.py$|^CHANGELOG\.md$|^RELEASE_NOTES_v0\.3\.0\.md$' \
              || true
          )"
          if [ -n "${unexpected}" ]; then
            printf 'Correction escaped approved paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(v0.3): finalize backend governance blockers'
          git push origin HEAD:agent/v030-phm-data-backend-governance-pr12d
