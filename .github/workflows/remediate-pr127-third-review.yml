name: Remediate PR 127 third review findings

on:
  push:
    branches:
      - agent/v030-canonical-integration-r2
    paths:
      - .github/workflows/remediate-pr127-third-review.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/v030-canonical-integration-r2
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply bounded fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          config_utils = Path("src/configs/config_utils.py")
          text = config_utils.read_text(encoding="utf-8")
          marker = "# ==================== 兼容包装器 ====================\n"
          helper = '''def _resolve_base_config_path(yaml_path: Path, base_source: Union[str, Path]) -> Path:\n    """Resolve a base config from a checkout or an installed wheel."""\n    source = str(base_source)\n    candidate = Path(source)\n    if candidate.is_absolute():\n        return candidate\n\n    normalized = source.replace("\\\\", "/")\n    if normalized.startswith("configs/"):\n        if candidate.is_file():\n            return candidate.resolve()\n        relative = Path(normalized[len("configs/"):])\n        for parent in yaml_path.resolve().parents:\n            if parent.name == "configs":\n                packaged = parent / relative\n                if packaged.is_file():\n                    return packaged.resolve()\n                break\n        return candidate\n\n    return yaml_path.parent / candidate\n\n\n'''
          if "def _resolve_base_config_path(" not in text:
              if marker not in text:
                  raise SystemExit("config_utils helper marker missing")
              text = text.replace(marker, helper + marker, 1)
              config_utils.write_text(text, encoding="utf-8")

          replace_once(
              "src/configs/config_utils.py",
              '''                        if os.path.isabs(base_path_str) or base_path_str.startswith("configs/"):\n                            base_path = Path(base_path_str)\n                        else:\n                            base_path = yaml_path.parent / base_path_str\n                        merged.update(_to_config_wrapper(base_path))\n''',
              '''                        base_path = _resolve_base_config_path(yaml_path, base_path_str)\n                        merged.update(_to_config_wrapper(base_path))\n''',
          )

          entry_test = '''\n\ndef test_run_dispatches_packaged_base_configs_outside_checkout(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    from src.configs.config_utils import load_config\n\n    observed: dict[str, object] = {}\n\n    def pipeline(args: argparse.Namespace) -> str:\n        config = load_config(args.config_path)\n        observed["data"] = config.data.metadata_file\n        observed["model"] = config.model.name\n        observed["task"] = config.task.name\n        observed["trainer"] = config.trainer.device\n        return "dispatched"\n\n    real_import_module = cli.importlib.import_module\n\n    def fake_import(name: str):\n        if name == "src.Pipeline_01_Fault_Diagnosis":\n            return SimpleNamespace(pipeline=pipeline)\n        return real_import_module(name)\n\n    monkeypatch.chdir(tmp_path)\n    monkeypatch.setattr(cli.importlib, "import_module", fake_import)\n    args = argparse.Namespace(\n        config="smoke",\n        config_path=None,\n        notes="",\n        override=None,\n    )\n\n    assert cli.run(args) == "dispatched"\n    assert observed == {\n        "data": "metadata_dummy.csv",\n        "model": "Dlinear",\n        "task": "DG",\n        "trainer": "cpu",\n    }\n'''
          path = Path("test/test_phmfactory_entrypoints.py")
          text = path.read_text(encoding="utf-8")
          if "test_run_dispatches_packaged_base_configs_outside_checkout" not in text:
              path.write_text((text.rstrip() + entry_test).rstrip() + "\n", encoding="utf-8")

          release = Path("tools/repo/check_release_readiness.py")
          text = release.read_text(encoding="utf-8")
          text = text.replace(
              'FLOATING_REVISIONS = {"main", "master", "latest", "develop", "development", ""}\n',
              'FLOATING_REVISIONS = {"main", "master", "latest", "develop", "development", ""}\nSHA40 = re.compile(r"[0-9a-f]{40}")\n',
              1,
          )
          gitlink_marker = '''def _gitlink(path: str) -> str:\n    result = subprocess.run(\n        ["git", "ls-tree", "HEAD", "--", path],\n        cwd=ROOT,\n        check=True,\n        text=True,\n        stdout=subprocess.PIPE,\n    ).stdout.strip()\n    if not result:\n        return ""\n    fields = result.split(None, 3)\n    if len(fields) < 3 or fields[0] != "160000" or fields[1] != "commit":\n        return ""\n    return fields[2]\n\n\n'''
          gitlink_replacement = '''def _gitlinks() -> dict[str, str]:\n    result = subprocess.run(\n        ["git", "ls-tree", "-r", "HEAD"],\n        cwd=ROOT,\n        check=True,\n        text=True,\n        stdout=subprocess.PIPE,\n    ).stdout\n    gitlinks: dict[str, str] = {}\n    for line in result.splitlines():\n        if "\\t" not in line:\n            continue\n        metadata, path = line.split("\\t", 1)\n        fields = metadata.split()\n        if len(fields) == 3 and fields[0] == "160000" and fields[1] == "commit":\n            gitlinks[path] = fields[2]\n    return gitlinks\n\n\ndef _gitlink(path: str) -> str:\n    return _gitlinks().get(path, "")\n\n\ndef _is_immutable_revision(value: str) -> bool:\n    return SHA40.fullmatch(value.casefold()) is not None\n\n\n'''
          if "def _gitlinks()" not in text:
              if gitlink_marker not in text:
                  raise SystemExit("release gitlink marker missing")
              text = text.replace(gitlink_marker, gitlink_replacement, 1)

          text = text.replace(
              '''    configured = _configured_submodules()\n    backend = configured.get(TARGET_BACKEND_PATH)\n''',
              '''    configured = _configured_submodules()\n    gitlinks = _gitlinks()\n    raw_unknown = sorted(set(gitlinks) - set(configured))\n    if raw_unknown:\n        findings.append(Finding("UNKNOWN_SUBMODULES_PRESENT", ", ".join(raw_unknown)))\n\n    backend = configured.get(TARGET_BACKEND_PATH)\n''',
              1,
          )
          text = text.replace(
              '''    providers = manifest.get("providers") or {}\n    for provider_name, provider in sorted(providers.items()):\n        revision = str((provider or {}).get("revision") or "")\n        if revision.casefold() in FLOATING_REVISIONS:\n''',
              '''    providers = manifest.get("providers") or {}\n    release_pin_required = manifest.get("release_pin_required") is True\n    for provider_name, provider in sorted(providers.items()):\n        revision = str((provider or {}).get("revision") or "")\n        if (release_pin_required and not _is_immutable_revision(revision)) or revision.casefold() in FLOATING_REVISIONS:\n''',
              1,
          )
          release.write_text(text, encoding="utf-8")

          release_tests = '''from __future__ import annotations\n\nfrom types import SimpleNamespace\n\nimport pytest\n\nfrom tools.repo import check_release_readiness as readiness\n\n\n@pytest.mark.parametrize(\n    "revision",\n    ("main", "master", "release/v0.3", "refs/heads/main", "v0.3.0", ""),\n)\ndef test_mutable_revision_forms_are_not_immutable(revision: str) -> None:\n    assert not readiness._is_immutable_revision(revision)\n\n\ndef test_full_commit_revision_is_immutable() -> None:\n    assert readiness._is_immutable_revision("a" * 40)\n\n\ndef test_gitlinks_enumerates_raw_unconfigured_entries(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    output = (\n        "100644 blob " + "1" * 40 + "\\tREADME.md\\n"\n        "160000 commit " + "2" * 40 + "\\tunconfigured/raw\\n"\n    )\n    monkeypatch.setattr(\n        readiness.subprocess,\n        "run",\n        lambda *args, **kwargs: SimpleNamespace(stdout=output),\n    )\n    assert readiness._gitlinks() == {"unconfigured/raw": "2" * 40}\n'''
          Path("test/test_release_readiness.py").write_text(release_tests, encoding="utf-8")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "pytest>=7" "PyYAML>=6.0"

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            test/test_phmfactory_entrypoints.py \
            test/test_release_readiness.py
          python tools/repo/check_submodule_policy.py --mode policy
          python tools/repo/check_release_readiness.py --mode audit
          git diff --check

      - name: Build wheel and exercise dispatch outside checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist *.egg-info
          python -m build
          python -m venv /tmp/phmfactory-third-review
          /tmp/phmfactory-third-review/bin/python -m pip install --no-deps dist/*.whl
          /tmp/phmfactory-third-review/bin/python -m pip install PyYAML
          cd /tmp
          /tmp/phmfactory-third-review/bin/python - <<'PY'
          from types import SimpleNamespace
          from unittest.mock import patch
          from phmfactory import cli
          from src.configs.config_utils import load_config

          def pipeline(args):
              config = load_config(args.config_path)
              assert config.data.metadata_file == "metadata_dummy.csv"
              assert config.model.name == "Dlinear"
              assert config.task.name == "DG"
              assert config.trainer.device == "cpu"
              return "wheel-dispatch-pass"

          real_import_module = cli.importlib.import_module

          def fake_import(name):
              if name == "src.Pipeline_01_Fault_Diagnosis":
                  return SimpleNamespace(pipeline=pipeline)
              return real_import_module(name)

          with patch.object(cli.importlib, "import_module", side_effect=fake_import):
              assert cli.main(["--config", "smoke"]) == "wheel-dispatch-pass"
          PY

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/configs/config_utils.py \
            tools/repo/check_release_readiness.py \
            test/test_phmfactory_entrypoints.py \
            test/test_release_readiness.py
          git commit -m "fix(v0.3): close final package and release audit gaps"
          git push origin HEAD:agent/v030-canonical-integration-r2

      - name: Record result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_THIRD_REVIEW_FIX_APPLIED
          wheel_cli_dispatch_outside_checkout: pass
          immutable_revision_negative_tests: pass
          raw_gitlink_enumeration_test: pass
          temporary_workflow_cleanup: pending connector deletion"

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/PHMbench/PHM-Vibench/issues/127/comments \
            -f body="PR127_THIRD_REVIEW_FIX_FAILED
          run_id: ${GITHUB_RUN_ID}
          inspect: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
