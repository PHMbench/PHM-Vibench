name: Native model integration

on:
  pull_request:
    paths:
      - 'src/model_factory/_native_classification.py'
      - 'src/model_factory/_native_forecasting.py'
      - 'src/model_factory/Transformer/iTransformer.py'
      - 'src/model_factory/Transformer/PAttn.py'
      - 'src/model_factory/CNN/TimesNet.py'
      - 'src/model_factory/CNN/TSLANet.py'
      - 'src/model_factory/CNN/ModernTCN.py'
      - 'src/model_factory/MLP/NLinear.py'
      - 'src/model_factory/MLP/SparseTSF.py'
      - 'src/model_factory/MLP/FITS.py'
      - 'src/model_factory/MLP/SOFTS.py'
      - 'src/model_factory/MLP/FreTS.py'
      - 'src/model_factory/MLP/TSMixer.py'
      - 'src/model_factory/MLP/NHITS.py'
      - 'src/model_factory/MLP/LightTS.py'
      - 'src/model_factory/RNN/SegRNN.py'
      - 'src/task_factory/**'
      - 'src/data_factory/**'
      - 'src/runtime/classification.py'
      - 'phmfactory/**'
      - 'configs/experiments/model_integration/**'
      - 'test/test_native_model_ports.py'
      - 'test/test_native_forecasting.py'
      - 'test/test_native_forecasting_extensions.py'
      - 'test/test_native_forecasting_interpolation.py'
      - 'test/test_modern_tcn_native.py'
      - 'test/test_native_model_public_path.py'
      - '.github/workflows/native-model-tests.yml'

permissions:
  contents: read

jobs:
  native-models:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0
          python -m pip install -e . 'pytest>=7'
          python -m pip check
      - name: Test native equations and real public Dummy fits
        run: |
          python -m pytest -v test/test_native_model_ports.py test/test_native_forecasting.py test/test_native_forecasting_extensions.py test/test_native_forecasting_interpolation.py test/test_modern_tcn_native.py test/test_native_model_public_path.py --junitxml=native-models.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-model-integration-tests
          path: native-models.xml
          if-no-files-found: error
