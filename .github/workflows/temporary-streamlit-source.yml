name: Temporary Streamlit patch application
on:
  push:
    branches: [fix/streamlit-inspector-parity-20260908]
    paths: [.github/workflows/temporary-streamlit-source.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/streamlit-inspector-parity-20260908
      - name: Apply the tested edits to existing frontend owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def edit(name, pairs):
              p = Path(name)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise RuntimeError(f'Missing expected edit in {name}: {old[:80]}')
                  text = text.replace(old, new)
              p.write_text(text)
          edit('apps/streamlit/config_service.py', [
              ('    effective_config_sha256: str = ""\n', ''),
              ('    """Invoke the public inspector and preserve its effective config identity."""', '    """Invoke the current public inspector without a second config identity."""'),
              ('    resolved = payload.get("resolved") or {}\n    sanity_raw = payload.get("sanity") or []\n    digest = str(payload.get("effective_config_sha256") or "")', '    resolved = payload.get("resolved")\n    sanity_raw = payload.get("sanity")'),
              ('        or len(digest) != 64', '        or not sanity_raw\n        or not all(\n            isinstance(item, dict) and isinstance(item.get("ok"), bool)\n            for item in sanity_raw\n        )'),
              ('    sanity = tuple(item for item in sanity_raw if isinstance(item, dict))\n    passed = bool(sanity) and all(bool(item.get("ok")) for item in sanity)', '    sanity = tuple(sanity_raw)\n    passed = all(item["ok"] for item in sanity)'),
              ('        effective_config_sha256=digest,\n', ''),
          ])
          edit('apps/streamlit/workspace.py', [
              ('import hashlib\n', ''),
              ('        normalize_overrides,\n', '        normalize_overrides,\n        override_args,\n'),
              ('def _signature(mode: str, source: str, overrides: Sequence[Tuple[str, Any]]) -> str:\n    """Identify the visible UI inputs that were validated."""\n\n    payload = repr((mode, source, tuple(overrides))).encode("utf-8")\n    return hashlib.sha256(payload).hexdigest()', 'def _validation_inputs(\n    mode: str, source: str, overrides: Sequence[Tuple[str, Any]]\n) -> Tuple[str, str, Tuple[str, ...]]:\n    """Keep the submitted text and typed argv values for direct comparison.\n\n    Serializing through the existing CLI adapter separates True from 1 and\n    freezes nested override values without inventing another config identity.\n    """\n\n    return mode, source, override_args(overrides)'),
              ('"validation_signature": ""', '"validated_inputs": None'),
              ('source_for_signature', 'source_for_validation'),
              ('    current_signature = _signature(mode, source_for_validation, overrides)', '    current_inputs = _validation_inputs(mode, source_for_validation, overrides)'),
              ('st.session_state.validation_signature = current_signature', 'st.session_state.validated_inputs = current_inputs'),
              ('st.session_state.validation_signature = ""', 'st.session_state.validated_inputs = None'),
              ('st.session_state.validation_signature == current_signature', 'st.session_state.validated_inputs == current_inputs'),
              ('                    validation_signature=current_signature,\n', ''),
          ])
          edit('apps/streamlit/onboarding.py', [('"validation_signature": ""', '"validated_inputs": None')])
          edit('apps/streamlit/ui_theme.py', [('st.session_state.validation_signature = ""', 'st.session_state.validated_inputs = None'), ('Reproducible run manifest', 'Public CLI execution')])
          edit('apps/streamlit/run_service.py', [
              ('    validation_signature: str = ""\n', ''),
              ('        validation_signature=str(request.validation_signature),\n', ''),
              ('        validation_signature=str(payload.get("validation_signature") or ""),\n', ''),
              ('            "validation_signature": normalized.validation_signature,\n', ''),
              ('            validation_signature=previous.validation_signature,\n', ''),
          ])
          edit('test/test_streamlit_config_service.py', [
              ('\nDIGEST = "a" * 64\n', ''),
              ('        "effective_config_sha256": DIGEST,\n', ''),
              ('    assert report.effective_config_sha256 == DIGEST\n', '    assert "effective_config_sha256" not in vars(report)\n'),
          ])
          edit('test/test_streamlit_ui_imports.py', [
              ('test_validation_signature_uses_only_visible_ui_inputs', 'test_validation_snapshot_uses_only_visible_ui_inputs'),
              ('workspace._signature(', 'workspace._validation_inputs('),
          ])
          Path('test/test_streamlit_config_service.py').open('a').write('''

          @pytest.mark.parametrize("sanity", [[], None, [{}], [{"ok": "false"}], [True]])
          def test_inspector_rejects_incomplete_or_untyped_checks(monkeypatch, tmp_path, sanity):
              root = _repo(tmp_path)
              payload = _inspector_payload()
              payload["sanity"] = sanity
              monkeypatch.setattr(cs.subprocess, "run", lambda *args, **kwargs: SimpleNamespace(
                  returncode=0, stdout=json.dumps(payload), stderr=""))
              report = cs.inspect_config(root, root / "configs/demo/demo.yaml")
              assert not report.ok
              assert "incomplete payload" in report.error


          def test_inspector_preserves_a_failed_check(monkeypatch, tmp_path):
              root = _repo(tmp_path)
              payload = _inspector_payload()
              payload["sanity"] = [{"check": "device", "ok": False, "message": "Rejected."}]
              monkeypatch.setattr(cs.subprocess, "run", lambda *args, **kwargs: SimpleNamespace(
                  returncode=0, stdout=json.dumps(payload), stderr=""))
              report = cs.inspect_config(root, root / "configs/demo/demo.yaml")
              assert not report.ok
              assert report.failed_checks[0]["message"] == "Rejected."
          ''')
          Path('test/test_streamlit_ui_imports.py').open('a').write('''

          def test_validation_snapshot_preserves_types_and_copies_nested_values(monkeypatch):
              _install_streamlit_stub(monkeypatch)
              sys.modules.pop("apps.streamlit.workspace", None)
              workspace = importlib.import_module("apps.streamlit.workspace")
              capture = workspace._validation_inputs
              assert capture("Advanced", "yaml", (("value", True),)) != capture("Advanced", "yaml", (("value", 1),))
              assert capture("Advanced", "yaml", (("value", 1),)) != capture("Advanced", "yaml", (("value", "1"),))
              values = [1, 2]
              checked = capture("Advanced", "yaml", (("values", values),))
              values.append(3)
              assert checked != capture("Advanced", "yaml", (("values", values),))
              assert checked == capture("Advanced", "yaml", (("values", [1, 2]),))
          ''')
          edit('apps/streamlit/REVIEW.md', [('exact signature that passed repository', 'same submitted inputs that passed repository')])
          PY
          python -m py_compile apps/streamlit/*.py test/test_streamlit_*.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/streamlit test/test_streamlit_config_service.py test/test_streamlit_ui_imports.py
          git commit -m 'fix(streamlit): accept current inspector and compare submitted inputs directly'
          git push origin HEAD:fix/streamlit-inspector-parity-20260908
