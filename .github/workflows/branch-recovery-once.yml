name: Branch recovery (one-off)
on:
  push:
    branches: [maintenance/branch-recovery-20260907]
    paths: [.github/workflows/branch-recovery-once.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  repair_explanation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source changes to the existing explanation PR
        run: |
          set -euo pipefail
          mkdir -p /tmp/repair-result
          test "$(git rev-parse origin/research/phmfactory-llm-explanation-contract-20260905)" = b2669f87a3e5156ab3f498916b8d47192e185b35
          test "$(git rev-parse origin/dev)" = d478fb9d3a862b4fe8d00094bf753d5e2feda196
          git config user.name 'PHMFactory maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add -b repair-pr223 /tmp/pr223 origin/research/phmfactory-llm-explanation-contract-20260905
          cd /tmp/pr223
          git merge --no-edit origin/dev
          git apply --check "$GITHUB_WORKSPACE/.maintenance/explanation.patch"
          git apply "$GITHUB_WORKSPACE/.maintenance/explanation.patch"
          python -m pip install 'pytest>=7'
          python -m pytest test/test_llm_explanation_contract.py -q | tee /tmp/repair-result/contract-tests.txt
          python -m py_compile phmfactory/explanation/adapters.py phmfactory/explanation/llm.py test/test_llm_explanation_models.py
          git diff --check
          git add phmfactory/explanation/adapters.py phmfactory/explanation/llm.py test/test_llm_explanation_contract.py test/test_llm_explanation_models.py
          git commit -m 'fix(explanation): preserve selected inference semantics and reject text coercion'
          git push origin HEAD:refs/heads/research/phmfactory-llm-explanation-contract-20260905
          git rev-parse HEAD > /tmp/repair-result/head.txt
          git diff origin/dev..HEAD --stat > /tmp/repair-result/diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explanation-repair-result
          path: /tmp/repair-result/
          retention-days: 30
