name: Branch recovery (one-off)
on:
  push:
    branches: [maintenance/branch-recovery-20260907]
    paths: [.github/workflows/branch-recovery-once.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  finish_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the two source-reviewed corrections to PR 223
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/review-result
          branch=research/phmfactory-llm-explanation-contract-20260905
          test "$(git rev-parse origin/$branch)" = 8e00a256af62f9e2e880b43010c63c60d64c11ad
          git config user.name 'PHMFactory maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add -b finish-pr223 /tmp/pr223 "origin/$branch"
          cd /tmp/pr223
          python - <<'PY'
          from pathlib import Path
          f = Path('phmfactory/explanation/adapters.py')
          text = f.read_text()
          old = '        raise ValueError(f"class_names must contain exactly {size} non-empty labels")\n    return labels'
          new = '        raise ValueError(f"class_names must contain exactly {size} non-empty labels")\n    if len(set(labels)) != len(labels):\n        raise ValueError("class_names must contain unique labels")\n    return labels'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '    return PHMExplanationState(\n        sample_id=sample_id,\n        task=task,\n        model_family="TSPN_UXFD",'
          new = '''    effective_mask = _sample(
                  _field(trace, "rule_mask"), sample_index, name="rule_mask"
              )
              effective_permutation = _python(_field(trace, "consequent_permutation"))
              # Native permutations are either shared [rules] or per-sample [batch, rules].
              if effective_permutation is not None and isinstance(effective_permutation[0], Sequence):
                  effective_permutation = _sample(
                      effective_permutation, sample_index, name="consequent_permutation"
                  )
              if effective_mask is None or effective_permutation is None:
                  limitations.append("Effective intervention values were not supplied in this trace.")
          
              return PHMExplanationState(
                  sample_id=sample_id,
                  task=task,
                  model_family="TSPN_UXFD",'''
          # The string above is indented for YAML; remove four spaces from its later lines.
          lines = new.splitlines()
          new = '\n'.join([lines[0]] + [line[4:] if line.startswith('    ') else line for line in lines[1:]])
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '                "total_rule_count": len(firing),'
          new = old + '\n                "rule_mask": effective_mask,\n                "consequent_permutation": effective_permutation,'
          assert text.count(old) == 1
          f.write_text(text.replace(old, new))
          f = Path('test/test_llm_explanation_models.py')
          with f.open('a') as out:
              out.write('''
          
          @pytest.mark.parametrize("class_names", [("fault", "fault"), ("fault", " fault ")])
          def test_duplicate_class_labels_are_rejected(class_names):
              model = TSPNUXFD(_make_args(enable_fuzzy=True)).eval()
              with torch.no_grad():
                  output = model.forward_with_fuzzy_trace(torch.randn(2, 128, 2))
              with pytest.raises(ValueError, match="unique labels"):
                  state_from_tspn_uxfd_fuzzy_trace(output, sample_id="duplicate", class_names=class_names)
          
          
          @pytest.mark.parametrize("per_sample", [False, True])
          def test_fuzzy_intervention_exports_the_selected_effective_values(per_sample):
              torch.manual_seed(19)
              model = TSPNUXFD(_make_args(enable_fuzzy=True)).eval()
              x = torch.randn(2, 128, 2)
              with torch.no_grad():
                  original = model.forward_with_fuzzy_trace(x)
                  rules = original.fuzzy_trace.rule_mask.shape[1]
                  mask = torch.ones(2, rules, dtype=torch.bool)
                  mask[1, 0] = False
                  permutation = torch.arange(rules - 1, -1, -1)
                  if per_sample:
                      permutation = torch.stack([torch.arange(rules), permutation])
                  output = model.forward_with_fuzzy_trace(x, rule_mask=mask, consequent_permutation=permutation)
                  state = state_from_tspn_uxfd_fuzzy_trace(output, sample_id="intervention", sample_index=1)
              metadata = state.to_dict()["metadata"]
              assert metadata["rule_mask"] == output.fuzzy_trace.rule_mask[1].tolist()
              expected = output.fuzzy_trace.consequent_permutation
              if per_sample:
                  expected = expected[1]
              assert metadata["consequent_permutation"] == expected.tolist()
              assert state.prediction.logits == pytest.approx(output.logits[1].tolist(), abs=1e-6)
              original_state = state_from_tspn_uxfd_fuzzy_trace(original, sample_id="original", sample_index=1)
              original_metadata = original_state.to_dict()["metadata"]
              assert original_metadata["rule_mask"] == [True] * rules
              assert original_metadata["consequent_permutation"] == list(range(rules))
          ''')
          PY
          python -m py_compile phmfactory/explanation/adapters.py test/test_llm_explanation_models.py
          python -m pip install 'pytest>=7'
          python -m pytest test/test_llm_explanation_contract.py -q | tee /tmp/review-result/contract-tests.txt
          git diff --check
          git add phmfactory/explanation/adapters.py test/test_llm_explanation_models.py
          git commit -m 'fix(explanation): retain intervention values and reject ambiguous class labels'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/review-result/head.txt
          git diff HEAD^ HEAD > /tmp/review-result/review-fixes.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explanation-review-final
          path: /tmp/review-result/
          retention-days: 30
