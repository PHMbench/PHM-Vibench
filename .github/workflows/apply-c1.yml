name: Temporary C1 patch application
on:
  push:
    branches: [fix/streamlit-detached-recheck-20260909]
    paths: [.github/workflows/apply-c1.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/streamlit-detached-recheck-20260909
      - name: Apply tested frontend-only change
        run: |
          set -euo pipefail
          git apply --check .c1-recovery.patch
          git apply .c1-recovery.patch
          git diff --check
          python -m py_compile apps/streamlit/run_service.py apps/streamlit/ui_runtime.py test/test_streamlit_run_service.py test/test_streamlit_app.py
          git add apps/streamlit/README.md apps/streamlit/run_service.py apps/streamlit/ui_runtime.py test/test_streamlit_run_service.py test/test_streamlit_app.py doc/changelog/2026-09-09-streamlit-detached-recovery.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(streamlit): reconcile detached runs without inventing outcomes'
          git push origin HEAD:fix/streamlit-detached-recheck-20260909
