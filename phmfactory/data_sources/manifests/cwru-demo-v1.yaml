schema_version: 1
bundle_id: cwru-demo-v1
dataset_name: CWRU
release_pin_required: false

files:
  metadata:
    filename: metadata.xlsx
    required: true
  signals:
    filename: RM_001_CWRU.h5
    required: true
  corpus:
    filename: corpus.xlsx
    required: false

metadata:
  id_column: Id
  required_columns:
    - Dataset_id
    - Label
    - Domain_id
  selector:
    column: Name
    values:
      - RM_001_CWRU
  column_aliases:
    sample_length:
      - Sample_lenth
      - Sample_lenth (L)
      - Sample_length
    channel_count:
      - Channel
      - Channel (C)

providers:
  huggingface:
    repo_id: PHMbench/PHM-Vibench
    revision: main
    repo_type: dataset
    files:
      metadata: metadata.xlsx
      signals: RM_001_CWRU.h5
      corpus: corpus.xlsx
  modelscope:
    repo_id: PHMbench/PHM-Vibench
    revision: master
    files:
      metadata: metadata.xlsx
      signals: RM_001_CWRU.h5
      corpus: corpus.xlsx

# For v0.3.0-rc1, this compatibility bundle is accepted through executable
# scientific checks: required metadata fields, unique selected IDs, Id-to-signal
# coverage, (L, C) signal shape, and metadata length/channel consistency.
# Per-file digests and cross-provider byte identity are optional diagnostics,
# not release or scientific-validity gates.
