[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phmfactory"
version = "0.3.0.dev0"
description = "Configuration-first PHM research and evaluation framework"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "PHMFactory contributors" },
]
dynamic = ["dependencies"]

[project.scripts]
phmfactory = "phmfactory.cli:entrypoint"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["phmfactory*", "src*", "configs*", "data*"]
exclude = ["test*", "tests*", "dev*", "paper*", "results*"]

[tool.setuptools.package-data]
"phmfactory.data_sources.manifests" = ["*.yaml"]
"phmfactory.data_sources.modelscope" = ["requirements.txt"]
"configs" = ["**/*.yaml", "**/*.yml", "**/*.csv", "**/*.md"]
"data" = ["metadata_dummy.csv", "raw/Dummy_Data/*.csv"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
