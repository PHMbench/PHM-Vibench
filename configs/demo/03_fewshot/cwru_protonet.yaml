# Compatibility filename: this is supervised CWRU classification with held-out
# windows. It does not implement ProtoNet or an episodic support/query objective.

pipeline: "Pipeline_01_Fault_Diagnosis"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_fewshot.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/fewshot.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

data: {}

task:
  # FS remains a compatibility selector for the existing data adapter/split path.
  # The task and loss are ordinary supervised classification + CE.
  type: "FS"
  name: "classification"
  lr: 0.001

trainer:
  num_epochs: 1
