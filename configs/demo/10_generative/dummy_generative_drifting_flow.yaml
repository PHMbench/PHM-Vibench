# Experimental one-step Drifting Flow PHM smoke demo.

pipeline: "Pipeline_06_generative"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/generative_cfm.yaml"
  task: "configs/base/task/generative_drifting_flow.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_dummy_generative_drifting_flow"
  seed: 0
  output_dir: "results/demo/dummy_generative_drifting_flow"
  notes: "Experimental Drifting Flow smoke test on dummy metadata."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 2
  num_workers: 0
  train_ratio: 0.8
  val_ratio: 0.2
  test_ratio: 0.0
  normalization: "standardization"
  window_size: 128
  stride: 16
  num_window: 4
  dtype: "float32"

model:
  hidden_dim: 32

task:
  generative:
    mode: "train"
    synthetic_dataset_id: "dummy_generative_drifting_flow"

trainer:
  monitor: "val_loss"
  num_epochs: 1
  gpus: 0
  device: "cpu"
  early_stopping: false
  log_every_n_steps: 1
  save_top_k: 1
