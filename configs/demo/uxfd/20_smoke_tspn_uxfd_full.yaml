# UXFD demo: SP2D + fusion + fuzzy + operator-attention + logic (best-effort)

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/tspn_uxfd.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_uxfd_tspn_uxfd_full"
  seed: 0
  output_dir: "results/demo/uxfd/tspn_uxfd_full"
  notes: "TSPN_UXFD with multiple uxfd modules (best-effort)."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
  paper_id: "uxfd_demo_full"
  preset_version: "demo-uxfd-v1"
  extensions:
    predictions:
      enable: true

model:
  device: "cpu"
  uxfd:
    enable_sp2d: true
    fusion:
      type: "gated"
    fuzzy:
      enable: true
      logit_scale: 0.5
    operator_attention:
      enable: true
      operators: ["I", "FFT"]
      hidden_dim: 32
      temperature: 1.0
    logic:
      enable: true
      hidden_dim: 32
      logit_scale: 0.5

