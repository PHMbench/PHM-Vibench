# Compatibility filename: target_system_id contains one known system. This demo is
# ordinary CE training with held-out domains, not unknown-system generalization.

pipeline: "Pipeline_01_Fault_Diagnosis"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_system.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/cddg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_single_system_heldout_domain_erm"
  seed: 42
  output_dir: "results/demo/single_system_heldout_domain_erm"
  notes: "Known-system CE baseline with held-out domains. The configured system identity is available to the system-specific classification head."

task:
  target_system_id: [1]
