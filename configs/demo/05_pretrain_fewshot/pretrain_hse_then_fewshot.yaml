# Compatibility filename: this configuration contains no `stages` block and runs
# one HSE contrastive pretraining stage. It does not perform few-shot adaptation.

pipeline: "Pipeline_02_Pretraining_Few_Shot"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_classification.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/pretrain.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_hse_pretraining_smoke"
  seed: 42
  output_dir: "results/demo/hse_pretraining_smoke"
  notes: "Single-stage HSE contrastive pretraining smoke through Pipeline 02. No few-shot adaptation stage is configured."

task:
  type: "pretrain"
  name: "hse_contrastive"
  target_system_id: [1, 13, 6, 12, 19]
  target_domain_num: 1

trainer:
  num_epochs: 20
  test_after_fit: true
