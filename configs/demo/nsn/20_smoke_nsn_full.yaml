# NSN demo: SP2D + fusion + fuzzy + operator-attention + logic (best-effort)

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_nsn_full"
  seed: 0
  output_dir: "results/demo/nsn/nsn_full"
  notes: "NSN with multiple uxfd modules enabled (best-effort)."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
  paper_id: "nsn_demo_full"
  preset_version: "demo-nsn-v1"
  extensions:
    predictions:
      enable: true

model:
  type: "X_model"
  name: "NSN"
  device: "cpu"

  in_dim: 128
  out_dim: 128
  in_channels: 2

  out_channels: 4
  scale: 1
  skip_connection: true

  signal_processing_configs:
    layer1: ["I"]
  feature_extractor_configs: ["Mean", "Std"]

  signal_processing_2d:
    enable: true
    fusion:
      type: "gated"

  # decision_configs maps to legacy fuzzy/logic toggles (see src/model_factory/X_model/NSN.py)
  decision_configs:
    type: "fuzzy+logic"
    fuzzy:
      logit_scale: 0.5
    logic:
      hidden_dim: 32
      logit_scale: 0.5

  # operator-attention is currently only available via legacy uxfd knobs (kept inline here).
  uxfd:
    operator_attention:
      enable: true
      operators: ["I", "FFT"]
      hidden_dim: 32
      temperature: 1.0

