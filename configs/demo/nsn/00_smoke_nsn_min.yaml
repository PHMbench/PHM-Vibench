# NSN demo: minimal NSN wrapper (no extra modules enabled)

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_nsn_min"
  seed: 0
  output_dir: "results/demo/nsn/nsn_min"
  notes: "Minimal NSN smoke (no extra UXFD modules)."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
  paper_id: "nsn_demo_min"
  preset_version: "demo-nsn-v1"

model:
  type: "X_model"
  name: "NSN"
  device: "cpu"

  in_dim: 128
  out_dim: 128
  in_channels: 2

  out_channels: 4
  scale: 1
  skip_connection: true

  signal_processing_configs:
    layer1: ["I"]
  feature_extractor_configs: ["Mean", "Std"]

  decision_configs:
    type: "linear"

