# Transparent-model smoke: same packaged Dummy data/task/trainer path as
# dummy_dg.yaml, with only the Model Factory configuration replaced.

pipeline: "Pipeline_01_Fault_Diagnosis"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/global_average_linear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_dummy_global_average_linear_smoke"
  seed: 0
  output_dir: "results/demo/dummy_global_average_linear_smoke"
  notes: "Transparent model-replacement smoke on packaged Dummy CSV data."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  normalization: "none"
  window_size: 128
  num_window: 8

model:
  input_dim: 2

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  test_after_fit: true
  device: "cpu"
  devices: 1
