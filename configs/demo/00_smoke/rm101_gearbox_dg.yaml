# Smoke demo for RM_101_THU_GEARBOX (MCC5-THU)

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_rm101_gearbox_dg_smoke"
  seed: 0
  output_dir: "results/demo/rm101_gearbox_dg_smoke"
  notes: "Smoke test for RM_101_THU_GEARBOX with separate metadata."

data:
  data_dir: "${PHM_VIBENCH_DATA:-data}"
  metadata_file: "gear_metadata.xlsx"
  batch_size: 4
  num_workers: 0
  window_size: 1024
  stride: 128
  num_window: 4

task:
  target_system_id: [101]
  source_domain_id: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  target_domain_id: [9, 10, 11]

model:
  input_dim: 8

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
