# Forward-only P01 M1--M5 base. Alignment objective terms are added in G02.
model:
  type: X_model
  name: P01Alignment
  device: cpu
  condition: M5
  num_classes: 4
  in_channels: 2
  encoder_dim: 64
  latent_dim: 32
  head_hidden: 64
  attention_heads: 4
  dropout: 0.1
  renderer:
    n_fft: 128
    hop_length: 32
    win_length: 128
    window: hann
    window_periodic: true
    center: true
    pad_mode: reflect
    normalized: false
    onesided: true
    representation: magnitude
    scaling: log1p
    resize: none
    normalization: none
