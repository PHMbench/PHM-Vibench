task:
  # Compatibility selector for the existing GFS sampler. The maintained task
  # consumes the resulting batch with ordinary cross-entropy classification;
  # it does not expose support/query masks or base/novel class semantics.
  type: "GFS"
  name: "classification"

  target_system_id: [1, 13, 6, 12, 19]
  target_domain_num: 1

  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  early_stopping: true
  es_patience: 15

  loss: "CE"
  metrics: ["acc", "f1", "precision", "recall"]

  # These fields control hierarchical batch sampling only. The current sampler
  # selects one system per episode and emits one ordinary x/y batch.
  num_episodes: 100
  num_systems: 1
  num_domains: 1
  num_labels: 3
  num_support: 5
  num_query: 15
