task:
  # Compatibility selector for the existing FS data path. The maintained task is
  # ordinary supervised classification, not episodic few-shot learning.
  type: "FS"
  name: "classification"
  loss: "CE"
  metrics:
    - "acc"

  target_system_id: [1]

  lr: 0.001
  optimizer: "adamw"
  weight_decay: 0.0001
