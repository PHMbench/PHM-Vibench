# P04 G050 S2 RAND arm. Expert representations and trainable parameter shapes
# are identical to FULL. The only conceptual change is the externally bound,
# fixed-point-free cue-to-expert prior permutation for each training seed.

pipeline: "Pipeline_01_Fault_Diagnosis"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/role_constrained_moe.yaml"
  task: "configs/base/task/classification.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

protocol:
  paper_id: "P04"
  goal_id: "P04-G050"
  experiment_id: "E-MINDEC"
  stage: "S2"
  arm: "RAND"
  evidence_intent: true
  launch_status: "ready"
  sole_conceptual_change_from_full: "model.role_prior_permutation"
  random_role_binding: "external_config_must_pair_environment.seed_and_model.role_prior_permutation"
  random_role_prior_permutations:
    - {seed: 42, permutation: [1, 2, 3, 0]}
    - {seed: 123, permutation: [2, 3, 0, 1]}
    - {seed: 456, permutation: [3, 0, 1, 2]}
    - {seed: 789, permutation: [1, 3, 0, 2]}
    - {seed: 1024, permutation: [2, 0, 3, 1]}
    - {seed: 2027, permutation: [1, 0, 3, 2]}
    - {seed: 4096, permutation: [2, 3, 1, 0]}
    - {seed: 8192, permutation: [3, 2, 0, 1]}
    - {seed: 16384, permutation: [3, 2, 1, 0]}
    - {seed: 32768, permutation: [1, 0, 3, 2]}
  required_runtime_bindings:
    - "generator_source_sha256"
    - "generator_manifest_sha256"
    - "partition_manifest_sha256"
    - "held_out_evaluator_source_sha256"
    - "seed_specific_random_role_permutation"
  current_runtime_blockers: []
  runtime_bindings:
    generator_source_sha256: "747420e82c6ece64731481458a4d261dfb2863cbef6a2acea694bbbe42288f1a"
    generator_manifest_sha256: "39f37e326a11e7d0b59c91458c4f15eebf2d5f436ab6904b1a922ec2dc36c68e"
    partition_manifest_sha256: "5788451a4666762fac53a96008e982e4d202f46e0b834e4cee7c81b9a32effd9"
    held_out_evaluator_source_sha256: "d7bfbbdad3f28467f90e4bd61e0fa7f0921eae9e049c6e8d79a51d521d623508"
    seed_permutation_enforcement: "collect_checkpoint_outputs.py strict validation"
  response_evaluator_input: "diagnostics.expert_features"
  response_cross_check: "diagnostics.response_only_signature"

environment:
  project: "p04_g050_decisive_random_role"
  seed: 42
  iterations: 1
  output_dir: "results/experiments/p04/v5/E-MINDEC/RAND/synthetic/seed_42"
  notes: "Seed-42 RAND default; override seed and permutation together."

data:
  data_dir: "data/derived/p04/synthetic_v1"
  metadata_file: "metadata.csv"
  batch_size: 64
  num_workers: 0
  normalization: "none"
  window_size: 512
  stride: 512
  num_window: 1
  dtype: "float32"
  pin_memory: true
  split:
    strategy: "grouped_metadata"
    group_key: "Split_group"
    stratify_key: "Split_stratum"
    seed: 240401
    test_policy: "partition"
    manifest_path: null  # required CLI binding before evidence launch
    manifest_mode: "read_only"
    manifest_sha256: null  # required CLI binding before evidence launch
    partition_map:
      train: "train"
      val: "optimization_validation"
      test: "intervention"

model:
  type: "MoE"
  name: "M_04_RoleConstrainedMoE"
  input_dim: 2
  num_classes: 4
  feature_dim: 64
  expert_hidden_channels: 32
  router_hidden_dim: 32
  dropout: 0.10
  routing_temperature: 1.0
  router_mode: "learned_prior"
  expert_representation_mode: "role_constrained"
  low_cutoff: 0.12
  envelope_band: [0.20, 0.80]
  filter_transition: 0.03
  role_prior_strength: 0.50
  role_prior_max: 1.00
  role_prior_permutation: [1, 2, 3, 0]
  role_prior_assignment: "external_deranged"
  load_balance_weight: 0.01
  entropy_floor_weight: 0.01
  entropy_floor: 0.25

task:
  type: "Default_task"
  name: "Default_task"
  loss: "CE"
  metrics: ["acc"]
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  target_system_id: [904]

trainer:
  name: "Default_trainer"
  monitor: "val_loss"
  num_epochs: 50
  test_after_fit: false
  early_stopping: true
  patience: 7
  min_delta: 0.0001
  deterministic: true
  device: "cuda"
  gpus: 1
