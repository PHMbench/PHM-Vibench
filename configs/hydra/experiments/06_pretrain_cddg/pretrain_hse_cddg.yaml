# @package _global_
defaults:
  - /pipeline: pipeline_01_default
  - /environment: base
  - /data: base_cross_system
  - /model: backbone_dlinear
  - /task: pretrain
  - /trainer: default_single_gpu
  - _self_

pipeline: "Pipeline_01_default"

environment:
  project: "demo_pretrain_hse_cddg"
  seed: 42
  output_dir: "results/demo/pretrain_hse_cddg"
  notes: "Pretrain HSE for CDDG / unified metric learning demo."

data:
  train_ratio: 0.7
  stride: 10

task:
  name: "hse_contrastive"
  type: "pretrain"
  contrast_loss: "INFONCE"
  contrastive_pairing: "simclr_2view"
  contrast_weight: 1.0
  classification_weight: 0.0
  temperature: 0.07
  target_system_id: [1]
  target_domain_num: 1
  lr: 0.0005
  weight_decay: 0.0001

trainer:
  num_epochs: 50
