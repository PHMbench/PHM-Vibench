# P05 - BASELINE comparator (B06): Transformer.ConvTransformer in-domain.
# ADDITIVE config under configs/experiments/p05/.
# Derives from configs/demo/01_cross_domain/cwru_dg.yaml.
#
# Status: ready (Transformer.ConvTransformer is registered in model_registry.csv
#   with args: input_dim, d_model, n_heads, num_layers, kernel_size,
#   num_classes/output_dim). This stands in for the legacy draft's deep
#   transformer comparator (B06 in
#   legacy/source_snapshot/submission_prep/baseline_ablation_matrix.yaml).
#   The legacy B06 was only ever a dummy-smoke CPU-fallback run; this config
#   must be produced under the SAME protocol/split/seed as the method arm.
#
# Smoke-friendly default: trainer.num_epochs=1, device=cpu.
#
# Sweep policy: identical seed/dataset policy to method_fuzzy_indomain.yaml.
#
# Supports: CLAIM-BASELINE-001 (transformer row), CLAIM-IMP-001.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p05_baseline_convtransformer_indomain"
  seed: 42
  output_dir: "results/experiments/p05/baseline_convtransformer_indomain"
  notes: "P05 baseline comparator B06: registered Transformer.ConvTransformer on CWRU/XJTU."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

model:
  # Registered (model_registry.csv: Transformer,ConvTransformer,...).
  type: "Transformer"
  name: "ConvTransformer"
  input_dim: 2
  d_model: 64
  n_heads: 4
  num_layers: 2
  kernel_size: 7
  num_classes: 10

task:
  target_system_id: [1]              # CWRU default; sweep [1]/[2]
  source_domain_id: [0, 1, 2]
  target_domain_id: [3]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
