# Unmerged-kernel ModernTCN classifier, one-epoch software smoke.
pipeline: Pipeline_01_Fault_Diagnosis
base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  task: configs/base/task/dg.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml
environment:
  project: native_moderntcn_smoke
  seed: 0
  iterations: 1
  output_dir: results/model_integration/moderntcn
  wandb: false
  swanlab: false
data:
  data_dir: data
  metadata_file: metadata_dummy.csv
  batch_size: 4
  num_workers: 0
  window_size: 128
  num_window: 8
model:
  type: CNN
  name: ModernTCN
  seq_len: 128
  input_dim: 2
  num_classes: 2
  patch_size: 8
  patch_stride: 4
  downsample_ratio: 2
  ffn_ratio: 2
  dims: [8, 16]
  num_blocks: [1, 1]
  large_size: [7, 7]
  small_size: [3, 3]
  dropout: 0.0
  class_dropout: 0.0
task:
  type: DG
  name: classification
  loss: CE
  metrics: [acc, f1]
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]
trainer:
  num_epochs: 1
  test_after_fit: true
  device: cpu
  devices: 1
  early_stopping: false
  log_every_n_steps: 1
