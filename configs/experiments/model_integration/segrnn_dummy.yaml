# Raw-window point forecasting with explicit SegRNN architecture choices.
pipeline: Pipeline_01_Fault_Diagnosis
base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  task: configs/base/task/dg.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml
environment:
  project: native_segrnn_forecast_smoke
  seed: 0
  iterations: 1
  output_dir: results/model_integration/segrnn
  wandb: false
  swanlab: false
data:
  data_dir: data
  metadata_file: metadata_dummy.csv
  batch_size: 4
  num_workers: 0
  window_size: 128
  num_window: 8
  normalization: none
model:
  type: RNN
  name: SegRNN
  seq_len: 96
  pred_len: 32
  input_dim: 2
  seg_len: 8
  d_model: 16
  dropout: 0.0
  rnn_type: gru
  dec_way: pmf
  channel_id: true
  revin: false
task:
  type: DG
  name: point_forecasting
  model_task_id: forecasting
  loss: MSE
  metrics: [mse, mae]
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]
trainer:
  num_epochs: 1
  test_after_fit: true
  device: cpu
  devices: 1
  early_stopping: false
  log_every_n_steps: 1
