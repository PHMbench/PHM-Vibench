# Software demo only: three simulated signal classes, source conditions 0/1,
# unseen target condition 2. These are not real bearings or MFPT/PU samples.
# File-grouped source validation; no target fitting or selection; frozen test.
# Fixed 2-epoch, seed-17 budget; full-window accuracy and macro-F1.
base_configs:
  reference: "configs/baselines/01_mfpt/mfpt_global_average_linear.yaml"
environment:
  project: "simulated_dg_linear"
  seed: 17
  iterations: 1
  output_dir: "results/experiments/phmfactory/simulated_dg_linear"
  wandb: false
  swanlab: false
  notes: "Simulation-only supervised/DG execution, not real PHM validation."
data:
  data_dir: "data/simulated_phm"
  metadata_file: "metadata_simulated.csv"
  window_size: 128
  num_window: 8
  batch_size: 16
  num_workers: 0
  use_cache: false
  cache_dir: "results/experiments/phmfactory/simulated_dg_linear/cache"
  split:
    group_key: "File"
    manifest_path: "results/experiments/phmfactory/simulated_dg_linear/split.json"
model:
  input_dim: 2
task:
  target_system_id: [900]
  source_domain_id: [0, 1]
  target_domain_id: [2]
trainer:
  num_epochs: 2
  early_stopping: false
