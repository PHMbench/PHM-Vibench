# Simulation-only F0/F1 candidate; not real bearings or MFPT/PU.
# Population: 27 records; source conditions 0/1, target condition 2.
# Access: source inputs/labels for fit and selection; target truth for evaluation only.
# Timing/state: offline fit, restore source-selected checkpoint, frozen target prediction.
# Selection: val_loss on source files (File-grouped 75/25 split, split seed 17).
# Budget: training seed 17, 2 epochs, 1 run, 8 x 128-point windows per record.
# Estimator: pooled-window accuracy and macro-F1 on all 72 target windows.
# File isolation does not imply asset isolation: simulated units recur across conditions.
# These fields below are executed; comments explain their six-part scientific meaning.
base_configs:
  reference: "configs/baselines/01_mfpt/mfpt_global_average_linear.yaml"
environment:
  project: "simulated_dg_linear"
  seed: 17
  iterations: 1
  output_dir: "results/experiments/phmfactory/simulated_dg_linear"
  wandb: false
  swanlab: false
  notes: "Simulation-only supervised/DG execution, not real PHM validation."
data:
  data_dir: "data/simulated_phm"
  metadata_file: "metadata_simulated.csv"
  window_size: 128
  num_window: 8
  batch_size: 16
  num_workers: 0
  use_cache: false
  cache_dir: "results/experiments/phmfactory/simulated_dg_linear/cache"
  split:
    group_key: "File"
    manifest_path: "results/experiments/phmfactory/simulated_dg_linear/split.json"
model:
  input_dim: 2
task:
  target_system_id: [900]
  source_domain_id: [0, 1]
  target_domain_id: [2]
trainer:
  num_epochs: 2
  early_stopping: false
