# Simulation-only conditional generation; not physical or diagnostic validation.
# Population: 27 records; 6 train + 2 validation windows per record (162/54).
# Access: training signals and class/domain conditions; validation for model selection.
# Timing/state: train -> restore selected checkpoint -> sample -> fixed-state evaluation.
# Selection: minimum validation loss; that validation set is not an untouched final test.
# Budget: seed 17, 2 epochs, 8 Euler steps; 3 classes x 3 conditions x 6 samples = 54.
# Estimator: declared smoke metrics over all validation windows and requested samples.
# Raw intervals are disjoint; records/assets/conditions are shared. Units are standardized.
base_configs:
  reference: "configs/demo/10_generative/dummy_generative_cfm.yaml"
environment:
  project: "simulated_cfm"
  seed: 17
  iterations: 1
  output_dir: "results/experiments/phmfactory/simulated_cfm"
  notes: "Explicit simulation; held-out windows from seen records and conditions."
data:
  data_dir: "data/simulated_phm"
  metadata_file: "metadata_simulated.csv"
  batch_size: 16
  num_window: 8
  window_size: 128
  window_sampling_strategy: "evenly_spaced"
  train_ratio: 0.75
  val_ratio: 0.25
  test_ratio: 0.0
  normalization: "standardization"
  use_cache: false
  cache_dir: "results/experiments/phmfactory/simulated_cfm/cache"
model:
  num_fault_classes: 3
  num_domains: 3
task:
  target_system_id: [900]
  generative:
    synthetic_dataset_id: "simulation_cfm"
    eval_split: "val"
    num_samples: 54
    condition_sampling_policy: "grid"
    condition_grid:
      fault_label: [0, 1, 2]
      domain_id: [0, 1, 2]
      samples_per_condition: 6
trainer:
  num_epochs: 2
