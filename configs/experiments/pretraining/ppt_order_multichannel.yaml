# Experimental full time/channel PPT contract. Use fixed-channel data for real runs.
pipeline: Pipeline_01_default

base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml

environment:
  project: experiment_ppt_order_multichannel
  seed: 42
  iterations: 5
  output_dir: results/experiments/ppt_order_multichannel
  notes: Clean-room PPT objective; synthetic contract-tested and not benchmark-valid.

data:
  data_dir: data
  metadata_file: metadata_dummy.csv
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 128
  num_window: 8
  normalization: standardization

model:
  type: ISFM
  name: M_01_ISFM
  embedding: E_03_Patch
  backbone: B_08_PatchTST
  task_head: H_01_Linear_cla
  channel_independent: true
  input_dim: 4
  window_size: 128
  patch_size_L: 16
  patch_size_C: 1
  num_patches: 8
  d_model: 64
  output_dim: 64
  num_heads: 4
  e_layers: 2
  d_ff: 128
  factor: 5
  dropout: 0.1
  activation: gelu

task:
  type: pretrain
  name: ppt_order
  loss: CE
  metrics: [acc]
  optimizer: adamw
  lr: 0.002
  weight_decay: 0.0001
  ppt:
    mode: ssl
    order_axes: [time, channel]
    weighting: uncertainty
    weak_swaps: 1
    strong_swaps: 5
    channel_weak_swaps: 1
    channel_strong_swaps: 2
    permutation_bank_size: 256
    permutation_seed: 42
    temperature: 0.1
    consistency_weight: 1.0
    contrastive_weight: 1.0
    classification_weight: 1.0

trainer:
  num_epochs: 1
  device: cpu
  gpus: 1
