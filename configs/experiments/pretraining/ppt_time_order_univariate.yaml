# Experimental time-order-only subset of PPT (ICLR 2025).
pipeline: Pipeline_01_default

base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml

environment:
  project: experiment_ppt_time_order_univariate
  seed: 42
  output_dir: results/experiments/ppt_time_order_univariate
  notes: Requires a single-channel dataset; channel-order PPT is not implemented.

data:
  data_dir: data
  metadata_file: metadata_single_channel.xlsx
  batch_size: 32
  num_workers: 0
  window_size: 512
  stride: 512
  num_window: 32
  normalization: standardization

model:
  type: ISFM
  name: M_01_ISFM
  embedding: E_03_Patch
  backbone: B_08_PatchTST
  task_head: H_01_Linear_cla
  input_dim: 1
  window_size: 512
  patch_size_L: 16
  patch_size_C: 1
  num_patches: 32
  d_model: 128
  output_dim: 128
  num_heads: 4
  e_layers: 3
  d_ff: 256
  factor: 5
  dropout: 0.1
  activation: gelu

task:
  type: pretrain
  name: ppt_time_order
  loss: CE
  metrics: [acc]
  optimizer: adamw
  lr: 0.002
  weight_decay: 0.0001
  weak_swaps: 1
  strong_swaps: 10
  permutation_bank_size: 256
  permutation_seed: 42
  temperature: 0.1
  consistency_weight: 1.0
  contrastive_weight: 1.0

trainer:
  num_epochs: 10
  device: cpu
  gpus: 0
