pipeline: Pipeline_01_default
base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  model: configs/base/model/backbone_dlinear.yaml
  task: configs/base/task/dg.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml
environment:
  project: p07_case1_cwru_baselines_dg
  seed: 42
  output_dir: results/experiments/p07/case1_cwru_baselines_dg
  notes: "P07 Case1 baselines on CWRU DG. Select baseline via:\n  --override model.type=CNN  model.name=ResNet1D  (M1)\n  --override model.type=X_model model.name=MWA_CNN (M4)\nSincNet (M2) and WKN (M3) are needs_new_component.\n"
data:
  metadata_file: metadata.xlsx
  window_size: 4096
  batch_size: 64
  num_workers: 0
  normalization: standardization
  split:
    strategy: grouped_metadata
    group_key: File
    stratify_key: null
    seed: 42
    test_policy: partition
    fractions:
      train: 0.7
      val: 0.15
      test: 0.15
    manifest_path: results/experiments/p07/case1_cwru_baselines_dg/splits/manifest_seed42.json
model:
  type: CNN
  name: ResNet1D
  input_dim: 2
  num_classes: 4
  block_type: basic
  layers:
  - 2
  - 2
  - 2
  - 2
  initial_channels: 32
task:
  type: DG
  name: classification
  loss: CE
  metrics:
  - acc
  - f1_macro
  target_system_id:
  - 1
  source_domain_id:
  - 0
  - 1
  - 2
  target_domain_id:
  - 3
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  epochs: 1
trainer:
  num_epochs: 1
  device: cpu
  gpus: 1
  paper_id: P07
  preset_version: p07-case1-cwru-baselines-v1
