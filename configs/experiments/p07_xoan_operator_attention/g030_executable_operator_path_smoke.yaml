# P07-G030 method wiring smoke. This is software verification, not claim evidence.
pipeline: "Pipeline_01_Fault_Diagnosis"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/xoan_operator_path.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p07_g030_executable_operator_path_smoke"
  seed: 0
  output_dir: "results/experiments/p07/g030_executable_operator_path_smoke"
  notes: >-
    CPU-only method smoke for the typed continuous-sparsemax DAG, deterministic
    per-sample export, and independent discrete executor. It cannot support
    C6-C9 because it uses dummy data, one seed, and no approved thresholds.

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  window_size: 128
  batch_size: 4
  num_workers: 0

model:
  type: "X_model"
  name: "XOANOperatorPath"
  device: "cpu"
  in_channels: 2
  num_classes: 2
  classifier_hidden_dim: 64
  dropout: 0.1
  inference_mode: "discrete"
  operator_path:
    dictionary_id: "p07-real-series-operators"
    dictionary_version: "2.0.0"
    stage_operators:
      - ["I", "D1", "ABS", "SQUARE", "MA3", "HT"]
      - ["I", "D1", "ABS", "SQUARE", "MA3", "HT"]
      - ["I", "D1", "ABS", "SQUARE", "MA3", "HT"]
    addable_stage_operators:
      - ["MA5"]
      - ["MA5"]
      - ["MA5"]
    hidden_dim: 64
    temperature: 1.0
    relaxation: "sparsemax"
    relaxation_version: "sparsemax-euclidean-projection-1"
    support_tolerance: 1.0e-8
    execution_mode: "relaxed"
    tie_break_rule: "registry_order"
    input_kind: "blc_real_series"
    entropy_weight: 0.5
    export_gap_weight: 0.5
    eps: 1.0e-8

task:
  type: "DG"
  name: "classification"
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  test_after_fit: true
  device: "cpu"
  gpus: 1
  paper_id: "P07"
  preset_version: "p07-g030-method-smoke-v1"
