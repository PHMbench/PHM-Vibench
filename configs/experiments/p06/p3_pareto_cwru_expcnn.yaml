pipeline: Pipeline_01_default
base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  model: configs/base/model/tspn_uxfd.yaml
  task: configs/base/task/dg.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml
environment:
  project: p06_p3_pareto_cwru_expcnn
  seed: 42
  output_dir: results/experiments/p06/p3_pareto_cwru_expcnn
  notes: P06 P3 Pareto (BASE_ExplainableCNN row); same protocol as p3_pareto_cwru_dg.yaml.
data:
  metadata_file: metadata.xlsx
  window_size: 4096
  stride: 5
  batch_size: 64
  num_workers: 0
  normalization: standardization
  split:
    strategy: grouped_metadata
    group_key: File
    stratify_key: null
    seed: 42
    test_policy: task_defined
    fractions:
      train: 0.85
      val: 0.15
    manifest_path: results/experiments/p06/p3_pareto_cwru_expcnn/splits/manifest_seed42.json
model:
  type: X_model
  name: BASE_ExplainableCNN
  in_channels: 2
  width: 32
  dropout: 0.1
task:
  type: DG
  name: classification
  loss: CE
  metrics:
  - acc
  - f1_macro
  target_system_id:
  - 1
  source_domain_id:
  - 0
  - 1
  - 2
  target_domain_id:
  - 3
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  epochs: 1
trainer:
  num_epochs: 1
  device: cpu
  gpus: 1
