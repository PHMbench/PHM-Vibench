# P09 Exp-1: HSE direct GFS classification (no pretrain, no prompt).
# Derives from demo configs/demo/04_cross_system_fewshot/cross_system_tspn.yaml and
# configs/demo/05_pretrain_fewshot/pretrain_hse_then_fewshot.yaml.
# Single-stage GFS across the 5-system pool. Acts as the "no pretrain" reference for ablations.
#
# NOTE (P09-G040 blocker): the GFS base/novel label mapping per target system s* is NOT
# encoded yet; lock at PROTOCOL_LOCK.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_system_fewshot.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/cddg_fewshot.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p09_exp1_hse_direct"
  seed: 42
  output_dir: "results/p09/exp1_hse_direct"
  notes: "P09 Exp1: HSE direct GFS classification (no pretrain, no prompt)."

model:
  name: "M_01_ISFM"
  type: "ISFM"
  embedding: "E_01_HSE"
  backbone: "B_04_Dlinear"
  task_head: "H_01_Linear_cla"
  input_dim: 1
  d_model: 256
  output_dim: 128
  num_heads: 8
  num_layers: 4
  e_layers: 4
  d_ff: 512
  patch_size_L: 64
  patch_size_C: 1
  num_patches: 64
  use_prompt: false
  prompt_dim: 0

task:
  type: "GFS"
  name: "classification"
  target_system_id: [1, 13, 6, 12, 19]   # CWRU, Ottawa-19, THU, JNU, HUST24 (see README)
  target_domain_num: 1
  loss: "CE"
  metrics: ["acc", "f1", "precision", "recall"]
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  num_episodes: 100
  num_systems: 1
  num_domains: 1
  num_labels: 3
  num_support: 5
  num_query: 15

trainer:
  num_epochs: 1   # smoke default; real launch overrides (legacy used 200)
  gpus: 1
