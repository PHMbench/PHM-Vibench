  target_system_ids: [1, 5, 6, 12, 18, 19]
  canonical_maps:
    1: {0: 0, 1: 1, 3: 2, 2: 3}
    5: {0: 0, 1: 1, 2: 2, 3: 3}
    6: {0: 0, 1: 1, 3: 2, 2: 3}
