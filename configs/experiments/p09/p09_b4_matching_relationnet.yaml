# P09 B4: Matching/RelationNet episodic baseline, GFS.
# Derives from demo configs/demo/03_fewshot/cwru_protonet.yaml.
# Registered task: FS.matching_network (task_registry.csv row 11). The legacy few-shot table
# also lists MAML and RelationNet; only Matching_Network is registered in the maintained
# task_registry.csv, so this config uses it as the relation/meta-learning family representative.
# MAML / RelationNet specifically are NOT registered -> those comparisons are
# `needs_new_component` (flagged in config_bridge.yaml and the G040 protocol blocker).
#
# Same GFS-aware-evaluation caveat as B3 (ProtoNet).

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_system_fewshot.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/fewshot.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p09_b4_matching_relationnet"
  seed: 42
  output_dir: "results/p09/b4_matching_relationnet"
  notes: "P09 baseline B4: Matching Network episodic few-shot (relation/meta family rep). GFS-aware eval pending G040."

model:
  name: "M_01_ISFM"
  type: "ISFM"
  embedding: "E_01_HSE"
  backbone: "B_04_Dlinear"
  task_head: "H_01_Linear_cla"
  input_dim: 1
  d_model: 256
  output_dim: 128
  use_prompt: false
  prompt_dim: 0

task:
  type: "FS"
  name: "matching_network"
  target_system_id: [1, 13, 6, 12, 19]
  n_way: 5
  k_shot: 5
  q_query: 15
  episodes_per_epoch: 100
  lr: 0.001
  optimizer: "adamw"
  weight_decay: 0.0001
  loss: "CE"
  metrics: ["acc", "f1", "precision", "recall"]

trainer:
  num_epochs: 1   # smoke default; real launch overrides
  gpus: 1
