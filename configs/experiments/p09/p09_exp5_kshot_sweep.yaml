# P09 Exp-5: K-shot sweep on HSE-Prompt (PROPOSED) under GFS.
# Derives from demo configs/demo/04_cross_system_fewshot/cross_system_tspn.yaml and the
# P08 sibling p08 few-shot grid approach.
# Sweep task.num_support in {1, 5, 10, 20} (k-shot) and report base/novel/harmonic/ECE/adapt-time.
# Supports CLAIM-P09-LEG-FEWSHOT-TABLE (GFS-reframed) and CLAIM-P09-C1 (RQ3 trade-off).
#
# NOTE: this is the GFS k-shot grid (base+novel), distinct from the legacy novel-only few-shot
# table. The legacy novel-only grid is intentionally NOT reproduced 1:1 because the charter
# requires the GFS harmonic-mean metric. The legacy 1/3/5/10-shot numbers are quarantined.
#
# Implementation: identical stack to p09_exp3_hse_prompt finetune stage; only the GFS sampler
# num_support changes. Run as single-stage from a pretrained checkpoint, or two-stage from
# scratch via p09_exp3 + --override.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_system_fewshot.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/cddg_fewshot.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p09_exp5_kshot_sweep"
  seed: 42
  output_dir: "results/p09/exp5_kshot_sweep"
  notes: "P09 Exp5: GFS k-shot sweep on HSE-Prompt. Sweep task.num_support via --override."

model:
  name: "M_02_ISFM_Prompt"
  type: "ISFM_Prompt"
  embedding: "HSE_prompt"
  backbone: "B_04_Dlinear"
  task_head: "H_01_Linear_cla"
  input_dim: 1
  d_model: 256
  output_dim: 128
  num_heads: 8
  num_layers: 4
  e_layers: 4
  d_ff: 512
  patch_size_L: 64
  patch_size_C: 1
  num_patches: 64
  use_prompt: true
  prompt_dim: 128
  fusion_type: "attention"
  system_prompt_dim: 64
  sample_prompt_dim: 32
  # checkpoint_path: "results/p09/exp3_hse_prompt/pretrain/<best>.ckpt"  # set at launch

task:
  type: "GFS"
  name: "classification"
  target_system_id: [1, 13, 6, 12, 19]
  target_domain_num: 1
  loss: "CE"
  metrics: ["acc", "f1", "precision", "recall"]
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.0001
  num_episodes: 100
  num_systems: 1
  num_domains: 1
  num_labels: 3
  num_support: 5       # swept: 1, 5, 10, 20 via --override task.num_support=<k>
  num_query: 15

trainer:
  num_epochs: 1   # smoke default; real launch overrides (legacy adapt used 50)
  gpus: 1
