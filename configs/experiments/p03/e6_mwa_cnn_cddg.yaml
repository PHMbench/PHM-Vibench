pipeline: Pipeline_01_default
base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_system.yaml
  task: configs/base/task/cddg.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml
environment:
  project: p03_e6_mwa_cnn_cddg
  seed: 42
  output_dir: results/p03/e6_mwa_cnn_cddg
  notes: 'P03 E6: MWA_CNN baseline, multi-system CDDG.'
model:
  type: X_model
  name: MWA_CNN
  in_channels: 2            # MWA_CNN reads args.in_channels (not input_dim); src/model_factory/X_model/MWA_CNN.py
  num_windows: 4
  kernel_size: 7
  # NOTE: MWA_CNN hardcodes .cuda() on its DWT layers -> GPU-only (accepted run);
  # CPU smoke will fail at module init. This matches the bridge GPU-only policy.
task:
  type: CDDG
  name: classification
  target_system_id:
  - 1
  target_domain_num: 1
  lr: 0.001
  weight_decay: 0.0001
data:
  data_dir: /home/user/data/PHMbenchdata/PHM-Vibench
  metadata_file: metadata.xlsx
  window_size: 4096
  stride: 5
  num_window: 64
  batch_size: 64
  num_workers: 8
  normalization: standardization
  split:
    strategy: grouped_metadata
    group_key: Domain_id       # leakage-safe: keeps each operating-condition domain whole across train/val (metadata.xlsx has Domain_id; Bearing_id is absent; File is per-row unique -> not a real group)
    seed: 42
    test_policy: task_defined
    fractions:
      train: 0.9
      val: 0.1
    manifest_path: results/p03/e6_mwa_cnn_cddg/splits/manifest_seed42.json
trainer:
  num_epochs: 1
  gpus: 1
  paper_id: P03
  preset_version: p03-e6-v1
  extensions:
    report:
      manifest: true
