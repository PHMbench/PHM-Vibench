# P04 - Baseline comparator: X_model.TSPN_UXFD in-domain (CWRU / XJTU / THU_006).
# ADDITIVE config under configs/experiments/p04/.
# Derives from configs/demo/01_cross_domain/cwru_dg.yaml (single-dataset DG base).
#
# Status: ready (X_model.TSPN_UXFD is registered in src/model_factory/model_registry.csv).
# Smoke-friendly default: trainer.num_epochs=1, device=cpu.
#
# Sweep policy: same as baseline_resnet1d_indomain.yaml (sweep target_system_id and seed).
# Supports: comparator side of CLAIM-C-GATE-98 (charter's "TSPN/NSN without operator routing").

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p04_baseline_tspnuxfd_indomain"
  seed: 42
  output_dir: "results/experiments/p04/baseline_tspnuxfd_indomain"
  notes: "P04 baseline comparator: X_model.TSPN_UXFD on CWRU/XJTU/THU_006."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8
  # Leakage-safe split (launch default). metadata.xlsx has no Bearing_id -> Domain_id.
  # For dummy-data wiring smoke, override: data.split.strategy=legacy_windows.
  split:
    strategy: grouped_metadata
    group_key: Domain_id
    test_policy: partition
    fractions: {train: 0.7, val: 0.15, test: 0.15}
    seed: 42
    manifest_path: results/experiments/p04/_split_manifest_tspnuxfd.csv

model:
  type: "X_model"
  name: "TSPN_UXFD"
  device: "cpu"             # smoke; raise to cuda for the full run
  in_dim: 128               # = data.window_size; raise to 2048 for CWRU/XJTU real windows
  out_dim: 128
  in_channels: 2
  out_channels: 4
  scale: 1
  skip_connection: true
  num_classes: 10           # auto-inferred from metadata if omitted; default for smoke
  signal_processing_configs:
    layer1: ["I"]
  feature_extractor_configs: ["Mean", "Std"]
  # UXFD assembly toggles (disabled; comparator side = "TSPN/NSN without operator routing").
  uxfd:
    enable_sp2d: false
    fusion:
      type: "concat"
    fuzzy:
      enable: false
      logit_scale: 1.0
    operatorAttention:
      enable: false
    logic:
      enable: false

task:
  # partition test_policy REQUIRES Default_task.
  type: Default_task
  name: Default_task
  loss: CE
  metrics: [acc, f1_macro]
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  epochs: 10
  target_system_id: [1]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
