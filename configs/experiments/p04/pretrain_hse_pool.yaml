# P04 - HSE pretrain pool (registry-clean; reusable for a future MoE+pretrain ablation).
# ADDITIVE config under configs/experiments/p04/.
# Derives from configs/demo/05_pretrain_fewshot/pretrain_hse_then_fewshot.yaml.
#
# STATUS: ready for the pretrain backbone stage (registry has E_01_HSE / B_04_Dlinear).
# Downstream MoE finetune stage still needs_new_component.
#
# Leakage control: the pool excludes the eventual downstream target system. Override
# task.target_system_id to the held-out target before launching the finetune stage.
#
# Supports: future "MoE + pretrain vs scratch" ablation (no current claim).

pipeline: "Pipeline_02_pretrain_fewshot"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_classification.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/pretrain.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p04_pretrain_hse_pool"
  seed: 42
  output_dir: "results/experiments/p04/pretrain_hse_pool"
  notes: "P04 HSE contrastive pretrain pool (registry-clean); excludes the downstream target."

model:
  # Registry-addressed subcomponents (ISFM family).
  type: "ISFM"
  name: "M_01_ISFM"
  embedding: "E_01_HSE"
  backbone: "B_04_Dlinear"
  task_head: "H_01_Linear_cla"
  input_dim: 2
  d_model: 256
  output_dim: 128
  patch_size_L: 128
  patch_size_C: 1
  num_patches: 32

task:
  type: "pretrain"
  name: "hse_contrastive"
  target_system_id: [1, 13, 6, 12, 19]   # pool; downstream target must be excluded
  target_domain_num: 1

trainer:
  num_epochs: 1     # smoke; raise to ~20 for the real pretrain run
  device: "cpu"
  gpus: 1
