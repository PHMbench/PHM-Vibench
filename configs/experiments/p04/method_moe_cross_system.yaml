# P04 - CROSS-SYSTEM CDDG arm (placeholder): train CWRU, test XJTU/FEMTO/IMS.
# ADDITIVE config under configs/experiments/p04/.
# Derives from configs/demo/02_cross_system/multi_system_cddg.yaml.
#
# STATUS: needs_new_component (MoE family not registered).
# Data side is ready: Dataset_ids 1=CWRU, 2=XJTU, 3=FEMTO, 4=IMS all present in
# data/metadata.xlsx.
#
# Phase-2 sweep:
#   for tgt in {2=XJTU, 3=FEMTO, 4=IMS}; for seed in {42,123,456}:
#     python main.py --config configs/experiments/p04/method_moe_cross_system.yaml \
#       --override task.target_system_id=[<tgt>] --override environment.seed=<seed> \
#       --override trainer.num_epochs=<full> --override trainer.device=cuda \
#       --override data.data_dir=/home/user/data/PHMbenchdata/PHM-Vibench \
#       --override data.split.test_policy=task_defined
#
# Leakage: source-only normalization; target system held out from training pool.
# Supports: charter §experiment5 (cross-domain routing transfer).

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_system.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/cddg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p04_method_moe_cross_system"
  seed: 42
  output_dir: "results/experiments/p04/method_moe_cross_system"
  notes: "P04 cross-system CDDG (PLACEHOLDER): CWRU -> {XJTU,FEMTO,IMS}. needs_new_component."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

model:
  # --- BEGIN needs_new_component block ---
  type: "MoE"
  name: "M_05_NNSPNMoE"
  num_classes: 10
  feature_dim: 64
  num_experts: 5
  use_load_balance: true
  use_sparsity: true
  routing_temperature: 1.0
  dropout_rate: 0.1
  # --- END needs_new_component block ---

task:
  target_system_id: [2]       # default target = XJTU; sweep [2]/[3]/[4]
  # test_policy=task_defined preserves the target system as the held-out test set;
  # source-system groups (everything else) go to train/val.

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
