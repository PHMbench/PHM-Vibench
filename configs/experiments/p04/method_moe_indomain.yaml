# P04 - METHOD arm (placeholder): PhysicsConstrainedMoE / NNSPNMoE in-domain.
# ADDITIVE config under configs/experiments/p04/.
# Derives from configs/demo/01_cross_domain/cwru_dg.yaml.
#
# STATUS: needs_new_component.
# The MoE model family (NNSPNMoE + LowPassExpert / HarmonicExpert / EnvelopeExpert +
# StatisticalRouter) is NOT registered in src/model_factory/model_registry.csv.
# It currently lives only in the read-only P04 legacy source snapshot:
#   legacy/source_snapshot/code/{moe_model.py, experts/, router/}
# Phase-2 must port it into src/model_factory/MoE/ and add a MoE row to
# model_registry.csv before this config can run. The block below uses the
# provisional id M_05_NNSPNMoE so a registry change is the only delta needed.
#
# Smoke-friendly default: trainer.num_epochs=1, device=cpu.
#
# Sweep policy:
#   for ds in {1=CWRU, 2=XJTU, 6=THU_006}; for seed in {42,123,456,789,1024}:
#     python main.py --config configs/experiments/p04/method_moe_indomain.yaml \
#       --override task.target_system_id=[<ds>] --override environment.seed=<seed> \
#       --override trainer.num_epochs=<full> --override trainer.device=cuda \
#       --override data.data_dir=/home/user/data/PHMbenchdata/PHM-Vibench \
#       --override data.split.strategy=grouped_metadata --override data.split.group_key=Bearing_id \
#       --override data.split.test_policy=partition
#
# Supports: CLAIM-C-GATE-98, CLAIM-N-DATASETS, CLAIM-C-BRIDGE-{CWRU,XJTU}.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p04_method_moe_indomain"
  seed: 42
  output_dir: "results/experiments/p04/method_moe_indomain"
  notes: "P04 method arm (PLACEHOLDER): NNSPNMoE on CWRU/XJTU/THU_006. needs_new_component."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

model:
  # --- BEGIN needs_new_component block ---
  # Provisional registry id. Will resolve once src/model_factory/MoE/ is added and
  # model_registry.csv gains a row: MoE,M_05_NNSPNMoE,src/model_factory/MoE/M_05_NNSPNMoE.py,...
  type: "MoE"
  name: "M_05_NNSPNMoE"
  num_classes: 10
  feature_dim: 64
  num_experts: 5
  use_load_balance: true
  use_sparsity: true
  routing_temperature: 1.0
  dropout_rate: 0.1
  # --- END needs_new_component block ---

task:
  target_system_id: [1]       # CWRU default; sweep [1]/[2]/[6]
  source_domain_id: [0, 1, 2]
  target_domain_id: [3]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
