# P04 - ABLATION arm (placeholder): expert-count sweep 3/5/8 on CWRU + XJTU.
# ADDITIVE config under configs/experiments/p04/.
# Derives from configs/demo/01_cross_domain/cwru_dg.yaml.
#
# STATUS: needs_new_component (same blocker as method_moe_indomain.yaml).
# Phase-2 sweep:
#   for n in {3,5,8}; for ds in {1=CWRU, 2=XJTU}; for seed in {42,123,456}:
#     python main.py --config configs/experiments/p04/method_moe_ablation.yaml \
#       --override model.num_experts=<n> --override task.target_system_id=[<ds>] \
#       --override environment.seed=<seed> --override trainer.num_epochs=<full> \
#       --override trainer.device=cuda \
#       --override data.data_dir=/home/user/data/PHMbenchdata/PHM-Vibench
#
# Supports: CLAIM-C-ABLATE-{3,5,8}, CLAIM-C-ABLATE-PARAMS-{3,5,8},
#           CLAIM-C-ABLATE-ENT-{3,5,8}, CLAIM-N-EXPERTS.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p04_method_moe_ablation"
  seed: 42
  output_dir: "results/experiments/p04/method_moe_ablation"
  notes: "P04 expert-count ablation (PLACEHOLDER): 3/5/8 experts on CWRU + XJTU. needs_new_component."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

model:
  # --- BEGIN needs_new_component block ---
  type: "MoE"
  name: "M_05_NNSPNMoE"
  num_classes: 10
  feature_dim: 64
  num_experts: 3              # sweep {3,5,8}
  use_load_balance: true
  use_sparsity: true
  routing_temperature: 1.0
  dropout_rate: 0.1
  # --- END needs_new_component block ---

task:
  target_system_id: [1]       # CWRU default; add [2] for XJTU
  source_domain_id: [0, 1, 2]
  target_domain_id: [3]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
