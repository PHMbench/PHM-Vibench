# P08 Exp-6: Backbone universality sweep (HSE-Prompt on CDDG, single-stage finetune).
# Derives from legacy configs/CDDG_config/experiment_6_cddg_backbone.yaml.
# Sweep over registered backbones B_04_Dlinear / B_06_TimesNet / B_08_PatchTST / B_09_FNO.
# At launch pick one backbone via --override model.backbone=<id> (+ its hyperparams if needed).

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_system.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/cddg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "p08_exp6_backbone_sweep"
  seed: 42
  output_dir: "results/p08/exp6_backbone_sweep"
  notes: "P08 Exp6: HSE-Prompt backbone universality under CDDG. Sweep backbones via --override."

model:
  name: "M_02_ISFM_Prompt"
  type: "ISFM_Prompt"
  embedding: "HSE_prompt"
  backbone: "B_04_Dlinear"   # default; sweep {B_04_Dlinear, B_06_TimesNet, B_08_PatchTST, B_09_FNO}
  task_head: "H_01_Linear_cla"
  input_dim: 1
  d_model: 256
  output_dim: 128
  num_heads: 8
  num_layers: 4
  e_layers: 4
  d_ff: 512
  patch_size_L: 64
  patch_size_C: 1
  num_patches: 64
  use_prompt: true
  prompt_dim: 128
  fusion_type: "attention"
  system_prompt_dim: 64
  sample_prompt_dim: 32

task:
  type: "CDDG"
  name: "classification"
  target_system_id: [1, 13, 6, 12, 19]
  target_domain_num: 1
  loss: "CE"
  metrics: ["acc", "f1", "precision", "recall"]
  optimizer: "adamw"
  lr: 0.0005
  weight_decay: 0.0001

trainer:
  num_epochs: 1   # smoke default; real launch overrides (legacy used 30)
  gpus: 1
