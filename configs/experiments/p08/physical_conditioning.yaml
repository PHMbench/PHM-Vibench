# Research entrypoint: phmfactory research <phase> --config <this file>.
# Machine-local paths are explicit --local-config overrides. No dataset is downloaded.
pipeline: Pipeline_01_Fault_Diagnosis
environment:
  project: p08_target_excluded_physical_conditioning
  seed: 42
  iterations: 1
  output_dir: results/p08
  notes: Industrial evidence remains unexecuted; software tests use declared tensor fixtures.
data:
  data_dir: data/p08
  metadata_file: qualified_records.csv
  record_inventory: data/p08/qualified_records.csv
  ontology_file: data/p08/ontology.csv
  qualification_file: data/p08/qualification.csv
  evidence_kind: industrial
  continuous_fields: [speed_rpm, load_nm]
  categorical_fields: []
  # Fields and units require source documentation and deployment qualification.
  # These names are an executable interface, not an assertion that every dataset has them.
  window_points: 2048
  stride_points: 2048
  normalization: per_window_standardize
  validation_fraction: 0.25
  batch_size: 16
  num_workers: 0
model:
  type: ISFM
  name: M_P08_PhysicalConditioning
  embedding: E_01_HSE
  backbone: TransformerEncoderLayer
  task_head: SharedLinear
  output_dim: 32
  nhead: 4
  num_classes: 3
  condition_dim: null  # Resolved once from source-fitted typed fields, then recorded.
  patch_size_L: 64
  num_patches: 8
  coordinates: physical
  fusion: film
task:
  type: DG
  name: p08_physical
  execution: research
  loss: CE
  systems: ['1', '13', '6', '12', '19']
  seeds: [42, 123, 456, 789, 999]
  split_seed: 42
  tuning_seed: 42
  bootstrap_replicates: 1000
  arms: [B1, C_ONLY, LATE, TOKEN, P0]
  comparison: tuned
  search_learning_rates: [0.0003, 0.001, 0.003]
  search_weight_decays: [0.0, 0.0001]
  selection_metric: source_system_unit_balanced_record_brier
  target_metric: record_macro_f1
  practical_margin: null
  # Estimation-only: no automatic superiority decision or universal effect threshold.
trainer:
  name: p08_source_only
  num_epochs: 40
  updates_per_epoch: 40
  batch_size: 16
  device: cuda
  devices: 1
  test_after_fit: true
  monitor: source_brier
  monitor_mode: min
