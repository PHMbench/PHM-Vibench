# Template only: edit physical bounds, columns, label count, domains and paths.
# Uses native reader output; set data.layout and squeeze_axes explicitly.
engine: phmfactory
seeds:
- 42
- 123
- 456
model:
  type: X_model
  name: P01OperatorBias
  num_classes: 3
  in_channels: 1
  binding: physical
  head: additive
  paths:
  - raw
  - periodic
  - envelope
  - stft
  reference_speed_hz: 10.0
  order_centers:
  - 3.0
  - 5.0
  - 7.0
  order_widths:
  - 0.3
  - 0.3
  - 0.3
  order_center_bounds:
  - 1.5
  - 8.0
  order_width_bounds:
  - 0.05
  - 0.4
  carrier_centers_hz:
  - 320.0
  carrier_widths_hz:
  - 35.0
  carrier_center_bounds_hz:
  - 260.0
  - 380.0
  carrier_width_bounds_hz:
  - 10.0
  - 40.0
  n_fft: 128
  hop_length: 32
  reference_width: 16
  hidden_dim: 32
  fs_field: sample_rate_hz
  rpm_field: rotation_speed_rpm
  tspn:
    in_dim: 1024
    out_dim: 1024
    out_channels: 12
    scale: 1
    skip_connection: false
    internal_instance_normalization: false
    signal_processing_configs:
      layer1:
      - I
      - HT
      - WF
    feature_extractor_configs:
    - RMS
    - Std
    - AbsMean
    f_c_mu: 0.15
    f_c_sigma: 0.03
    f_b_mu: 0.04
    f_b_sigma: 0.005
data:
  array_key: x
  layout: LC
  squeeze_axes: []
  window_size: 1024
  windows_per_unit: 2
training:
  epochs: 30
  steps_per_epoch: 100
  lr: 0.001
  cpu_threads: 1
  cov_weight: 0.1
  keep_weight: 0.1
  replay_weight: 1.0
  der_weight: 0.5
  dg_weight: 1.0
  dro_eta: 0.01
  shift_samples: 32
continual:
  memory_units: 24
offline_arms:
- S1_additive
- S2_physical
- S3_augmented
- S4_covariance
- N_wrong_physics
- N_global_alignment
- raw_cnn
- stft_cnn
- vrex
- groupdro
continual_arms:
- FT
- ER
- DERPP
- TOTAL_MARGIN
- PATH_SYMMETRIC
- OURS
- N_WRONG_PATH
datasets:
- name: D1_REPLACE_WITH_ACTUAL_DATASET
  format: phmfactory_reader
  data_dir: /REPLACE/ACTUAL/DATA_ROOT
  metadata_file: /REPLACE/ACTUAL/P01_METADATA.csv
  columns:
    file: File
    reader: Name
    unit_id: unit_id
    label: Label
    domain: Domain_id
    split: split
    sample_rate_hz: sample_rate_hz
    rotation_speed_rpm: rotation_speed_rpm
  source_domains:
  - SOURCE_DOMAIN_1
  - SOURCE_DOMAIN_2
  domain_sequence:
  - NEW_DOMAIN_1
  - NEW_DOMAIN_2
  reader_args: {}
