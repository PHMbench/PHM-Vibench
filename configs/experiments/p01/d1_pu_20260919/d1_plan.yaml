analysis_definition:
  inputs: frozen window-level prediction artifacts only
  metrics: [brier, ce, accuracy, macro_f1]
  risk_aggregation:
    hierarchy: [window, acquisition, global_physical_group, condition]
    within_acquisition: arithmetic mean of window Brier or CE
    within_group: equal-weight mean of acquisition risks
    within_condition: equal-weight mean of global physical-group risks
    across_conditions: equal-weight mean of condition-specific metrics
  classification:
    prediction: argmax of acquisition mean window probabilities
    confusion: equal total weight per global physical group within each condition
    accuracy_and_macro_f1: computed from each condition's group-balanced confusion matrix
    class_space: all three frozen classes; report represented classes and support
    group_f1_averaging: false
  condition_sets:
    source: ['0', '2', '3']
    unseen: ['1']
  primary_contrasts:
    risk: group-balanced window Brier
    Delta_pipe: R(O) - R(MLP16)
    Delta_loss: R(RC) - R(O)
    Delta_prior: R(RO) - R(UO)
    Delta_response: R(RC) - R(RO)
    Delta_adoption: R(adopted predictor) - R(selected direct candidate)
    Delta_adoption_vs_raw: R(adopted predictor) - R(p0)
  bootstrap:
    repeats: 2000
    seed: 20260919
    cluster: global physical group
    strata: prespecified condition-incidence mask; preserve each stratum size
    paired: same global-group multiplicity across conditions, predictors, and training seeds
    interval: 95% descriptive percentile interval
    interpretation: conditional on frozen predictors; no significance stars or new multiplicity rule
  training_seeds:
    values: [42, 123, 456]
    summary: finite three-seed arithmetic mean and sample standard deviation
    standard_deviation_ddof: 1
    independent_physical_samples: false
  adoption_interpretation: conditional on the already selected candidate and fixed coefficient
  source_diagnostics: seed42 source-validation only; excluded from the assessment bank and permanent test
