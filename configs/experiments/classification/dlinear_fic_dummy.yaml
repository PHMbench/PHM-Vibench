# CPU-only FIC gradient-constraint contract paired with the maintained DG base.
# Validation or inspection success is not a benchmark or paper result.
pipeline: "Pipeline_01_Fault_Diagnosis"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_dlinear.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "experiment_dlinear_fic_dummy"
  seed: 42
  iterations: 1
  output_dir: "results/experiments/dlinear_fic_dummy"
  notes: "CPU configuration contract only; controlled grouped comparison evidence is pending."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]
  loss: "CE"
  gradient_constraint:
    name: "fic"
    epsilon: 2.0

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
