# Offline experimental contract for the clean-room TSL-style classifier.
pipeline: Pipeline_01_default

base_configs:
  environment: configs/base/environment/base.yaml
  data: configs/base/data/base_cross_domain.yaml
  task: configs/base/task/dg.yaml
  trainer: configs/base/trainer/default_single_gpu.yaml

environment:
  project: experiment_tsl_transformer_dummy
  seed: 42
  iterations: 5
  output_dir: results/experiments/tsl_transformer_dummy
  notes: Dummy-data contract run only; no paper benchmark claim.

data:
  data_dir: data
  metadata_file: metadata_dummy.csv
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

model:
  type: Transformer
  name: TSLTransformer
  input_dim: 2
  seq_len: 128
  patch_size: 16
  d_model: 64
  n_heads: 4
  num_layers: 2
  d_ff: 128
  lstm_hidden_dim: 64
  dropout: 0.1

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  device: cpu
  gpus: 1
