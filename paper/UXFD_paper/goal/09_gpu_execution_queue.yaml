    goal_file: "paper/UXFD_paper/goal/04_moe_explainable.md"
    matrix_path: "paper/UXFD_paper/MOE_explainable/submission_prep/baseline_ablation_matrix.yaml"
    base_config: "paper/UXFD_paper/MOE_explainable/configs/vibench/min.yaml"
    required_phases: ["proposed", "baselines", "ablations", "top_representatives"]
