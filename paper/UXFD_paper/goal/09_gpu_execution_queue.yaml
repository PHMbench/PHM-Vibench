    status: "pending_gpu_and_artifacts"
    exact_reproduction_status: "not exact; representative only until external code/config is integrated"
    artifact_requirement: "LLM evidence package with segment-grounded prompt/report metrics, hallucination checks, latency sweep, run_meta.yaml, and metrics.json"

paper_queue:
  - queue_id: "Q1"
    paper_id: "TII_operator_attention"
    priority_reason: "Paper 07 was previously rejected and has the most urgent rejection-recovery/SOTA gate."
    goal_file: "paper/UXFD_paper/goal/07_tii_operator_attention.md"
    matrix_path: "paper/UXFD_paper/TII_operator_attention/submission_prep/baseline_ablation_matrix.yaml"
    base_config: "paper/UXFD_paper/TII_operator_attention/configs/vibench/min.yaml"
    required_phases: ["proposed", "baselines", "ablations", "top_representatives"]
    minimum_seeds: 3
    device_binding: "CUDA_VISIBLE_DEVICES=0 or CUDA_VISIBLE_DEVICES=1"
    unblock_condition: "industrial same-protocol baseline, ablation, TOP representative, and GPU metadata artifacts accepted"
  - queue_id: "Q2"
    paper_id: "1D-2D_fusion_explainable"
    priority_reason: "Fusion evidence and TeX blocker are high-impact for reviewer credibility."
    goal_file: "paper/UXFD_paper/goal/02_1d2d_fusion.md"
    matrix_path: "paper/UXFD_paper/1D-2D_fusion_explainable/submission_prep/baseline_ablation_matrix.yaml"
    base_config: "paper/UXFD_paper/1D-2D_fusion_explainable/configs/vibench/min.yaml"
    required_phases: ["proposed", "baselines", "ablations", "top_representatives"]
    minimum_seeds: 3
    device_binding: "CUDA_VISIBLE_DEVICES=0 or CUDA_VISIBLE_DEVICES=1"
    unblock_condition: "same-protocol CWRU/XJTU fusion matrix, true branch ablations, TOP proxies, and GPU metadata accepted"
  - queue_id: "Q3"
    paper_id: "Explainable_FD_Toolkit"
    priority_reason: "Toolkit schema/report artifacts support several downstream papers."
    goal_file: "paper/UXFD_paper/goal/01_explainable_fd_toolkit.md"
    matrix_path: "paper/UXFD_paper/Explainable_FD_Toolkit/submission_prep/baseline_ablation_matrix.yaml"
    base_config: "paper/UXFD_paper/Explainable_FD_Toolkit/configs/vibench/min.yaml"
    required_phases: ["proposed", "baselines", "ablations", "top_representatives"]
    minimum_seeds: 3
