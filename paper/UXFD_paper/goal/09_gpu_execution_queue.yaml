status_date: "2026-05-11"
status: "blocked_resource_preflight"
purpose: >
  Machine-readable execution queue for turning the seven paper-local
  baseline_ablation_matrix.yaml files into accepted 2x4090 experiment evidence.
  This file is a scheduler contract, not completed evidence.

resource_preflight:
  required_devices: ["0", "1"]
  required_gpu_class: "RTX 4090"
  current_session_result:
    nvidia_smi: "failed: NVIDIA-SMI could not communicate with the NVIDIA driver"
    torch_cuda_available: false
    torch_cuda_device_count: 0
    gpu_names: []
    verdict: "blocked; no accepted GPU evidence can be generated in this session"
  required_commands:
    - id: "PREFLIGHT-NVIDIA-SMI"
      command: "nvidia-smi -L"
      accept_if: "lists the intended local GPUs 0 and 1 as RTX 4090-class devices"
    - id: "PREFLIGHT-TORCH-CUDA"
      command: "python -c \"import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() == 2; names=[torch.cuda.get_device_name(i) for i in range(2)]; assert all('RTX 4090' in name for name in names), names; print(names[0]); print(names[1])\""
      accept_if: "assertions pass and print the two local RTX 4090 device names"
    - id: "PREFLIGHT-PAPER-SMOKE"
      command_template: "CUDA_VISIBLE_DEVICES={device} python main.py --config {base_config} --override trainer.num_epochs=1 --override data.num_workers=0"
      accept_if: "one paper-local min config runs and records GPU model, runtime, seed, batch size, precision, and artifact paths"

scheduler:
  default_binding: "one GPU per run"
  default_devices: ["0", "1"]
  max_concurrent_single_gpu_jobs: 2
  multi_gpu_rule: "use CUDA_VISIBLE_DEVICES=0,1 only with an explicit reason recorded in run_meta.yaml"
  stop_rules:
    - "Stop before Q1 if resource_preflight is not accepted."
    - "Stop a paper queue item if any accepted run lacks required metadata."
    - "Stop SOTA wording if any declared baseline or TOP representative is missing same-protocol evidence."

accepted_run_metadata_required:
  - "CUDA_VISIBLE_DEVICES"
  - "GPU model"
  - "GPU count"
  - "seed"
  - "dataset split"
  - "preprocessing signature"
  - "batch size"
  - "precision"
  - "runtime"
  - "command"
  - "git SHA or submodule SHA"
  - "source tree status"
  - "config path"
  - "log path"
  - "metrics path"
  - "OOM or failure reason if any"

accepted_artifact_contract:
  run_meta: "run_meta.yaml"
  metrics: "metrics.json or metrics.csv with at least one numeric metric"
  numeric_metrics_required: true
  run_controls: "seed must be a non-negative integer; batch size must be a positive integer"
  sha_provenance: "git_sha_or_submodule_sha must be a concrete clean revision without dirty, modified, unknown, or uncommitted markers"
  logs: "stdout/stderr or trainer log"
  result_table: "paper-local accepted table source"
  failure_record: "required for OOM, dependency, data, or resource-blocked runs"
  sota_input: "only accepted same-protocol artifacts may enter SOTA comparison"

top_representative_bindings:
  - binding_id: "TOP-Q1-GTM"
    paper_id: "TII_operator_attention"
    external_work_id: "RWTOP2026-GTM"
    external_role: "frequency-domain attention and general time-series representation comparator"
    local_proxy_matrix_entries: ["B04", "B05", "A04"]
    command_source: "paper-local baseline_ablation_matrix.yaml entries B04/B05/A04"
    status: "pending_gpu_and_artifacts"
    exact_reproduction_status: "not exact; representative only until external code/config is integrated"
    artifact_requirement: "same-protocol TFN/WKN/FFT proxy logs with run_meta.yaml, metrics, operator/frequency metadata, and failure record if blocked"
  - binding_id: "TOP-Q2-GTM"
    paper_id: "1D-2D_fusion_explainable"
    external_work_id: "RWTOP2026-GTM"
    external_role: "frequency-attention representation comparator for 1D-2D features"
    local_proxy_matrix_entries: ["B04", "B05", "A06"]
    command_source: "paper-local baseline_ablation_matrix.yaml entries B04/B05/A06"
    status: "pending_gpu_and_artifacts"
    exact_reproduction_status: "not exact; representative only until external code/config is integrated"
