    goal_file: "paper/UXFD_paper/goal/05_fuzzy_xfd.md"
    matrix_path: "paper/UXFD_paper/Paper_fuzzy_XFD/submission_prep/baseline_ablation_matrix.yaml"
    base_config: "paper/UXFD_paper/Paper_fuzzy_XFD/configs/vibench/min.yaml"
    required_phases: ["proposed", "baselines", "ablations", "top_representatives"]
    minimum_seeds: 3
    device_binding: "CUDA_VISIBLE_DEVICES=0 or CUDA_VISIBLE_DEVICES=1"
    unblock_condition: "rule metrics, safety cases, fuzzy ablations, TOP proxies, and GPU metadata accepted"
  - queue_id: "Q6"
