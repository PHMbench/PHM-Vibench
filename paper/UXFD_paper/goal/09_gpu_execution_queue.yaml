    external_work_id: "RWTOP2026-TIMESEG"
    external_role: "segment-wise time-series explanation comparator"
    local_proxy_matrix_entries: ["P00", "A02", "A03", "A06"]
    command_source: "paper-local baseline_ablation_matrix.yaml entries P00/A02/A03/A06"
    status: "pending_gpu_and_artifacts"
    exact_reproduction_status: "not exact; representative only until external code/config is integrated"
