cross_paper_gate:
  queue_id: "Q8"
  status: "blocked_until_all_paper_queue_items_have_accepted_artifacts"
  sota_rule: "No SOTA wording is allowed unless proposed methods beat every declared baseline and runnable TOP representative under the same protocol."
  submission_rule: "No paper may become submission_ready: true until evidence, manuscript, compile, TOP, compute, ablation, and SOTA gates pass."
