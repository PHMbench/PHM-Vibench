# Base Configuration for LLM-Enhanced Fault Diagnosis Experiments

# Dataset Configuration
data:
  dataset_name: "THU_018"
  data_path: "/home/user/data/PHMbenchdata/PHM-Vibench/"
  sampling_rate: 1024
  segment_length: 4096
  normalization: "z_score"  # Options: "z_score", "min_max", "none"
  train_test_split: 0.2
  validation_split: 0.1
  random_seed: 42

# Model Configuration
model:
  signal_processing_layers:
    - "FFT"
    - "WF"
    - "HT"
    - "I"
  input_channels: 1
  output_channels: 1
  in_dim: 4096
  out_dim: 10
  scale: 4
  skip_connection: true
  num_classes: 10
  dropout: 0.1

# Training Configuration
training:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 100
  optimizer: "adam"
  scheduler: "cosine"
  early_stopping:
    patience: 10
    monitor: "val_loss"
  device: "cuda"  # Options: "cuda", "cpu"
  num_workers: 4
  save_best_only: true

# LLM Configuration - Enhanced with Domestic Models
llm:
  providers:
    # Primary: Domestic models (recommended)
    primary:
      type: "deepseek"
      model: "deepseek-chat"
      api_key_env: "DEEPSEEK_API_KEY"
      base_url: "https://api.deepseek.com"
      max_tokens: 1500
      temperature: 0.3
      description: "国产高性价比模型，中文优秀"

    # Alternative domestic model
    secondary:
      type: "glm"
      model: "glm-4"
      api_key_env: "GLM_API_KEY"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      max_tokens: 1500
      temperature: 0.3
      description: "智谱AI专业模型，技术理解强"

    # Fallback: Template-based (no API required)
    fallback:
      type: "template"
      description: "模板化备用方案，无需API密钥"

    # Traditional options (optional, for comparison)
    openai:
      type: "openai"
      model: "gpt-3.5-turbo"
      api_key_env: "OPENAI_API_KEY"
      max_tokens: 1000
      temperature: 0.7
      description: "OpenAI GPT模型"

    anthropic:
      type: "anthropic"
      model: "claude-3-sonnet-20240229"
      api_key_env: "ANTHROPIC_API_KEY"
      max_tokens: 1000
      temperature: 0.7
      description: "Anthropic Claude模型"

  # Domestic model advantages
  domestic_advantages:
    cost_effectiveness: "成本降低60-80%"
    data_security: "符合国内数据安全要求"
    chinese_understanding: "中文理解能力更优"
    service_stability: "国内网络访问更稳定"
    technical_support: "中文技术支持，响应更快"

  # Settings
  timeout: 30
  retry_attempts: 3
  cache_enabled: true
  cache_size: 100

  # Unified baseline integration
  unified_baseline:
    results_table: "../../doc/12_1/codex/unified_baseline_results_table_12_01_v2.md"
    model_outputs: ["TSPN", "Fusion1D2D", "MoE", "OperatorAttention"]
    explanation_source: "Explainable_FD_Toolkit"

# Knowledge Enhancement Configuration
knowledge:
  fault_knowledge_graph: true
  terminology_mapping: true
  context_processing: true
  custom_knowledge_path: null

# Evaluation Configuration
evaluation:
  metrics:
    - "accuracy"
    - "f1_score"
    - "precision"
    - "recall"
    - "auc_roc"
  explainability_metrics:
    - "understandability"
    - "technical_accuracy"
    - "completeness"
    - "response_time"
  user_study:
    enabled: false
    num_participants: 0
    test_cases_file: null

# Output Configuration
output:
  base_path: "./results"
  save_model: true
  save_explanations: true
  save_predictions: true
  save_logs: true
  visualization:
    signal_plots: true
    confusion_matrix: true
    explanation_analysis: true

# Experiment Configuration
experiment:
  name: "llm_enhanced_fault_diagnosis"
  description: "Testing LLM-enhanced explainability in fault diagnosis"
  repetitions: 3
  cross_validation_folds: 5
  gpu_memory_limit: "8GB"
  log_level: "INFO"

# Resource Limits
resources:
  max_gpu_memory: "8GB"
  max_cpu_cores: 8
  max_execution_time: 3600  # seconds
  disk_space_limit: "50GB"

# Quality Control
quality_control:
  statistical_significance: true
  effect_size_threshold: 0.8
  confidence_level: 0.95
  outlier_detection: true
  reproducibility_checks: true