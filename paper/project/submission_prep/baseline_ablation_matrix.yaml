status_date: "2026-05-11"
paper_id: "Paper_fuzzy_XFD"
scope: "Command-bound baseline and ablation matrix for Paper 05."
evidence_level: "config-target validated; reviewer-ablation smoke runner and manuscript checkpoint bound"
submission_ready: false
base_config: "paper/UXFD_paper/Paper_fuzzy_XFD/configs/vibench/min.yaml"
validation_note: >
  The commands below bind the Fuzzy-XFD comparison surface to concrete
  PHM-Vibench or paper-local entrypoints. They validate wiring only. They do
  not satisfy the strict IEEE gate because they have not been run on accepted
  CWRU/XJTU or industrial splits with multi-seed GPU metadata, confidence
  intervals, rule-level artifacts, TOP representative artifacts, or SOTA
  evidence. Reviewer-requested hard-threshold, safety-fallback, and
  no-rule-output ablations now have non-accepted smoke artifacts only. The
  manuscript evidence snapshot compiles after binding local fuzzy-rule figures,
  but it is not final IEEE TFS text.

common_policy:
  devices: "local RTX 4090 GPUs 0,1 only"
  default_binding: "CUDA_VISIBLE_DEVICES=0"
  scheduler: "one GPU per run; at most two concurrent single-GPU jobs"
  required_metadata:
    - "CUDA_VISIBLE_DEVICES"
    - "GPU model"
    - "seed"
    - "batch size"
    - "precision"
    - "runtime"
    - "dataset split"
    - "OOM or failure reason"

manuscript:
  entrypoint: "manuscript/final_tex/main.tex"
  compile_command: "pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/uxfd_paper05_tex manuscript/final_tex/main.tex"
  compile_status: "pass from the submodule root after binding local FuzzyLogic_explainable figure paths; output /tmp/uxfd_paper05_tex/main.pdf"
  evidence_status: "evidence-snapshot only; final IEEE TFS text, accepted rule metrics, safety cases, same-protocol results, TOP representative artifacts, and GPU metadata remain blocked"

