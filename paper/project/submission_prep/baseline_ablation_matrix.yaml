status_date: "2026-05-11"
paper_id: "Explainable_FD_Toolkit"
scope: "Command-bound baseline matrix and Toolkit ablation blocker map for Paper 01."
evidence_level: "baseline config-target validated; Toolkit ablation smoke and manuscript checkpoint bound"
submission_ready: false
base_config: "paper/UXFD_paper/Explainable_FD_Toolkit/configs/vibench/min.yaml"
validation_note: >
  The commands below validate Toolkit comparison entrypoints on dummy data only.
  They do not satisfy the IEEE Transactions gate because accepted CWRU/XJTU or
  industrial multi-seed artifacts, accepted Toolkit ablations, TOP
  representatives, and 2x4090 GPU metadata are still missing. A deterministic
  Toolkit ablation smoke runner exists for artifact-shape validation only and
  marks all outputs accepted_evidence=false. The canonical manuscript now
  compiles as an evidence checkpoint, but it is not final IEEE Transactions
  text.

common_policy:
  devices: "local RTX 4090 GPUs 0,1 only"
  default_binding: "CUDA_VISIBLE_DEVICES=0"
  scheduler: "one GPU per run; at most two concurrent single-GPU jobs"
  required_metadata:
    - "CUDA_VISIBLE_DEVICES"
    - "GPU model"
    - "seed"
    - "batch size"
    - "precision"
    - "runtime"
    - "dataset split"
    - "OOM or failure reason"

manuscript:
  entrypoint: "manuscript/final_tex/main.tex"
  compile_command: "pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/uxfd_paper01_tex manuscript/final_tex/main.tex"
  compile_status: "pass after two pdflatex runs from the submodule root; output /tmp/uxfd_paper01_tex/main.pdf"
  evidence_status: "evidence checkpoint only; accepted six-baseline matrix, same-protocol Toolkit ablations, TOP representative artifacts, GPU metadata, and SOTA remain blocked"

