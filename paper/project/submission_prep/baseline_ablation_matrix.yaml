  id: "P00"
  label: "PHM-Vibench NSN proxy with 1D-2D signal_processing_2d config"
  command: "CUDA_VISIBLE_DEVICES=0 python main.py --config paper/UXFD_paper/1D-2D_fusion_explainable/configs/vibench/min.yaml --override trainer.num_epochs=1 --override data.num_workers=0"
  config_target_validated: true
  dummy_smoke_status: "pass in LQ_signal on dummy data; CPU fallback because GPU/NVML unavailable"
  dummy_smoke_metric: "test_loss=1.1902445554733276, test_acc_Dummy_Data=0.0"
  accepted_evidence_status: "pending same-protocol CWRU/XJTU GPU run with real Fusion1D2D path"

