status_date: "2026-05-11"
paper_id: "LLM_Explainable_FD_Toolkit"
scope: "Command-bound PHM/LLM baseline and ablation blocker matrix for Paper 03."
evidence_level: "baseline config-target validated; LLM package import gate fixed; accepted evidence still blocked"
submission_ready: false
base_config: "paper/UXFD_paper/LLM_Explainable_FD_Toolkit/configs/vibench/min.yaml"
validation_note: >
  The commands below bind the LLM Explainable FD Toolkit comparison surface to
  concrete PHM-Vibench and paper-local entrypoints. They validate dummy-data
  wiring and a standalone template LLM demo only. They do not satisfy the
  strict IEEE gate because the generated run_meta/metrics files are smoke-only
  and accepted results/llm_evidence packages under the main protocol, real
  baseline/ablation protocols, TOP representatives, latency/hallucination
  metrics, GPU metadata, and evidence-bearing final manuscript claims are still
  missing. A conservative IEEE TeX entrypoint now exists at
  manuscript/ieee_tii/main.tex, but it is a compile checkpoint only.

common_policy:
  devices: "local RTX 4090 GPUs 0,1 only"
  default_binding: "CUDA_VISIBLE_DEVICES=0"
  scheduler: "one GPU per run; at most two concurrent single-GPU jobs"
  required_metadata:
    - "CUDA_VISIBLE_DEVICES"
    - "GPU model"
    - "seed"
    - "batch size or prompt batch size"
    - "precision or quantization"
    - "runtime"
    - "dataset split or prompt set"
    - "OOM or failure reason"

proposed:
  id: "P00"
  label: "PHM-Vibench NSN smoke with agent/distillation extension enabled"
  command: "CUDA_VISIBLE_DEVICES=0 python main.py --config paper/UXFD_paper/LLM_Explainable_FD_Toolkit/configs/vibench/min.yaml --override trainer.num_epochs=1 --override data.num_workers=0"
  config_target_validated: true
  dummy_smoke_status: "pass in LQ_signal on dummy data; CPU fallback because GPU/NVML unavailable"
  dummy_smoke_metric: "test_loss=0.7205665111541748, test_acc_Dummy_Data=0.0"
  accepted_evidence_status: "pending results/llm_evidence run_meta.yaml and metrics.json under the main protocol"

