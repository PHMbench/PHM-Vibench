status_date: "2026-05-11"
paper_id: "MOE_explainable"
scope: "Command-bound baseline matrix and ablation blocker map for Paper 04."
evidence_level: "baseline config-target validated; MoE ablation smoke runner bound"
submission_ready: false
base_config: "paper/UXFD_paper/MOE_explainable/configs/vibench/min.yaml"
validation_note: >
  The PHM-Vibench commands below validate the local comparison surface on dummy
  data only. They do not yet satisfy the strict IEEE gate because accepted
  CWRU/XJTU or industrial multi-seed artifacts, 2x4090 GPU metadata, TOP
  representative runs, and accepted MoE ablation evidence are still missing.

common_policy:
  devices: "local RTX 4090 GPUs 0,1 only"
  default_binding: "CUDA_VISIBLE_DEVICES=0"
  scheduler: "one GPU per run; at most two concurrent single-GPU jobs"
  required_metadata:
    - "CUDA_VISIBLE_DEVICES"
    - "GPU model"
    - "seed"
    - "batch size"
    - "precision"
    - "runtime"
    - "dataset split"
    - "OOM or failure reason"

