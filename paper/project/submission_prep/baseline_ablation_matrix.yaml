status_date: "2026-05-11"
paper_id: "Neuralsymbolic_theory"
scope: "Command-bound baseline, proposition, source-backed mapping, and ablation matrix for Paper 06."
evidence_level: "baseline config-target validated; proposition evidence partial; source-backed mapping and manuscript checkpoint bound"
submission_ready: false
base_config: "paper/UXFD_paper/Neuralsymbolic_theory/configs/vibench/min.yaml"
validation_note: >
  The commands below bind the Neural-Symbolic Theory comparison surface to
  concrete PHM-Vibench or paper-local entrypoints. They validate wiring and
  preliminary synthetic proposition hooks only. They do not satisfy the strict
  IEEE Transactions gate because accepted CWRU/XJTU multi-seed artifacts,
  full 2x4090 GPU metadata, TOP representative runs, accepted mapping-impact
  evidence, and final accepted result tables are still missing.

common_policy:
  devices: "local RTX 4090 GPUs 0,1 only"
  default_binding: "CUDA_VISIBLE_DEVICES=0"
  scheduler: "one GPU per run; at most two concurrent single-GPU jobs"
  required_metadata:
    - "CUDA_VISIBLE_DEVICES"
    - "GPU model"
    - "seed"
    - "batch size"
    - "precision"
    - "runtime"
    - "dataset split"
    - "OOM or failure reason"

manuscript:
  entrypoint: "manuscript/final_tex/main.tex"
  compile_command: "pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/uxfd_paper06_tex manuscript/final_tex/main.tex"
  compile_status: "pass after two pdflatex runs from the submodule root; output /tmp/uxfd_paper06_tex/main.pdf"
  evidence_status: "evidence-bound IEEEtran checkpoint; no placeholder title/body and no missing example figure reference; not final submission-ready text until accepted result artifacts exist"

proposed:
  id: "P00"
  label: "Constrained NSN/TSPN_UXFD logic-slot neural-symbolic model"
  command: "CUDA_VISIBLE_DEVICES=0 python main.py --config paper/UXFD_paper/Neuralsymbolic_theory/configs/vibench/min.yaml --override trainer.num_epochs=1 --override data.num_workers=0"
  config_target_validated: true
  dummy_smoke_status: "pass in LQ_signal on dummy data; CPU fallback because GPU/NVML unavailable"
  dummy_smoke_metric: "test_loss=0.7431894540786743, test_acc_Dummy_Data=0.0"
  accepted_evidence_status: "pending same-protocol CWRU/XJTU GPU run"

proposition_evidence:
  - id: "P1"
    label: "symbolic constraints improve reliability"
    command: "python simple_validation_demo.py"
    artifact: "results/theory_validation/validation_summary.json"
    current_result: "proposition_1_verified=true; reliability improvement=4.11% in synthetic demo"
    accepted_evidence_status: "demo only; pending CWRU/XJTU constrained-vs-unconstrained multi-seed table"
  - id: "P2A"
    label: "physical homomorphism robustness boundary case"
    command: "python simple_validation_demo.py"
    artifact: "results/theory_validation/validation_summary.json"
    current_result: "proposition_2_verified=false; drop_rate_physics=0.1455 > drop_rate_standard=0.0805"
    accepted_evidence_status: "boundary/failure hook under submission_prep/p2_evidence_contract.md; blocked for final P2 support until accepted real-data robustness protocol exists"
  - id: "P2B"
    label: "physical-informed robustness synthetic tracked hook"
    command: "python experiments/proposition2_simple.py"
    artifact: "experiments/results/proposition2_12_14/simple_results.json"
    current_result: "standard sensitivity=0.06666670242945344; physics sensitivity=0.041666626930236816; synthetic improvement=37.50009313220741%"
    accepted_evidence_status: "scope-limited synthetic positive hook only; does not override P2A failure or satisfy final robustness gate"
  - id: "P3"
    label: "interpretability-performance Pareto boundary"
    command: "python simple_validation_demo.py"
    artifact: "results/theory_validation/validation_summary.json"
    current_result: "proposition_3_verified=true in synthetic demo"
    accepted_evidence_status: "demo only; pending same-protocol six-baseline Pareto-front calculation"
  - id: "MAP"
    label: "cross-paper neural-symbolic mapping"
    command: "python code/validate_mapping.py"
    artifact: "report/mapping_validation_report.json"
    current_result: "average mapping score=0.83; weakest layer=symbolic 0.76"
    accepted_evidence_status: "scripted mapping hook paired with source-backed sibling-submodule report; pending accepted train/eval impact artifacts"
  - id: "MAP-SRC"
    label: "source-backed cross-paper neural-symbolic mapping"
    command: "python scripts/build_source_backed_mapping.py --output-json report/source_backed_mapping_report.json --output-md report/source_backed_mapping_report.md"
    artifact: "report/source_backed_mapping_report.json"
    current_result: "source_backed=true for six sibling papers; accepted_evidence=false"
    accepted_evidence_status: "source-introspection evidence only; pending same-protocol train/eval impact, TOP representative artifacts, and 2x4090 metadata"
  - id: "MAP-ABL"
    label: "cross-method mapping ablation smoke"
    command: "CUDA_VISIBLE_DEVICES=0 python paper/UXFD_paper/Neuralsymbolic_theory/scripts/run_mapping_ablation_smoke.py --condition no_mapping --output /tmp/uxfd_paper06_mapping_ablation_smoke --seed 0"
    artifact: "scripts/run_mapping_ablation_smoke.py"
    current_result: "non-accepted smoke runner emits run_meta.yaml and metrics.json with accepted_evidence=false"
    accepted_evidence_status: "pending source-backed sibling-submodule mapping and real train/eval impact artifacts"

