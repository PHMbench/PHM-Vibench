status_date: "2026-05-11"
paper_id: "1D-2D_fusion_explainable"
scope: "Command-bound baseline and fusion-ablation matrix for Paper 02."
evidence_level: "baseline config-target validated; fusion ablation smoke runner bound"
submission_ready: false
base_config: "paper/UXFD_paper/1D-2D_fusion_explainable/configs/vibench/min.yaml"
validation_note: >
  The commands below bind the 1D-2D Fusion comparison surface to concrete
  PHM-Vibench and paper-local entrypoints. They validate wiring and limited
  dummy-data behavior only. They do not satisfy the strict IEEE gate because
  accepted CWRU/XJTU multi-seed artifacts, real 1D-2D fusion/alignment
  ablations, 2x4090 GPU metadata, TOP representatives, and accepted final
  figure artifacts are still missing.

common_policy:
  devices: "local RTX 4090 GPUs 0,1 only"
  default_binding: "CUDA_VISIBLE_DEVICES=0"
  scheduler: "one GPU per run; at most two concurrent single-GPU jobs"
  required_metadata:
    - "CUDA_VISIBLE_DEVICES"
    - "GPU model"
    - "seed"
    - "batch size"
    - "precision"
    - "runtime"
    - "dataset split"
    - "OOM or failure reason"

