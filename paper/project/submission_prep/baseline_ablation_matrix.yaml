  config_target_validated: true
  dummy_smoke_status: "pass in LQ_signal on dummy data; CPU fallback because GPU/NVML unavailable"
  dummy_smoke_metric: "test_loss=0.7205665111541748, test_acc_Dummy_Data=0.0"
  accepted_evidence_status: "pending same-protocol CWRU/XJTU or industrial GPU run"

