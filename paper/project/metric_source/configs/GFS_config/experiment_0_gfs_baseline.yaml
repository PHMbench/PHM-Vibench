# Experiment 0 (GFS view, optional): Backbone+Head Few-Shot Baseline

environment:
  VBENCH_HOME: "/home/user/LQ/B_Signal/Signal_foundation_model/Vbench"
  project: "experiment_0_gfs_baseline"
  seed: 42
  output_dir: "results/experiment_0_gfs_baseline"
  notes: "Experiment 0 (GFS, optional): Backbone+Head few-shot baseline per system"
  iterations: 1

data:
  data_dir: "/home/user/data/PHMbenchdata/PHM-Vibench"
  metadata_file: "metadata.xlsx"
  batch_size: 256
  num_workers: 8
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization: "standardization"
  window_size: 4096
  stride: 5
  num_window: 64
  dtype: "float32"
  pin_memory: true

model:
  name: "M_01_ISFM"
  type: "ISFM"
  embedding: "E_03_Patch"
  backbone: "B_01_basic_transformer"
  task_head: "H_01_Linear_cla"
  input_dim: 2
  d_model: 256
  output_dim: 128
  num_heads: 4
  num_layers: 2
  e_layers: 2
  d_ff: 256
  dropout: 0.1
  activation: "relu"
  patch_size_L: 128
  patch_size_C: 1
  num_patches: 32
  use_prompt: false
  prompt_dim: 0

task:
  name: "classification"
  type: "GFS"
  target_system_id: [1]
  target_domain_num: 1
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  early_stopping: true
  es_patience: 10
  loss: "CE"
  metrics: ["acc", "f1", "precision", "recall"]
  num_episodes: 100
  num_systems: 1
  num_domains: 1
  num_labels: 3
  num_support: 5
  num_query: 15

trainer:
  name: "Default_trainer"
  monitor: "val_loss"
  max_epochs: 30
  devices: 1
  device: "cuda"
  accelerator: "gpu"
  precision: 16
  auto_select_gpus: true
  progress_bar_refresh_rate: 20
  check_val_every_n_epoch: 5
  deterministic: true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  use_wandb: true
  save_checkpoints: true
  log_every_n_steps: 10
  save_dir: "results/experiment_0_gfs_baseline"
  early_stopping: true
  patience: 10
  wandb: false

pipeline:
  name: "Pipeline_01_default"

