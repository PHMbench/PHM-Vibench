# UXFD paper pilot config (vibench)
#
# Paper: 1D-2D_fusion_explainable
# Goal: provide a minimal, runnable config that exercises the PHM‑Vibench entrypoint and the UXFD core model.
#
# Note:
# - Today this config uses repo-shipped dummy data to unblock WP0 validation.
# - The "real" 1D↔2D fusion operators will be enabled by WP1/WP2 (core-model assembly).

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "uxfd_pilot_1d2d_fusion_explainable"
  seed: 0
  output_dir: "results/uxfd/pilot/1D-2D_fusion_explainable"
  notes: "WP0 pilot: dummy data + core model entrypoint (NSN wrapper over TSPN_UXFD)."

data:
  data_dir: "data"
  metadata_file: "metadata_dummy.csv"
  batch_size: 4
  num_workers: 0
  window_size: 128
  stride: 16
  num_window: 8

task:
  target_system_id: [0]
  source_domain_id: [0]
  target_domain_id: [1]

trainer:
  num_epochs: 1
  device: "cpu"
  gpus: 1
  paper_id: "1D-2D_fusion_explainable"
  preset_version: "vibench-min-v1"
  extensions:
    predictions:
      enable: true

model:
  type: "X_model"
  name: "NSN"
  device: "cpu"

  # Dummy_Data returns 2 columns; dataset windows become (B, L, C=2).
  in_dim: 128
  out_dim: 128
  in_channels: 2

  # Minimal TSPN settings (single Identity SP module + 2 simple features).
  out_channels: 4
  scale: 1
  skip_connection: true
  signal_processing_2d:
    enable: true
    stft:
      n_fft: 128
      hop_length: 64
    fusion:
      type: "gated"
  signal_processing_configs:
    layer1: ["I"]
  feature_extractor_configs: ["Mean", "Std"]
