# Fusion1D2D - THU_006数据集验证
# 额外的THU数据集验证实验

signal_processing_configs:
  layer1: ['HT','WF','I']
  layer2: ['I','WF','I']
  layer3: ['HT','WF','I']
  layer4: ['I','WF','I']

feature_extractor_configs: ['Mean', 'Std', 'Var', 'Entropy','Max', 'Min', 'AbsMean', 'Kurtosis', 'RMS', 'CrestFactor','Skewness', 'ClearanceFactor', 'ShapeFactor']

args:
  model: Fusion1D2D
  skip_connection: true
  scale: 4
  l1_norm: 0.0001
  num_epochs: 50
  patience: 15
  gpus: 1

  # THU_006数据集配置
  device: cuda
  data_dir: '/home/user/data/a_bearing/a_006_THU24_pro/'
  dataset_task: THU_006_basic
  target: 'IF'
  k_shot: 64
  num_classes: 5
  in_dim: 4096
  out_dim: 4096
  in_channels: 2
  out_channels: 3
  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1
  learning_rate: 0.001
  batch_size: 64
  weight_decay: 0.0001
  num_workers: 8
  seed: 17
  monitor: 'val_loss'
  pruning: None
  snr: 0
  experiment_type: 'multi_dataset_validation'
  description: 'Fusion1D2D在THU_006数据集上的多数据集验证实验'