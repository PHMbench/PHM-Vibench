[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phm-data-factory"
version = "0.1.0"
description = "Agent-ready PHM metadata, HDF5, and Apache IoTDB data access layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PHMbench" }]
dependencies = ["numpy>=1.20", "pandas>=1.3", "h5py>=3.7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
yaml = ["PyYAML>=6.0"]
iotdb = ["apache-iotdb>=2.0.8,<3"]
agent = ["mcp[cli]>=1.27,<2"]
dev = ["pytest>=7", "PyYAML>=6", "openpyxl>=3"]
all = ["openpyxl>=3", "PyYAML>=6", "apache-iotdb>=2.0.8,<3", "mcp[cli]>=1.27,<2"]

[project.scripts]
phm-data = "phm_data_factory.cli:main"
phm-data-mcp = "phm_data_factory.mcp_server:main"
phm-data-iotdb = "phm_data_factory.iotdb:main"

[project.urls]
Repository = "https://github.com/PHMbench/PHM-Vibench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phm_data_factory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
