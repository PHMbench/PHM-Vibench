schema_version: "0.3.0"
protocol_id: "phm_genbench_v3"

target:
  signal_shape: "[N,C,L]"
  condition_keys:
    - fault_label
    - domain_id
  optional_domain_metadata:
    - load
    - rpm
    - system_id
    - sampling_rate

splits:
  source_split: "train"
  reference_split: "train"
  forbidden_source_splits:
    - val
    - valid
    - validation
    - test
    - target_test
  allow_test_reference_eval: false

methods:
  core:
    - conditional_flow_matching
    - rectified_flow
    - ddpm_epsilon
  exploratory:
    - score_sde
    - meanflow
    - drifting_flow
    - transition_flow_matching
    - ot_nfm

metrics:
  quality:
    - temporal
    - spectral
    - distribution
    - diversity
  utility:
    - nearest_centroid_tstr
    - nearest_centroid_trts
  leakage:
    - nearest_neighbor_l2
    - duplicate_rate
  efficiency:
    - parameter_count
    - sampling_nfe
    - samples_per_second

validity:
  benchmark_valid_requires:
    - config_hash
    - protocol_hash
    - dependency_lock_hash
    - normalization_params
    - condition_counts
    - leakage_checks
    - metric_status_reason_recorded
    - stage_ledger
