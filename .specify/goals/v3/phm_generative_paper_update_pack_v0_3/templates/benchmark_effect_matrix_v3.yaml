benchmark:
  id: "phm_genbench_six_dataset_submission_v3"
  output_dir: "results/paper/phm_generative/six_dataset_submission_v3"
  baseline_method: "cfm_grid"
  min_datasets: 6
  python: "python"
  seeds: [0, 1]
  resource:
    gpu_ids: [6, 7]
    max_parallel_runs: 2
    require_cuda: true
  data_check:
    data_dir: "/path/to/PHM-Vibench"
    metadata_file: "metadata.xlsx"
  overrides:
    data.data_dir: "/path/to/PHM-Vibench"
    data.metadata_file: "metadata.xlsx"
    data.normalization: "standardization"
    data.num_workers: 4
    trainer.device: "cuda"
    trainer.gpus: 1

datasets:
  - dataset: "RM_001_CWRU"
    dataset_id: 1
    name: "CWRU"
    overrides:
      task.target_system_id: [1]
      task.source_domain_id: [0, 1, 2]
      task.target_domain_id: [3]

methods:
  - method: "cfm_grid"
    label: "Conditional Flow Matching"
    train_config: "configs/paper/phm_generative/cfm_train_grid_seed0.yaml"
    condition_sampling_policy: "grid"
  - method: "rectified_flow_grid"
    label: "Rectified Flow"
    train_config: "configs/paper/phm_generative/rectified_flow_train_grid_seed0.yaml"
    condition_sampling_policy: "grid"
  - method: "ddpm_train_distribution"
    label: "DDPM Epsilon"
    train_config: "configs/paper/phm_generative/ddpm_train_distribution_seed0.yaml"
    condition_sampling_policy: "train_distribution"
